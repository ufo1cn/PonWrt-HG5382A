name: 【独立包编译】PonWrt HG5585F-CT 全部可选IPK（编译成功后预发布｜防循环依赖+防Tag重复）
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: ipk-hg5585f-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_ipk:
    name: 编译HG5585F-CT全部独立插件包
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SOURCE_REF: d01485cc909fac33144dc07fa9dc05ed4455380f
      TAR_NAME: HG5585F-CT-all-ipk.tar.zst
      SHA_NAME: SHA256SUMS
    steps:
      - name: 签出工作流仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache
          sudo docker system prune -af || true
          sudo apt-get clean
          sudo swapoff /swapfile || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd \
            libzstd-dev jq dos2unix upx-ucl

      - name: 拉取 PonWrt 指定 commit
        run: |
          git init ponwrt
          git -C ponwrt remote add origin https://github.com/pbs05/ponwrt.git
          git -C ponwrt fetch --depth=1 -- origin "$SOURCE_REF"
          git -C ponwrt checkout --detach FETCH_HEAD
          echo ">>> PonWrt pinned: $SOURCE_REF"

      - name: 配置 feeds
        working-directory: ./ponwrt
        run: |
          if [ ! -f feeds.conf.default ]; then touch feeds.conf.default; fi
          sed -i '/nikki/d;/homeproxy/d;/openwrt-iptv/d;/emortal/d' feeds.conf.default
          [ -n "$(tail -c1 feeds.conf.default 2>/dev/null)" ] && echo "" >> feeds.conf.default
          echo 'src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main' >> feeds.conf.default
          echo 'src-git iptv https://github.com/yveming/openwrt-iptv.git' >> feeds.conf.default
          echo 'src-git emortal https://github.com/emortal/OpenWrt-packages.git;main' >> feeds.conf.default
          dos2unix feeds.conf.default 2>/dev/null || true
          cat feeds.conf.default
          ./scripts/feeds update -a

      - name: 前置依赖检查 & 分步 feeds install（防循环依赖）
        working-directory: ./ponwrt
        run: |
          set -e
          # 基础内核、存储、USB、网络驱动组
          ./scripts/feeds install \
            kmod-airoha-paged-bosa kmod-airoha-pon-frontend kmod-airoha-xpon \
            airoha-ponctl airoha-pond \
            kmod-tun kmod-tap kmod-nft-tproxy kmod-nft-socket kmod-inet-diag kmod-dummy \
            kmod-iptv omcproxy luci-app-omcproxy \
            kmod-usb-xhci kmod-usb-storage kmod-usb-storage-extras \
            kmod-fs-ext4 kmod-fs-vfat kmod-fs-ntfs3 block-mount usbutils \
            kmod-video-v4l2 kmod-video-uvc kmod-usb-serial kmod-usb-net \
            kmod-rtw88 kmod-rtw88-usb kmod-rtw88-8822c kmod-rtw88-8822cu \
            usb-modeswitch usb-modeswitch-data kmod-rtl8723bu

          # 代理、基础工具
          ./scripts/feeds install mihomo-meta nikki luci-app-nikki luci-i18n-nikki-zh-cn
          ./scripts/feeds install curl libcurl libidn2 libnghttp2 libpsl \
            libgnutls libtasn1 libunistring nettle gmp \
            ip-full yq libcronet luci-app-ttyd luci-app-ddns ddns-scripts openssh-sftp-server

          # SMB共享组
          ./scripts/feeds install samba4 luci-app-samba4 autosamba
          ./scripts/feeds install ksmbd luci-app-ksmbd

          # NFS组
          ./scripts/feeds install \
            nfs-kernel-server nfs-kernel-server-utils \
            nfs-utils nfs-utils-libs \
            kmod-fs-nfs-common kmod-fs-nfs kmod-fs-nfs-v4 kmod-fs-nfsd

          # mDNS
          ./scripts/feeds install avahi-daemon luci-app-avahi

          # VPN互联组（分组安装，降低依赖树爆炸概率）
          ./scripts/feeds install zerotier luci-app-zerotier
          ./scripts/feeds install tailscale luci-app-tailscale
          ./scripts/feeds install wireguard luci-proto-wireguard kmod-wireguard
          ./scripts/feeds install nebula luci-proto-nebula
          ./scripts/feeds install n2n luci-app-n2n
          ./scripts/feeds install frpc luci-app-frpc

          # 串口服务器
          ./scripts/feeds install gensio ser2net luci-app-ser2net

          # IPTV相关
          ./scripts/feeds install luci-app-iptv

          echo ">>> feeds install 全部分组完成，开始依赖树检查"
          make prereq

      - name: 注入 libffi
        working-directory: ./ponwrt
        run: |
          mkdir -p package/libs/libffi
          curl -fsSL -o package/libs/libffi/Makefile \
            https://raw.githubusercontent.com/openwrt/openwrt/master/package/libs/libffi/Makefile
          grep -q 'PKG_NAME:=libffi' package/libs/libffi/Makefile && echo ">>> libffi 注入成功" || exit 1

      - name: 克隆 luci-app-airoha-npu
        working-directory: ./ponwrt
        run: |
          rm -rf package/luci-app-airoha-npu
          git clone --depth=1 https://github.com/rchen14b/luci-app-airoha-npu.git package/luci-app-airoha-npu
          if [ -f package/luci-app-airoha-npu/.gitmodules ]; then
            git -C package/luci-app-airoha-npu submodule update --init --recursive --depth=1
          fi
          rm -rf package/luci-app-airoha-npu/.git package/luci-app-airoha-npu/.github package/luci-app-airoha-npu/screenshots
          rm -rf package/luci-app-airoha-npu/luci-app-airoha-npu
          grep -m1 'LUCI_TITLE' package/luci-app-airoha-npu/Makefile || echo "::warning::未找到 LUCI_TITLE"

      - name: 预修改 luci-app-iptv Makefile
        working-directory: ./ponwrt
        run: |
          if [ -f pon_userspace/luci-app-iptv/Makefile ]; then
            MK="pon_userspace/luci-app-iptv/Makefile"
            cp -f "$MK" "$MK.orig"
            sed -i 's/+kmod-iptv/kmod-iptv/g' "$MK"
            sed -i '/\/etc\/config\/iptv/d' "$MK"
            sed -i '/\/etc\/init\.d\/iptv/d' "$MK"
            echo ">>> luci-app-iptv Makefile 预修改完成"
          fi

      - name: 应用 GPON feed 补丁
        env:
          PONWRT_DIR: ponwrt
          FEED_PATCHES_STRICT: '1'
        run: bash scripts/apply-feed-patches.sh

      - name: 生成基础配置，锁定HG5585F-CT机型
        working-directory: ./ponwrt
        run: |
          rm -rf tmp
          perl ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config
          make defconfig

          sed -i '/CONFIG_TARGET_ALL_PROFILES/d' .config
          sed -i '/CONFIG_TARGET_MULTI_PROFILE/d' .config
          sed -i '/CONFIG_TARGET_airoha_an7581_DEVICE_/d' .config
          sed -i '/CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config

          cat >> .config << 'EOF'
          # CONFIG_TARGET_ALL_PROFILES is not set
          # CONFIG_TARGET_MULTI_PROFILE is not set
          CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y
          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y
          EOF

          make WARN_RECURSIVE_DEP=1 olddefconfig
          sp=$(grep -cE '^CONFIG_TARGET_airoha_an7581_DEVICE_.*=y$' .config || true)
          if [ "$sp" -ne 1 ] || ! grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y$'; then
            echo "::error::HG5585F-CT 机型锁定校验失败！"; exit 1
          fi
          echo ">>> 机型配置校验OK"

      - name: 批量设置目标包为 =m
        working-directory: ./ponwrt
        run: |
          set_pkg_m() {
            local pkg="$1"
            sed -i "/^CONFIG_PACKAGE_${pkg}/d" .config
            echo "CONFIG_PACKAGE_${pkg}=m" >> .config
          }

          pkg_list=(
            luci-app-iptv
            luci-app-airoha-npu
            luci-app-blueaudio
            luci-app-btsp
            luci-app-camlive
            gensio
            ser2net
            luci-app-ser2net
            samba4
            luci-app-samba4
            autosamba
            ksmbd
            luci-app-ksmbd
            avahi-daemon
            luci-app-avahi
            nfs-kernel-server
            nfs-kernel-server-utils
            nfs-utils
            nfs-utils-libs
            kmod-fs-nfs-common
            kmod-fs-nfs
            kmod-fs-nfs-v4
            kmod-fs-nfsd
            kmod-rtw88
            kmod-rtw88-usb
            kmod-rtw88-8822c
            kmod-rtw88-8822cu
            usb-modeswitch
            usb-modeswitch-data
            kmod-rtl8723bu
            mihomo-alpha
            zerotier
            luci-app-zerotier
            tailscale
            luci-app-tailscale
            wireguard
            luci-proto-wireguard
            kmod-wireguard
            nebula
            luci-proto-nebula
            n2n
            luci-app-n2n
            frpc
            luci-app-frpc
          )

          for p in "${pkg_list[@]}"; do
            set_pkg_m "$p"
          done
          make WARN_RECURSIVE_DEP=1 olddefconfig
          echo ">>> 所有包设为模块，依赖解析完成"

      - name: 下载源码包
        working-directory: ./ponwrt
        run: |
          export GOPROXY=https://goproxy.cn,https://goproxy.io,direct
          export GO111MODULE=on
          make download -j"$(nproc)" || true
          find dl -type f -size -1024c ! -path 'dl/go-mod-cache/*' -delete
          make download -j1 V=s || { echo "::warning::仍有下载失败"; }
          find dl -type f -size -1024c ! -path 'dl/go-mod-cache/*' -delete

      - name: 批量编译全部模块 package/compile
        working-directory: ./ponwrt
        run: |
          export GOPROXY=https://goproxy.cn,https://goproxy.io,direct
          export GO111MODULE=on
          set -o pipefail
          mkdir -p ../build_log
          make WARN_RECURSIVE_DEP=1 package/compile -j"$(nproc)" V=s 2>&1 | tee ../build_log/full-build.log
          echo ">>> package/compile 执行结束"

      - name: 收集全部IPK
        working-directory: ./ponwrt
        run: |
          mkdir -p ../ipk_out
          pkg_list=(
            luci-app-iptv
            luci-app-airoha-npu
            luci-app-blueaudio
            luci-app-btsp
            luci-app-camlive
            gensio
            ser2net
            luci-app-ser2net
            samba4
            luci-app-samba4
            autosamba
            ksmbd
            luci-app-ksmbd
            avahi-daemon
            luci-app-avahi
            nfs-kernel-server
            nfs-kernel-server-utils
            nfs-utils
            nfs-utils-libs
            kmod-fs-nfs-common
            kmod-fs-nfs
            kmod-fs-nfs-v4
            kmod-fs-nfsd
            kmod-rtw88
            kmod-rtw88-usb
            kmod-rtw88-8822c
            kmod-rtw88-8822cu
            usb-modeswitch
            usb-modeswitch-data
            kmod-rtl8723bu
            mihomo-alpha
            zerotier
            luci-app-zerotier
            tailscale
            luci-app-tailscale
            wireguard
            luci-proto-wireguard
            kmod-wireguard
            nebula
            luci-proto-nebula
            n2n
            luci-app-n2n
            frpc
            luci-app-frpc
          )
          for pkg in "${pkg_list[@]}"; do
            found=0
            while IFS= read -r -d '' f; do
              cp -f "$f" ../ipk_out/
              found=1
            done < <(find bin -type f \( -name "${pkg}*.ipk" \) -print0 )
            [ "$found" -eq 1 ] && echo ">>> 已收集 $pkg" || echo "::notice::$pkg 未生成，跳过"
          done
          ls -lh ../ipk_out/*.ipk 2>/dev/null || true

      - name: 打包制品 & 生成校验和
        run: |
          mkdir -p release_out
          cp -f ipk_out/* release_out/ 2>/dev/null || true
          cd release_out
          shopt -s nullglob
          files=( *)
          [ "${#files[@]}" -eq 0 ] && { echo "::error::无IPK产出，终止发布"; exit 1; }
          tar --zstd -cf ../${{ env.TAR_NAME }} "${files[@]}"
          sha256sum ../${{ env.TAR_NAME }} > ../${{ env.SHA_NAME }}
          ls -lh ../

      - name: 制品存在校验
        run: |
          if [ ! -f "${{ env.TAR_NAME }}" ] || [ ! -f "${{ env.SHA_NAME }}" ]; then
            echo "::error::制品缺失，禁止发布"
            exit 1
          fi

      - name: 生成唯一Tag（自动防重）
        id: taggen
        run: |
          BASE_TAG="ipk-$(date +%Y%m%d-%H%M)"
          TAG="${BASE_TAG}"
          SUFFIX=1
          while gh api -s "/repos/${{ github.repository }}/git/ref/tags/${TAG}" >/dev/null 2>&1; do
            TAG="${BASE_TAG}-${SUFFIX}"
            SUFFIX=$((SUFFIX+1))
          done
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "Final tag: ${TAG}"

      - name: 预发布 Release（仅编译成功才执行）
        if: success()
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ${{ steps.taggen.outputs.TAG }}
          name: PonWrt HG5585F-CT IPK 插件包 ${{ steps.taggen.outputs.TAG }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            【预发布｜HG5585F-CT 独立IPK插件包】
            基准源码 commit: `${{ env.SOURCE_REF }}`
            编译方式：`make package/compile`，分组 feeds install 规避循环依赖
            ✅ 包含组件：
            1. luci-app-iptv、luci-app-airoha-npu、luci-app-blueaudio、luci-app-btsp、luci-app-camlive
            2. ser2net4串口服务器套件：gensio、ser2net、luci-app-ser2net
            3. SMB共享两套（运行时二选一）
               - samba4 + luci-app-samba4 + autosamba
               - ksmbd + luci-app-ksmbd
            4. NFS服务套件
            5. mDNS局域网发现 avahi-daemon + luci-app-avahi
            6. USB网卡驱动：rtw88、rtl8723bu、usb-modeswitch
            7. mihomo-alpha（和固件内置mihomo-meta互斥）
            8. 远程Mesh互联VPN（CGNAT可用，运行时**只启用一个**）
               ZeroTier / Tailscale / WireGuard / Nebula / N2N / FRP frpc
            ⚠️ 重要提醒
            - 全部为模块ipk，编译阶段共存；运行阶段大量服务互斥
            - SMB两套不能同时启用；多VPN不要同时运行
            - 校验文件：`SHA256SUMS`
            - 日志与.config一并上传，用于排障
          files: |
            ${{ env.TAR_NAME }}
            ${{ env.SHA_NAME }}
            build_log/full-build.log
            ponwrt/.config

      - name: 上传IPK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-HG5585F-CT-all-ipk
          path: |
            ./ipk_out/
            ./${{ env.TAR_NAME }}
            ./${{ env.SHA_NAME }}
          if-no-files-found: warn
          retention-days: 14

      - name: 上传完整编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IPK-build-diagnostics
          path: |
            ponwrt/.config
            build_log/full-build.log
          if-no-files-found: ignore
          retention-days: 3
