# ============================================================================
# SDK 分包编译工作流：单独编译上层IPK，不编译完整固件
# 配套：PonWrt HG5585F-CT an7581
# 依赖：整机固件编译产出的 SDK tar.gz
# 新增包前必读：核对上游仓库README / Makefile / submodule / 平台支持
# ============================================================================
name: SDK 分包编译 IPK
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sdk-hg5585f-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sdk-pkg:
    name: SDK 编译上层软件包
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SOURCE_REF: d01485cc909fac33144dc07fa9dc05ed4455380f
      SDK_ARTIFACT_NAME: PonWrt-HG5585F-CT-integrated
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 释放磁盘 + 交换分区
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker system prune -af || true
          sudo apt-get clean
          sudo swapoff /swapfile || true
          sudo fallocate -l 6G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=6144
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd \
            libzstd-dev jq dos2unix upx-ucl

      - name: 下载整机固件产出的 SDK 归档
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SDK_ARTIFACT_NAME }}
          path: ./sdk_download
        continue-on-error: false

      - name: 解压 OpenWrt SDK
        run: |
          mkdir -p sdk
          cd sdk_download
          SDK_FILE=$(find . -maxdepth 1 -name "openwrt-sdk-*.tar.xz" | head -1)
          if [ -z "$SDK_FILE" ]; then
            echo "::error::没有找到 openwrt-sdk-*.tar.xz，整机固件编译没有导出SDK！"
            exit 1
          fi
          tar -xf "$SDK_FILE" -C ../sdk
          cd ../sdk
          SDK_ROOT=$(find . -maxdepth 1 -type d | grep -v '^\.$' | head -1)
          echo "SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "SDK路径: sdk/$SDK_ROOT"

      - name: 进入SDK目录，初始化feeds
        working-directory: ./sdk/${{ env.SDK_ROOT }}
        run: |
          # 外挂源和整机保持一致，保证依赖版本对齐
          echo "src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main" > feeds.conf.default
          echo "src-git homeproxy https://github.com/immortalwrt/homeproxy.git;master" >> feeds.conf.default
          echo "src-git iptv https://github.com/yveming/openwrt-iptv.git" >> feeds.conf.default
          dos2unix feeds.conf.default 2>/dev/null || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 可选：argon主题
          if [ -f feeds/luci/collections/luci/Makefile ]; then
            sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile || true
          fi

      - name: 【可选】新增自定义包（clone 到 package，自动处理submodule）
        working-directory: ./sdk/${{ env.SDK_ROOT }}
        run: |
          # 示例模板，后续新增包在这里追加，记得先核对上游仓库
          # rm -rf package/xxx-app
          # git clone --depth=1 https://github.com/xxx/xxx-app.git package/xxx-app
          # if [ -f package/xxx-app/.gitmodules ]; then
          #   echo ">>> 检测到子模块，同步 submodule"
          #   git -C package/xxx-app submodule update --init --recursive --depth=1
          # fi
          echo ">>> 如需新增包，在本步骤添加clone脚本，先核查上游文档"

      - name: 配置需要编译的包（samba4 / nfs / cups / mjpg-streamer）
        working-directory: ./sdk/${{ env.SDK_ROOT }}
        run: |
          rm -rf .config tmp
          echo "CONFIG_PACKAGE_samba4=y" > .config
          echo "CONFIG_PACKAGE_luci-app-samba4=y" >> .config
          echo "CONFIG_PACKAGE_nfs-kernel-server=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-nfs=y" >> .config
          echo "CONFIG_PACKAGE_cups=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-cups=y" >> .config
          echo "CONFIG_PACKAGE_mjpg-streamer=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mjpg-streamer=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_TAR=y" >> .config
          make clean

      - name: 编译选中软件包
        working-directory: ./sdk/${{ env.SDK_ROOT }}
        run: |
          make -j$(nproc) package/compile

      - name: 收集IPK产物
        working-directory: ./sdk/${{ env.SDK_ROOT }}
        run: |
          mkdir -p ipk_out
          find bin/packages/ -name "*.ipk" -exec cp {} ipk_out/ \;
          ls -la ipk_out/

      - name: 上传IPK制品
        uses: actions/upload-artifact@v4
        with:
          name: sdk-ipk-output
          path: ./sdk/${{ env.SDK_ROOT }}/ipk_out/
          retention-days: 30
