name: 发布固件到 Releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空则自动生成）'
        required: false
        default: ''

permissions:
  actions: read      # 读取其他工作流的 Artifact
  contents: write    # 创建 Release 并上传附件

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # ===== 1. PonWrt1.yml：主固件 =====
      - name: 下载 PonWrt1 固件产物
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: PonWrt1.yml
          workflow_conclusion: success
          name: PonWrt-HG5382A-integrated
          path: release-assets/firmware
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # ===== 2. PonWrt1.yml：软件包 =====
      - name: 下载 PonWrt1 软件包产物
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: PonWrt1.yml
          workflow_conclusion: success
          name: ponwrt-ipk-packages
          path: release-assets/packages
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # ===== 3. build-package.yml：暂时没有产物，容错跳过 =====
      # 以后有产物时，把 name 改成实际 Artifact 名称，并删除 continue-on-error
      - name: 下载 build-package 产物（暂缺，容错）
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: build-package.yml
          workflow_conclusion: success
          name: ponwrt-build-package      # ← 以后有产物时改成实际名称
          path: release-assets/packages-build
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # ===== 4. build-sdk.yml：SDK =====
      - name: 下载 SDK 产物
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build-sdk.yml
          workflow_conclusion: success
          name: openwrt-sdk-an7581
          path: release-assets/sdk
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # ===== 5. 检查下载结果 =====
      - name: 检查产物
        run: |
          echo "===== release-assets 结构 ====="
          find release-assets -type f | sort || true
          COUNT=$(find release-assets -type f | wc -l)
          echo "===== 文件数量: $COUNT ====="
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::没有下载到任何产物，终止发布"
            exit 1
          fi

      # ===== 6. 摊平并发布 =====
      - name: 创建 Release 并上传全部产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="build-$(date +%Y%m%d-%H%M%S)"
          fi
          echo ">>> 使用 tag: $TAG"

          mkdir -p upload
          for dir in firmware packages packages-build sdk; do
            if [ -d "release-assets/$dir" ]; then
              find "release-assets/$dir" -type f | while read -r f; do
                base="$(basename "$f")"
                if [ -e "upload/$base" ]; then
                  echo "::warning::同名文件已存在，跳过: $base（来自 $dir）"
                else
                  cp "$f" "upload/$base"
                fi
              done
            fi
          done

          echo "===== 最终上传文件 ====="
          ls -lh upload
          if [ -z "$(ls -A upload)" ]; then
            echo "::error::upload 目录为空，终止发布"
            exit 1
          fi

          gh release create "$TAG" upload/* \
            --repo ${{ github.repository }} \
            --title "PonWrt HG5382A 集成版 $TAG" \
            --notes "包含固件、软件包、SDK 三类产物。编译 commit: ${{ github.sha }}" \
            --draft
