# ==============================================================================
# PonWrt HG5585F-CT 应用层软件包编译工作流（只出 apk/ipk，不产固件）
# ------------------------------------------------------------------------------
# 【定位】固件（build-hg5585f.yml）只负责"能开机 + 底层驱动"，应用层由本文件负责。
#
# 一、为什么单独拆出来
#   1) 应用层软件数量多、上游更新快、编译容易失败；放在固件流水线里，
#      任何一个应用编译失败都会拖住整份固件产出。
#   2) 拆开后固件流水线只关心"内核/驱动"，成功率与耗时都可控；
#      应用层随时可以重编，不影响已在用的固件。
#   3) 应用层软件装错/装坏可以卸载重装，不需要重新刷机。
#
# 二、与固件的关系（必须保持一致的两件事）
#   1) 同一个 SOURCE_REF（PonWrt 源码版本）——版本不一致会出现依赖名对不上。
#   2) 同一套内核配置（DRIVER_KCONFIGS）——本文件会把和固件一样的 CONFIG_KERNEL_*
#      覆盖写进 .config，保证万一需要在这里补编某个 kmod，其 vermagic 与固件一致。
#
# 三、为什么这里不再逐个枚举 feeds install 的包名
#   历史版本写了 kmod-usb-xhci / kmod-video-v4l2 / usb-modeswitch(-data) /
#   kmod-rtl8723bu 这些**在这套树里根本不存在的包名**，配合 set -e 会让整条
#   流水线在第一步就失败。现在统一用 `feeds install -a` 全量安装，
#   包名的正确性只在"写 .config 的 pkg_list"阶段才有意义。
#
# 四、pkg_list 的两处用途
#   - 第 1 处：把清单里的包设为 =m，随后 make package/compile 统一编译
#   - 第 2 处：编译完成后按清单把 .apk/.ipk 收进 ipk_out 供打包
#   两处必须保持同一份清单，否则会出现"编出来了但没被收集"。
#
# 五、本文件是 mihomo-alpha 变体（另一个变体是 build-package.yml = mihomo-meta）
#   - meta：稳定分支，nikki 官方默认，功能完整
#   - alpha：更新更快、实验特性多，稳定性略差
#   - 两者只能装一个；产物文件名已带 -mihomo-alpha 前缀，不会和 meta 版混淆
#
# 五、互斥注意
#   mihomo-meta 与 mihomo-alpha 都 PROVIDES:=mihomo，二者只能选一个。
#   本工作流统一用 mihomo-alpha（nikki 依赖的虚拟名 mihomo 由它提供）。
#   与 build-package.yml（mihomo-meta 版）**互斥**：二者都 PROVIDES:=mihomo，
#   同一份 .config 里只能存在一个，所以拆成两个工作流，各自产出完整的一套 apk，
#   你按需要装哪一版就只跑哪一条，装错版本会导致 mihomo 同名文件冲突。
# ==============================================================================
name: 【独立包编译·仅 mihomo-alpha】PonWrt HG5585F-CT mihomo-alpha（编译成功后预发布｜防Tag重复）
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: ipk-hg5585f-alpha-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_ipk:
    name: 只编译 HG5585F-CT 的 mihomo-alpha 独立包
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    env:
      SOURCE_REF: d01485cc909fac33144dc07fa9dc05ed4455380f
      TAR_NAME: HG5585F-CT-mihomo-alpha.tar.zst
      SHA_NAME: SHA256SUMS
      # 与 build-hg5585f.yml 保持同一套内核配置：万一在这里补编 kmod，
      # 生成的 .ko 的 vermagic 才会和固件匹配，装得上也加载得上。
      # kmod-fs-nfs 的 nfs.ko 链接依赖 lockd.ko / sunrpc.ko（fs.mk 里 kmod-fs-nfs-common 的 KCONFIG=CONFIG_LOCKD/CONFIG_SUNRPC 负责产出），
      # 但本工作流的内核配置是先 olddefconfig 再固化 9318 个符号，这两个符号被固化成内置 → .ko 不存在，
      # 打包时报 Package kmod-fs-nfs is missing dependencies for the following libraries: lockd.ko / sunrpc.ko
      # （alpha run 43937318449 第 18 步 full-build.log 145048-145050）。这里显式压回 =m，产出真正的 .ko 提供者。
      DRIVER_KCONFIGS: >-
        CONFIG_USB_USBNET CONFIG_USB_SERIAL CONFIG_USB_SERIAL_CH341 CONFIG_USB_SERIAL_CP210X CONFIG_USB_SERIAL_FTDI_SIO
        CONFIG_USB_SERIAL_PL2303 CONFIG_USB_ACM CONFIG_USB_WDM CONFIG_BT CONFIG_BT_HCIBTUSB
        CONFIG_BT_HCIUART CONFIG_RTW88 CONFIG_RTW88_USB CONFIG_RTW88_8822C CONFIG_RTW88_8822CU
        CONFIG_RTW88_8821C CONFIG_RTW88_8821CU CONFIG_RTW88_8723D CONFIG_RTW88_8723DU CONFIG_RTL8XXXU
        CONFIG_RTL8192CU CONFIG_CFG80211 CONFIG_MAC80211 CONFIG_NETLINK_DIAG CONFIG_USB_HID
        CONFIG_HID CONFIG_WIREGUARD CONFIG_CFG80211 CONFIG_MAC80211 CONFIG_RTW88
        CONFIG_RTW88_USB CONFIG_RTW88_8822CU CONFIG_RTW88_8821CU CONFIG_RTW88_8723DU CONFIG_RTW88_8822CE
        CONFIG_RTW88_8821CE CONFIG_RTL8XXXU CONFIG_RTL8192CU CONFIG_NET_AIROHA CONFIG_NET_AIROHA_NPU
        CONFIG_DEBUG_FS CONFIG_COMMON_CLK CONFIG_DEVMEM CONFIG_CIFS CONFIG_NFS_FS
        CONFIG_NFSD CONFIG_MACVLAN CONFIG_VETH CONFIG_BRIDGE CONFIG_BRIDGE_NF_EBTABLES
        CONFIG_NFT_NAT CONFIG_NF_NAT CONFIG_USB_STORAGE CONFIG_USB_UAS CONFIG_USB_XHCI_HCD
        CONFIG_SND CONFIG_SND_USB_AUDIO CONFIG_MEDIA_SUPPORT CONFIG_VIDEO_DEV CONFIG_USB_VIDEO_CLASS
        CONFIG_INET_DIAG CONFIG_TUN CONFIG_LOCKD CONFIG_SUNRPC CONFIG_GRACE_PERIOD
    steps:
      - name: 签出工作流仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install fixed apk signing key
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${APK_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::未配置 APK_SIGNING_PRIVATE_KEY，本次用 run 内临时密钥（跨 run 不可互信）"
            exit 0
          fi
          # rules.mk: BUILD_KEY_APK_SEC=$(TOPDIR)/private-key.pem / BUILD_KEY_APK_PUB=$(TOPDIR)/public-key.pem
          # 全仓库固定同一把密钥，设备只需装一次 /etc/apk/keys/public-key.pem
          printf '%s\n' "$APK_SIGNING_PRIVATE_KEY" > private-key.pem
          chmod 600 private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem
          sha256sum public-key.pem

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache
          sudo docker system prune -af || true
          sudo apt-get clean
          sudo swapoff /swapfile || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd \
            libzstd-dev jq dos2unix upx-ucl

      - name: 拉取 PonWrt 指定 commit
        run: |
          git init ponwrt
          git -C ponwrt remote add origin https://github.com/pbs05/ponwrt.git
          git -C ponwrt fetch --depth=1 -- origin "$SOURCE_REF"
          git -C ponwrt checkout --detach FETCH_HEAD
          echo ">>> PonWrt pinned: $SOURCE_REF"

      - name: 配置 feeds
        working-directory: ./ponwrt
        run: |
          if [ ! -f feeds.conf.default ]; then touch feeds.conf.default; fi
          sed -i '/nikki/d;/homeproxy/d;/openwrt-iptv/d' feeds.conf.default
          [ -n "$(tail -c1 feeds.conf.default 2>/dev/null)" ] && echo "" >> feeds.conf.default
          echo 'src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main' >> feeds.conf.default
          echo 'src-git iptv https://github.com/yveming/openwrt-iptv.git' >> feeds.conf.default
          # 说明：曾经加过 emortal/OpenWrt-packages，该仓库 404 会让 feeds update 整个失败，已移除
          # homeproxy 的 LuCI 应用 + sing-box 相关包（缺了它 sing-box 系全没有）
          echo 'src-git homeproxy https://github.com/immortalwrt/homeproxy.git;master' >> feeds.conf.default
          dos2unix feeds.conf.default 2>/dev/null || true
          cat feeds.conf.default
          ./scripts/feeds update -a

      - name: 注入 libffi（必须在 feeds install 之前）
        working-directory: ./ponwrt
        run: |
          # libffi 在 PonWrt 树里缺失，而 ruby / tvheadend / wayland 等包都依赖它。
          # 关键：必须在 feeds install 之前放进来，否则 feeds 扫描时找不到该包，
          # 这些依赖会退化成 "has a dependency on 'libffi', which does not exist" 的警告，
          # 后续真正编译时就会因为缺依赖失败。
          mkdir -p package/libs/libffi
          curl -fsSL -o package/libs/libffi/Makefile \
            https://raw.githubusercontent.com/openwrt/openwrt/master/package/libs/libffi/Makefile
          grep -q 'PKG_NAME:=libffi' package/libs/libffi/Makefile && echo ">>> libffi 注入成功" || exit 1

      - name: 前置依赖检查 & 分步 feeds install（防循环依赖）
        working-directory: ./ponwrt
        run: |
          set -e
          # 为什么不再逐个枚举包名：这条步骤原来写的 kmod-usb-xhci / kmod-video-v4l2 /
          # usb-modeswitch(-data) / kmod-rtl8723bu 在这套树里根本不存在，set -e 下会直接失败。
          # 包清单只在实际写 .config 的阶段使用（见后面的 pkg_list）。
          ./scripts/feeds install -a
          echo ">>> feeds 全量安装完成"
          # 注意：这里不要跑 make prereq。此时 .config 还没生成，make prereq 会进入
          # menuconfig（CI 无 TTY → "Error opening terminal: unknown"，直接把任务打断）。
          # 主机工具依赖会在后面 make defconfig 之后的正常构建流程里自检。
          echo ">>> 跳过 make prereq（原因见上），继续"

      - name: 克隆 luci-app-airoha-npu
        working-directory: ./ponwrt
        run: |
          rm -rf package/luci-app-airoha-npu
          git clone --depth=1 https://github.com/rchen14b/luci-app-airoha-npu.git package/luci-app-airoha-npu
          if [ -f package/luci-app-airoha-npu/.gitmodules ]; then
            git -C package/luci-app-airoha-npu submodule update --init --recursive --depth=1
          fi
          rm -rf package/luci-app-airoha-npu/.git package/luci-app-airoha-npu/.github package/luci-app-airoha-npu/screenshots
          rm -rf package/luci-app-airoha-npu/luci-app-airoha-npu
          grep -m1 'LUCI_TITLE' package/luci-app-airoha-npu/Makefile || echo "::warning::未找到 LUCI_TITLE"

      - name: 部署仓库自带的本地包到 package/pon-local
        working-directory: ./ponwrt
        run: |
          rm -rf package/pon-local
          mkdir -p package/pon-local
          # 动态遍历：pon_userspace 下新增任何包都会自动部署，
          # 不要写死列表（写死列表一旦漏项，编译阶段会报
          # "No rule to make target 'package/pon-local/xxx/compile'"）
          for d in $(ls -1 ../pon_userspace 2>/dev/null); do
            [ "$d" = "ser2net4" ] && continue
            if [ -d "../pon_userspace/$d" ]; then
              cp -a "../pon_userspace/$d" package/pon-local/
              if [ -f "package/pon-local/$d/Makefile" ]; then
                echo ">>> 复制 $d（含 Makefile）"
              else
                echo "::warning::$d 已复制但缺少 Makefile"
              fi
            fi
          done
          if [ -d "../pon_userspace/ser2net4" ]; then
            for d in gensio ser2net luci-app-ser2net; do
              [ -d "../pon_userspace/ser2net4/$d" ] && cp -a "../pon_userspace/ser2net4/$d" package/pon-local/ && echo ">>> 复制 $d"
            done
          fi
          MK=package/pon-local/luci-app-ser2net/Makefile
          if [ -f "$MK" ]; then
            sed -i 's|include $(TOPDIR)/luci.mk|include $(TOPDIR)/feeds/luci/luci.mk|' "$MK"
            sed -i '/\$(eval \$(call BuildPackage,luci-app-ser2net))/d' "$MK"
          fi
          ls -1 package/pon-local || true

      - name: 预修改 luci-app-iptv Makefile
        working-directory: ./ponwrt
        run: |
          if [ -f package/pon-local/luci-app-iptv/Makefile ]; then
            MK="package/pon-local/luci-app-iptv/Makefile"
            cp -f "$MK" "$MK.orig"
            sed -i 's/+kmod-iptv/kmod-iptv/g' "$MK"
            sed -i '/\/etc\/config\/iptv/d' "$MK"
            sed -i '/\/etc\/init\.d\/iptv/d' "$MK"
            echo ">>> luci-app-iptv Makefile 预修改完成"
          fi

      - name: 应用 GPON feed 补丁
        env:
          PONWRT_DIR: ponwrt
          FEED_PATCHES_STRICT: '1'
        run: bash scripts/apply-feed-patches.sh

      - name: 生成基础配置，锁定HG5585F-CT机型
        working-directory: ./ponwrt
        run: |
          rm -rf tmp
          perl ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config
          # WARN_RECURSIVE_DEP=1：这套树里 mihomo-meta/mihomo-alpha（互 PROVIDES/CONFLICTS）、
          # fwknopd、squeezelite-custom 存在上游 Kconfig 递归依赖，默认会硬报错中止 defconfig。
          # 这里只把该诊断降级为 warning，不做任何掩盖；本工作流仍只用 sel_variant 选一个 mihomo 变体。
          make WARN_RECURSIVE_DEP=1 defconfig

          # 锁机型：只允许存在一个 device，且必须是 HG5585F-CT。
          # 用 grep -xF（整行、固定字符串）计数并**始终**打印命中位置，
          # 不再用正则 + ^ 锚点去赌长文件里的行形态。
          sed -i '/^CONFIG_TARGET_ALL_PROFILES/d;/^# CONFIG_TARGET_ALL_PROFILES is not set$/d' .config
          sed -i '/^CONFIG_TARGET_MULTI_PROFILE/d;/^# CONFIG_TARGET_MULTI_PROFILE is not set$/d' .config
          sed -i '/^CONFIG_TARGET_airoha_an7581_DEVICE_.*=y$/d' .config
          sed -i '/^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_.*=y$/d' .config

          printf '%s\n' \
            '# CONFIG_TARGET_ALL_PROFILES is not set' \
            '# CONFIG_TARGET_MULTI_PROFILE is not set' \
            'CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y' \
            'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y' \
            'CONFIG_BUILD_PATENTED=y' \
            'CONFIG_PACKAGE_ca-bundle=y' >> .config

          devcnt=$(grep -cxF 'CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y' .config || true)
          anydev=$(grep -cE '^CONFIG_TARGET_airoha_an7581_DEVICE_[A-Za-z0-9_.-]+=y$' .config || true)
          echo ">>> 机型行命中次数 devcnt=$devcnt，任何设备行总数 anydev=$anydev"
          grep -nxF 'CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y' .config || echo "(未找到该行)"
          if [ "$devcnt" != "1" ] || [ "$anydev" != "1" ]; then
            echo "::error::HG5585F-CT 机型锁定校验失败（devcnt=$devcnt anydev=$anydev）"
            grep -nE '^CONFIG_TARGET_.*DEVICE' .config | head -n 20 || true
            exit 1
          fi
          echo ">>> 机型配置校验OK" 

      - name: 预编译 host 工具与工具链（独立包工作流必需）
        working-directory: ./ponwrt
        run: |
          # 为什么必须单独做这一步：
          # `make package/feeds/<feed>/<包名>/compile` 只编这个包，**不会**顺带把
          # tools/ 下的 host 工具编出来。于是解包/签名阶段就会报：
          #   bash: .../staging_dir/host/bin/libdeflate-gzip: No such file or directory
          #   bash: .../staging_dir/host/bin/openssl: No such file or directory
          # （实测分别卡住 NAS 的 host lua 和 libcronet 的 private-key.pem 生成）
          # 另外 target 包还需要工具链，否则 staging_dir/toolchain-* 不存在。
          # 这里先按 tools/Makefile 的清单逐个编 host 工具，再编工具链。
          mkdir -p logs
          TOOL_LIST="libdeflate libressl autoconf-archive sed coreutils patch tar zstd xz zlib expat m4 pkgconf \
                     autoconf automake libtool flex bison gnulib missing-macros \
                     util-linux findutils dosfstools mtools e2fsprogs squashfs4 \
                     mkimage sstrip patchelf cpio lzma ninja meson gengetopt \
                     mtd-utils padjffs2 patch-image mklibs fakeroot elfutils zip quilt"
          for t in $TOOL_LIST; do
            if [ -d "tools/$t" ]; then
              echo "=== tools/$t ==="
              set +e
              make -j1 V=s "tools/$t/compile" > "logs/host-tool-$t.log" 2>&1
              rc=$?
              set -e
              if [ $rc -ne 0 ]; then
                echo "::warning::tools/$t 编译失败(rc=$rc)，末尾 15 行："
                tail -n 15 "logs/host-tool-$t.log"
              fi
            else
              echo "=== 跳过 tools/$t（该工具不在本树里）==="
            fi
          done

          # 关键 host 可执行：缺一个后面必然崩，直接在这里明确报错
          for b in libdeflate-gzip openssl patch tar zstd; do
            if [ ! -x "staging_dir/host/bin/$b" ]; then
              echo "::error::host 工具 $b 未生成（staging_dir/host/bin 现状如下）"
              ls -l staging_dir/host/bin | head -n 30
              exit 1
            fi
          done
          echo ">>> host 工具就绪：$(staging_dir/host/bin/openssl version 2>/dev/null)"

          # 工具链：target 包编译的必要前提。
          # 光有 staging_dir/toolchain-* 目录还不够——package/libs/toolchain 打包 libgcc1 时
          # 要 cp staging_dir/toolchain-*/lib/libgcc_s.so.*，缺了就直接
          # 'cp: cannot stat .../libgcc_s.so.*' 并让**所有**包都失败（实测 36/36 全 FAIL）。
          # 所以这里既要编，也要验 libgcc_s 真的落地，缺则补跑 gcc final。
          if ! ls -d staging_dir/toolchain-* >/dev/null 2>&1; then
            echo "=== 工具链编译 ==="
            make -j$(nproc) V=s toolchain/compile > logs/toolchain.log 2>&1 || true
          fi
          if ! ls staging_dir/toolchain-*/lib/libgcc_s.so* >/dev/null 2>&1; then
            echo "=== libgcc_s 未落地，补跑 toolchain/gcc/final ==="
            make -j$(nproc) V=s toolchain/gcc/final/compile >> logs/toolchain.log 2>&1 || true
          fi
          if ! ls staging_dir/toolchain-*/lib/libgcc_s.so* >/dev/null 2>&1; then
            echo "::error::工具链不完整：libgcc_s.so 未生成（日志末尾 30 行 + find 结果如下）"
            tail -n 30 logs/toolchain.log || true
            find staging_dir/toolchain-* -name 'libgcc_s*' 2>/dev/null | head -n 20 || true
            ls -l staging_dir/toolchain-*/lib 2>/dev/null | head -n 20 || true
            exit 1
          fi
          echo ">>> 工具链就绪：$(ls -d staging_dir/toolchain-* | head -n 1)，libgcc_s=$(ls staging_dir/toolchain-*/lib/libgcc_s.so* | head -n 1)"

      - name: 写入与固件一致的内核配置覆盖
        working-directory: ./ponwrt
        run: |
          # 目的：让本工作流的内核配置和固件一致。这样即使有人在这里补编
          # 某个 kmod，产出的 .ko 也能在固件的内核上正常加载（vermagic/符号一致）。
          for k in $DRIVER_KCONFIGS; do
            printf 'CONFIG_KERNEL_%s=m\n' "${k#CONFIG_}" >> .config
          done
          echo ">>> 内核配置覆盖写入完成（共 $(echo $DRIVER_KCONFIGS | wc -w) 个符号）"

          # airoha-eth.ko 是 PON 数据面的提供者，整个仓库没有任何 kmod 包声明它。
          # 上面那个循环把 DRIVER_KCONFIGS（含 CONFIG_NET_AIROHA）统统写成 CONFIG_KERNEL_xxx=m，
          # 于是 airoha-eth 被编成 .ko，kmod-airoha-xpon 的 modinfo 依赖 airoha-eth.ko 找不到提供者 →
          # Package kmod-airoha-xpon is missing dependencies for the following libraries: airoha-eth.ko
          # （run 43685533518 第 18 步）。固件侧写的是 CONFIG_NET_AIROHA=y，这里对齐成内置。
          sed -i '/^CONFIG_KERNEL_NET_AIROHA=/d;/^CONFIG_KERNEL_NET_AIROHA_NPU=/d' .config
          printf '%s\n' 'CONFIG_KERNEL_NET_AIROHA=y' 'CONFIG_KERNEL_NET_AIROHA_NPU=y' >> .config
          grep -n '^CONFIG_KERNEL_NET_AIROHA' .config || { echo '::error::NET_AIROHA 内置定值未写入 .config'; exit 1; }
          echo ">>> airoha-eth 已定为内置（CONFIG_KERNEL_NET_AIROHA=y），与固件一致"
          # 【NFS 全链内置：CONFIG_KERNEL_* 是 PrepareKernelConfig 的最终覆盖源】
          # run 44214051200 第 18 步实证：DRIVER_KCONFIGS 里带 CONFIG_NFS_FS/NFSD/LOCKD/SUNRPC/GRACE_PERIOD，
          # 上面统一写成 CONFIG_KERNEL_*=m，覆盖了 config-6.18 里的 =y，内核 .config 落成
          #   CONFIG_NFS_FS=m / CONFIG_NFSD=m / CONFIG_LOCKD=m / CONFIG_SUNRPC=m / CONFIG_GRACE_PERIOD=m
          # 于是 modules.builtin 不收 nfs.ko，fs/nfs/nfs.ko 仍产出，内置方案落空。
          # 这里把这一组显式改成 =y（与 NET_AIROHA 同样的处理方式），并硬校验。
          NFS_KCONFIGS="CONFIG_NFS_FS CONFIG_NFSD CONFIG_NFSD_V4 CONFIG_NFS_V4 CONFIG_LOCKD CONFIG_SUNRPC CONFIG_GRACE_PERIOD"
          for s in $NFS_KCONFIGS; do
            sed -i "/^CONFIG_KERNEL_${s#CONFIG_}=/d" .config
            printf "CONFIG_KERNEL_%s=y\n" "${s#CONFIG_}" >> .config
          done
          for s in $NFS_KCONFIGS; do
            grep -q "^CONFIG_KERNEL_${s#CONFIG_}=y" .config || { echo "::error::内核覆盖 CONFIG_KERNEL_${s#CONFIG_} 不是 =y（NFS 内置方案要求 =y）"; exit 1; }
          done
          echo ">>> NFS 全链已写成 CONFIG_KERNEL_*=y（PrepareKernelConfig 覆盖源，等于固件的内置配置）"

      - name: 批量设置目标包为 =m
        working-directory: ./ponwrt
        run: |
          # 【nfs-kernel-server 缺 ELF 库提供者】run 44675098193 第 18 步实测原始报错：
          #   Package nfs-kernel-server is missing dependencies for the following libraries:
          #   libnl-3.so.200 / libnl-genl-3.so.200 / libreadline.so.8 / libtirpc.so.3 / libxml2.so.16
          #   make[2]: *** [.../nfs-kernel-server-2.9.1-r2.apk] Error 1
          # 提供者包（上游 Makefile 核实）：libnl-core / libnl-genl / libreadline / libtirpc / libxml2。
          # 两件事都要做，缺一仍报同样的错：
          #   1) 打包检查是按「本包 DEPENDS 里有没有声明提供者」判定的 → 补进 DEPENDS；
          #   2) 提供者必须在 .config 里被选中，否则 staging_dir/.../pkginfo 里没有 provides。
          NS=feeds/packages/net/nfs-kernel-server/Makefile
          if [ -f "$NS" ]; then
            python3 - "$NS" <<'PY'
          import io, sys
          p = sys.argv[1]
          ADD = "+libnl-core +libnl-genl +libreadline +libtirpc +libxml2"
          lines = io.open(p, encoding='utf-8').read().splitlines()
          out, i, n = [], 0, len(lines)
          targets = {"define Package/nfs-kernel-server", "define Package/nfs-kernel-server/Default"}
          changed = []
          while i < n:
              st = lines[i].strip()
              if st in targets:
                  block = [lines[i]]
                  i += 1
                  while i < n and not lines[i].strip().startswith('endef'):
                      block.append(lines[i])
                      i += 1
                  if i < n:
                      block.append(lines[i])
                      i += 1
                  if 'libnl-core' not in "\n".join(block):
                      di = None
                      for k, b in enumerate(block):
                          if b.strip().startswith('DEPENDS'):
                              di = k
                              break
                      if di is not None:
                          block[di] = block[di].rstrip() + " " + ADD
                      else:
                          ins = 1
                          for k, b in enumerate(block):
                              if '$(call Package/nfs-kernel-server/Default)' in b:
                                  ins = k + 1
                                  break
                          block.insert(ins, "\tDEPENDS+=" + ADD)
                      changed.append(st)
                  out.extend(block)
                  continue
              out.append(lines[i])
              i += 1
          io.open(p, 'w', encoding='utf-8', newline='\n').write("\n".join(out) + "\n")
          print("nfs-kernel-server DEPENDS 已补块: %s" % (changed or "none(已补过)"))
          PY
          else
            echo "::warning::未找到 $NS，nfs-kernel-server 的库依赖无法补声明"
          fi

          set_pkg_m() {
            local pkg="$1"
            sed -i "/^CONFIG_PACKAGE_${pkg}/d" .config
            echo "CONFIG_PACKAGE_${pkg}=m" >> .config
          }

          pkg_list=(
            # 用户 2026-11-21 明确要求：本工作流只编 mihomo-alpha，不再编其它插件包。
            # mihomo-alpha 的运行期依赖（libc / ca-bundle / ip-full / kmod-tun / kmod-inet-diag）
            # 已由固件 configs/an7581.config + configs/release.config 以 =y 内置，无需在此重编。
            mihomo-alpha
          )

          for p in "${pkg_list[@]}"; do
            set_pkg_m "$p"
          done
          # ttyd（feeds/packages/utils/ttyd/Makefile，ttyd-1.7.7）DEPENDS 是 +libwebsockets-full，
          # 只有 full 变体才加 -DLWS_WITH_LIBUV=ON（libs/libwebsockets/Makefile 第 90-93 行）；
          # openssl / mbedtls 变体都不带 libuv。实测 .config 里落的是 openssl 变体
          # （build_dir/.../libwebsockets-openssl/，stamp .libwebsockets.openssl_installed），
          # 于是 ttyd 配置阶段直接报
          #   CMake Error at CMakeLists.txt:64: libwebsockets was not build with libuv support (-DLWS_WITH_LIBUV=ON)
          #   make[2]: *** [Makefile:58: .../ttyd-1.7.7/.configured_...] Error 1
          # （run 43857134468 第 18 步 full-build.log 126681-126690）。
          # 修法：把变体改成 full（libuv / libopenssl 由 full 的 DEPENDS 自动带入）。
          sed -i '/^CONFIG_PACKAGE_libwebsockets=/d;/^CONFIG_PACKAGE_libwebsockets-openssl=/d;/^CONFIG_PACKAGE_libwebsockets-mbedtls=/d;/^CONFIG_PACKAGE_libwebsockets-full=/d' .config
          printf 'CONFIG_PACKAGE_libwebsockets-full=m\n' >> .config
          grep -q '^CONFIG_PACKAGE_libwebsockets-full=m' .config || { echo "::error::libwebsockets-full 未落成 =m（ttyd 需要带 libuv 的 full 变体）"; exit 1; }
          echo ">>> libwebsockets 变体已锁定为 full（ttyd 需要的 -DLWS_WITH_LIBUV=ON 只在 full 里）"
          # libffmpeg / ffmpeg 的运行库提供者必须落成 =m：gen-dependencies 只认 .apk 的 provides，
          # 实测 ffmpeg 打包时报缺 libavcodec.so.63/libavdevice.so.63/libavfilter.so.12/libavformat.so.63
          # /libavutil.so.61/libpostproc.so.59/libswresample.so.7/libswscale.so.10/libz.so.1
          # （run 43857129451 第 18 步 full-build.log 180986-180996）；minidlna 侧还要
          # libbz2.so.1.0 / libdrm.so.2 / libmp3lame.so.0 / libopus.so.0（pkg-minidlna.log 342-345）。
          # libwebsockets-full 的 full 变体还带 libuv（Makefile DEPENDS += +libopenssl +libuv），
          # 打包时报缺 libcap.so.2 / libuv.so.1 的提供者（run 43905483565 第 18 步
          # full-build.log 125156-125163：Package libwebsockets-full is missing dependencies
          # for the following libraries: libcap.so.2 / libuv.so.1 -> Error 1 ->
          # ERROR: package/feeds/packages/libwebsockets failed to build (build variant: full)）。
          # 补真正的提供者 libcap / libuv。
          # n2n 同样踩了"提供者没落 =m"的坑（run 44650306780 第 18 步 full-build.log 154374-154376）：
          #   Package n2n is missing dependencies for the following libraries:
          #   libzstd.so.1
          #   make[2]: *** [Makefile:98: .../n2n-3.0-r5.apk] Error 1
          # n2n 的 feeds Makefile 里 DEPENDS 已带 +libzstd，且 zstd-1.5.7 已被编进 staging
          # （libzstd.so.1 / libzstd.so 都在），但 .config 里没有 CONFIG_PACKAGE_libzstd=m，
          # package-metadata 就不会登记 libzstd 的 ABI，打包校验才判"缺提供者"。
          # 补 libzstd 为 =m（真正的提供者，不动校验）。
          for p in libffmpeg libbz2 libdrm libopus lame-lib zlib libcap libuv libzstd; do
            sed -i "/^CONFIG_PACKAGE_${p}=/d" .config
            printf 'CONFIG_PACKAGE_%s=m\n' "$p" >> .config
            grep -q "^CONFIG_PACKAGE_${p}=m" .config || { echo "::error::运行库提供者 ${p} 未落成 =m"; exit 1; }
          done
          echo ">>> libffmpeg 运行库提供者已落成 =m（libav*/libz/libbz2/libdrm/libmp3lame/libopus/libcap/libuv/libzstd）"
          # 【NFS kmod 包必须 =y，不能 =m】package-metadata.pl 生成 .config.override 时按包的 y/m
          # 决定内核符号取值：包 =m → override 写 CONFIG_NFS_FS=m，再次压掉 config-6.18/CONFIG_KERNEL_* 的 =y。
          # 包 =y → override 写 =y，内核真内置，kmod 包走 package/kernel/linux 的 built-in NOTICE 分支
          # （仍然产出 apk，只是空壳，不会静默丢弃）。
          for p in kmod-fs-nfs-common kmod-fs-nfs kmod-fs-nfs-v4 kmod-fs-nfsd; do
            sed -i "/^CONFIG_PACKAGE_${p}=/d;/^# CONFIG_PACKAGE_${p} is not set/d" .config
            printf "CONFIG_PACKAGE_%s=y\n" "$p" >> .config
            grep -q "^CONFIG_PACKAGE_${p}=y" .config || { echo "::error::NFS kmod 包 ${p} 未落成 =y（内置方案要求 =y，否则 override 会把内核符号压回 =m）"; exit 1; }
          done
          echo ">>> NFS kmod 包锁定 =y：kmod-fs-nfs-common / kmod-fs-nfs / kmod-fs-nfs-v4 / kmod-fs-nfsd"
          echo ">>> 所有包设为模块，依赖解析完成"

          # 【只编 mihomo-alpha】清掉其它所有 =m 包选择：本工作流不再编译别的包。
          # 保留固件 config 里的 =y（构建基础设施/toolchain 需要），只裁 =m。
          awk -v keep="mihomo-alpha" '
            /^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=m$/ {
              pkg=$0; sub(/^CONFIG_PACKAGE_/, "", pkg); sub(/=m$/, "", pkg)
              if (pkg != keep) { print "prune =m: " pkg > "/dev/stderr"; next }
            }
            { print }
          ' .config > .config.pruned && mv -f .config.pruned .config
          grep -qxF "CONFIG_PACKAGE_mihomo-alpha=m" .config || { echo "::error::.config 里没有 CONFIG_PACKAGE_mihomo-alpha=m"; exit 1; }
          echo ">>> .config 已收敛：只剩 mihomo-alpha 为 =m"

      - name: 下载源码包
        working-directory: ./ponwrt
        run: |
          export GOPROXY=https://goproxy.cn,https://goproxy.io,direct
          export GO111MODULE=on
          make download -j"$(nproc)" || true
          find dl -type f -size -1024c ! -path 'dl/go-mod-cache/*' -delete
          make download -j1 V=s || { echo "::warning::仍有下载失败"; }
          find dl -type f -size -1024c ! -path 'dl/go-mod-cache/*' -delete

      - name: 只编译 mihomo-alpha（包目录级目标）
        working-directory: ./ponwrt
        run: |
          set +e
          export GOPROXY="${GOPROXY:-https://goproxy.cn,https://goproxy.io,direct}"
          export GO111MODULE=on
          set -uo pipefail
          LOGDIR="$PWD/../build_log"
          mkdir -p "$LOGDIR"
          echo ">>> step18 start: dir=$(pwd)"
          MH_DIR=""
          for d in package/feeds/*/mihomo-alpha package/feeds/*/mihomo feeds/*/mihomo-alpha feeds/*/mihomo; do
            if [ -d "$d" ]; then MH_DIR="$d"; break; fi
          done
          if [ -z "$MH_DIR" ]; then
            echo "::error::未找到 mihomo-alpha 包目录（package/feeds/*/mihomo-alpha）"
            ls -d package/feeds/*/mihomo* feeds/*/mihomo* 2>/dev/null || true
            exit 1
          fi
          echo ">>> 只编译：$MH_DIR"
          grep -qxF "CONFIG_PACKAGE_mihomo-alpha=m" .config || { echo "::error::.config 缺少 CONFIG_PACKAGE_mihomo-alpha=m"; exit 1; }

          # mihomo-alpha 的 DEPENDS 里有 kmod-tun / kmod-inet-diag 等内核模块包，
          # 它们需要 build_dir 里的内核树 .config；内核树没预置时会直接报
          #   make: *** No rule to make target '.../linux-6.18.55/.config'
          # 所以必须先 target/linux/prepare + 内核树 olddefconfig/modules_prepare + target/linux/compile。
          TC_BIN=$(ls -d "$PWD"/staging_dir/toolchain-*/bin 2>/dev/null | head -1)
          CROSS="aarch64-openwrt-linux-musl-"
          [ -n "$TC_BIN" ] && export PATH="$TC_BIN:$PWD/staging_dir/host/bin:$PATH"
          echo ">>> 交叉工具链：${TC_BIN:-未找到}"

          make -j"$(nproc)" V=s target/linux/prepare > "$LOGDIR/kernel-prepare.log" 2>&1 \
            || { echo "::error::target/linux/prepare 失败，尾部："; tail -n 40 "$LOGDIR/kernel-prepare.log"; exit 1; }
          KD=$(ls -d build_dir/target-*/linux-*/linux-* 2>/dev/null | head -1)
          if [ -z "$KD" ]; then
            echo "::error::未找到内核源码目录（build_dir/target-*/linux-*/linux-*）"
            exit 1
          fi
          echo ">>> 内核树：$KD"
          # 内核 syncconfig 在 CI 无 TTY 下遇到无默认值的新符号会直接报错（#59 实测）：
          #   Intel protocol support (BT_HCIUART_INTEL) [N/y/?] (NEW) make[7]: *** [scripts/kconfig/Makefile:85: syncconfig] Error 1
          # 所以用 yes "" 喂空行 = 对每个 (NEW) 取默认值；必须同时关掉 pipefail，
          # 否则 make 一读完就退出、yes 被 SIGPIPE 杀掉会让管道状态非 0。
          ( set +o pipefail; cd "$KD" && yes "" | make ARCH=arm64 CROSS_COMPILE="$CROSS" oldconfig ) > "$LOGDIR/kernel-olddefconfig.log" 2>&1 \
            || { echo "::error::内核 oldconfig 失败，尾部："; tail -n 40 "$LOGDIR/kernel-olddefconfig.log"; exit 1; }
          echo ">>> 内核 oldconfig 的 (NEW) 提示行数：$(grep -c '(NEW)' "$LOGDIR/kernel-olddefconfig.log" || echo 0)"
          # 内核 6.18.55 新增的 BT_HCIUART_INTEL 在 config 片段里没有取值，syncconfig 在 CI 无 TTY 下
          # 直接 (NEW) 报错（#59/#60 实测：yes "" 管道对 target/linux/compile 无效，子 make 的 stdin 被关闭，
          # 日志只有 `yes: standard output: Broken pipe`）。顶层 CONFIG_KERNEL_* 是 PrepareKernelConfig 的覆盖源，
          # 显式定值即可彻底消除提示（默认就是 n，写 n 不改变内核功能）。
          sed -i '/^CONFIG_KERNEL_BT_HCIUART_INTEL=/d' .config
          printf '%s\n' 'CONFIG_KERNEL_BT_HCIUART_INTEL=n' >> .config
          grep -q '^CONFIG_KERNEL_BT_HCIUART_INTEL=n' .config || { echo '::error::BT_HCIUART_INTEL 内核覆盖未写入 .config'; exit 1; }
          echo ">>> 内核 .config 已生成：$(grep -c '^CONFIG_' "$KD/.config" 2>/dev/null || echo 0) 个显式符号"
          # #61 实测：补完 BT_HCIUART_INTEL 后 target/linux/compile 又在下一个 (NEW) 符号上死掉——
          #   nl80211 testmode command (NL80211_TESTMODE) [N/y/?] (NEW) make[7]: *** [scripts/kconfig/Makefile:85: syncconfig] Error 1
          # 说明逐个补符号是打地鼠：Kernel/Configure 每次都按 config 片段重新生成 .config.set，
          # 会覆盖我们在内核源码树里手改的 .config，片段里没有取值的符号仍是 (NEW)。
          # 一次性把「oldconfig 已补全的整份内核 .config」回灌成构建源：
          #   (a) 每个符号写一行顶层 CONFIG_KERNEL_<SYM>=<val>（已存在同名内核选项的不覆盖）；
          #   (b) 同时追加进 target/linux/<板级>/config-<kver> 片段，让重建 .config.set 时带上全部取值。
          BOARD=$(basename "$(dirname "$KD")"); BOARD=${BOARD#linux-}; BOARD=${BOARD%%_*}
          KVER=$(basename "$KD"); KVER=${KVER#linux-}; KVER=${KVER%.*}
          FRAG="target/linux/$BOARD/config-$KVER"
          [ -f "$FRAG" ] || FRAG=$(ls "target/linux/$BOARD"/config-[0-9]* 2>/dev/null | head -1)
          k_add=0
          while IFS= read -r line; do
            case "$line" in
              CONFIG_*=*) sym=${line%%=*}; val=${line#*=} ;;
              '# CONFIG_'*' is not set') sym=$(printf '%s' "$line" | sed 's/^# //; s/ is not set$//'); val=n ;;
              *) continue ;;
            esac
            grep -q "^CONFIG_KERNEL_${sym#CONFIG_}=." .config && continue
            printf 'CONFIG_KERNEL_%s=%s\n' "${sym#CONFIG_}" "$val" >> .config
            k_add=$((k_add+1))
          done < "$KD/.config"
          echo ">>> 顶层 CONFIG_KERNEL_ 回灌：$k_add 个符号"
          if [ -f "$FRAG" ]; then
            awk '/^CONFIG_[A-Za-z0-9_]+=/ {print} /^# CONFIG_[A-Za-z0-9_]+ is not set$/ {sub(/^# /,""); sub(/ is not set$/,"=n"); print}' "$KD/.config" >> "$FRAG"
            echo ">>> 配置片段追加完成：$FRAG 现有 $(wc -l < "$FRAG") 行"
          else
            echo "::warning::未找到 target/linux/$BOARD/config-$KVER 片段，仅回灌顶层 CONFIG_KERNEL_"
          fi
          grep -q '^CONFIG_KERNEL_NL80211_TESTMODE=' .config || echo "::warning::NL80211_TESTMODE 未回灌到顶层 .config"
          ( set +o pipefail; cd "$KD" && yes "" | make ARCH=arm64 CROSS_COMPILE="$CROSS" modules_prepare ) > "$LOGDIR/kernel-modules-prepare.log" 2>&1 \
            || { echo "::warning::modules_prepare 失败，kmod 可能缺 generated 头文件，尾部："; tail -n 20 "$LOGDIR/kernel-modules-prepare.log"; }

          # 内核（含 kmod）编译：这一步才真正产出 .ko 与 generated 头文件。
          # #62 实测：整份 .config 回灌到顶层后，target/linux/compile 仍会在「被包依赖 override
          # 打开、片段里又没有取值」的符号上以 (NEW) 形式要求输入，CI 无 TTY 直接报错：
          #   Debugging output for rtlwifi driver family (RTLWIFI_DEBUG) [Y/n/?] (NEW)
          #   make[7]: *** [scripts/kconfig/Makefile:85: syncconfig] Error 1
          # include/kernel-defaults.mk 的 Kernel/Configure/Default 会把顶层 .config 里所有
          # CONFIG_KERNEL_* 逐行拷进 .config.target（awk '^(# )?CONFIG_KERNEL' 段），
          # 所以改成「失败 → 从本轮日志里抓真实报错的 (NEW) 符号 → 按提示括号里的默认值写
          # 顶层 CONFIG_KERNEL_<SYM>=<def> → 重试」，最多 25 轮；
          # 只补日志真实报出来的符号、取值就是 kconfig 默认值，不改内核功能。
          compile_ok=0
          : > "$LOGDIR/new-symbols.txt"
          for attempt in $(seq 1 25); do
            if ( set +o pipefail; yes "" | make -j"$(nproc)" V=s target/linux/compile > "$LOGDIR/kernel-compile.log" 2>&1 ); then
              compile_ok=1
              break
            fi
            # #63 实测：原来那条 sed 表达式里带 `/`（[^]]* 那段）会被当成 s 命令的分隔符，
            # 报 `sed: -e expression #1, char 51: unknown option to 's'`，取到空符号。
            # 改成先抓最后一条含 (NEW) 的行，再用不含 `/` 的两条 sed 分别取符号与默认值。
            newline=$(grep -F '(NEW)' "$LOGDIR/kernel-compile.log" | tail -1)
            newsym=$(printf '%s' "$newline" | sed -n 's/.*(\([A-Z0-9_]\{1,\}\)) \[.*(NEW).*/\1/p')
            newdef=$(printf '%s' "$newline" | sed -n 's/.*) \[\([A-Za-z]\).*/\1/p')
            [ -n "$newdef" ] || newdef=n
            if [ -z "$newsym" ]; then
              echo "::error::target/linux/compile 第 $attempt 轮失败，且日志里没有 (NEW) 符号，尾部 60 行："
              tail -n 60 "$LOGDIR/kernel-compile.log"
              exit 1
            fi
            newdef=$(printf '%s' "$newdef" | tr 'A-Z' 'a-z')
            echo ">>> 第 $attempt 轮 (NEW) 符号：$newsym，顶层定值 CONFIG_KERNEL_$newsym=$newdef 后重试"
            sed -i "/^CONFIG_KERNEL_${newsym}=/d" .config
            printf 'CONFIG_KERNEL_%s=%s\n' "$newsym" "$newdef" >> .config
            grep -q "^CONFIG_KERNEL_${newsym}=" .config || { echo "::error::顶层 .config 未写入 CONFIG_KERNEL_$newsym"; exit 1; }
            printf '%s=%s\n' "$newsym" "$newdef" >> "$LOGDIR/new-symbols.txt"
          done
          if [ "$compile_ok" -ne 1 ]; then
            echo "::error::target/linux/compile 25 轮仍失败，尾部 60 行："
            tail -n 60 "$LOGDIR/kernel-compile.log"
            exit 1
          fi
          echo ">>> 内核编译完成；本轮补齐的 (NEW) 符号 $(wc -l < "$LOGDIR/new-symbols.txt") 个："
          cat "$LOGDIR/new-symbols.txt"

          if ! make WARN_RECURSIVE_DEP=1 -j"$(nproc)" V=s "$MH_DIR/compile" 2>&1 | tee "$LOGDIR/full-build.log"; then
            rc=${PIPESTATUS[0]}
          else
            rc=0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::mihomo-alpha 编译失败 rc=$rc，日志尾部 60 行："
            tail -n 60 "$LOGDIR/full-build.log"
            exit "$rc"
          fi
          [ -s "$LOGDIR/full-build.log" ] || { echo "::error::编译日志为空"; exit 1; }
          echo ">>> 产物 apk："
          ls -l "$MH_DIR"/*.apk bin/packages/*/*/*mihomo*alpha*.apk 2>/dev/null | head -30 || true
          echo ">>> mihomo-alpha 编译结束 rc=$rc"
      - name: 收集全部IPK
        working-directory: ./ponwrt
        run: |
          mkdir -p ../ipk_out
          pkg_list=(
            # 用户 2026-11-21 明确要求：本工作流只编 mihomo-alpha，不再编其它插件包。
            # mihomo-alpha 的运行期依赖（libc / ca-bundle / ip-full / kmod-tun / kmod-inet-diag）
            # 已由固件 configs/an7581.config + configs/release.config 以 =y 内置，无需在此重编。
            mihomo-alpha
          )
          for pkg in "${pkg_list[@]}"; do
            found=0
            while IFS= read -r -d '' f; do
              cp -f "$f" ../ipk_out/
              found=1
            done < <(find bin -type f \( -name "${pkg}*.ipk" -o -name "${pkg}*.apk" \) -print0 )
            [ "$found" -eq 1 ] && echo ">>> 已收集 $pkg" || echo "::notice::$pkg 未生成，跳过"
          done
          ls -lh ../ipk_out/*.ipk ../ipk_out/*.apk 2>/dev/null || true

      - name: 打包制品 & 生成校验和
        run: |
          mkdir -p release_out
          cp -f ipk_out/* release_out/ 2>/dev/null || true
          cd release_out
          shopt -s nullglob
          files=( *)
          [ "${#files[@]}" -eq 0 ] && { echo "::error::无IPK产出，终止发布"; exit 1; }
          tar --zstd -cf ../${{ env.TAR_NAME }} "${files[@]}"
          sha256sum ../${{ env.TAR_NAME }} > ../${{ env.SHA_NAME }}
          ls -lh ../

      - name: 制品存在校验
        run: |
          if [ ! -f "${{ env.TAR_NAME }}" ] || [ ! -f "${{ env.SHA_NAME }}" ]; then
            echo "::error::制品缺失，禁止发布"
            exit 1
          fi
          # usbutils(lsusb) 的运行库依赖必须有对应 apk，否则装到设备上解析不了依赖。
          # 之前 libusb-1.0 / libudev-zero 只被当构建依赖 stage 过、没产出 apk，
          # 于是出现 "Package usbutils is missing dependencies for the following libraries:
          # libudev.so.1 / libusb-1.0.so.0" 直接把整批编译打断（run 43798029752 第 18 步）。
          # 本工作流只编 mihomo-alpha：apk 必须在，否则等于空跑
          ls ipk_out/mihomo-alpha-*.apk >/dev/null 2>&1 || { echo "::error::未产出 mihomo-alpha apk"; exit 1; }
          echo ">>> mihomo-alpha apk：$(ls ipk_out/mihomo-alpha-*.apk)"
          if ls ipk_out/usbutils-*.apk >/dev/null 2>&1; then
            for dep in libudev-zero libusb-1.0; do
              ls ipk_out/${dep}-*.apk >/dev/null 2>&1 || {
                echo "::error::usbutils 已出包，但缺少运行库依赖 ${dep} 的 apk（会造成依赖解析失败）"
                exit 1
              }
            done
            echo ">>> usbutils 的运行库依赖齐全：$(ls ipk_out/libudev-zero-*.apk ipk_out/libusb-1.0-*.apk)"
          fi

      - name: 生成唯一Tag（自动防重）
        id: taggen
        run: |
          BASE_TAG="ipk-$(date +%Y%m%d-%H%M)"
          TAG="${BASE_TAG}"
          SUFFIX=1
          while gh api -s "/repos/${{ github.repository }}/git/ref/tags/${TAG}" >/dev/null 2>&1; do
            TAG="${BASE_TAG}-${SUFFIX}"
            SUFFIX=$((SUFFIX+1))
          done
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "Final tag: ${TAG}"

      - name: 预发布 Release（仅编译成功才执行）
        if: success()
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ${{ steps.taggen.outputs.TAG }}
          name: PonWrt HG5585F-CT IPK 插件包 ${{ steps.taggen.outputs.TAG }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            【预发布｜HG5585F-CT mihomo-alpha 独立包】
            基准源码 commit: `${{ env.SOURCE_REF }}`
            编译方式：只编 `package/feeds/*/mihomo`（mihomo-alpha 变体），不编其它插件
            ✅ 包含：mihomo-alpha（与固件内置 mihomo-meta 互斥，二者只能装一个）
            ✅ 运行期依赖已随固件内置：kmod-tun / kmod-inet-diag / ip-full / ca-bundle
            ⚠️ 校验文件：`SHA256SUMS`；日志与 .config 一并上传，用于排障
          files: |
            ${{ env.TAR_NAME }}
            ${{ env.SHA_NAME }}
            build_log/full-build.log
            ponwrt/.config
            public-key.pem

      - name: 上传IPK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-HG5585F-CT-all-ipk
          path: |
            ./ipk_out/
            ./${{ env.TAR_NAME }}
            ./${{ env.SHA_NAME }}
          if-no-files-found: warn
          retention-days: 14

      - name: 上传完整编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IPK-build-diagnostics
          path: |
            ponwrt/.config
            build_log/full-build.log
          if-no-files-found: ignore
          retention-days: 3
