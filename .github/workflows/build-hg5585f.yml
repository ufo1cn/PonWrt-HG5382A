# ============================================================================
# 编译 PonWrt HG5585F 电信版集成版固件
# （mihomo + sing-box 共存 + IPTV 驱动 + omcproxy + PON 修复 + GPON 补丁 + Releases 预发布）
# ----------------------------------------------------------------------------
# 基于 HG5382A 工作流修改，差异点：
#   - 目标设备改为 fiberhome_hg5585f-ct（HG5585F 电信版）
#   - 产物过滤、cache key、artifact 名称统一加 hg5585f 前缀
#   - 新增 openwrt-iptv feed（kmod-iptv + luci-app-iptv）
#   - 新增 omcproxy / luci-app-omcproxy（IGMP/MLD 组播代理，IPTV 推荐）
#   - luci-app-iptv / luci-app-airoha-npu 作为独立软件包单独编译，失败不影响固件
#   - luci-app-iptv 已移除与 kmod-iptv 冲突的文件安装
#   - airoha-npu 改为直接克隆到 package/ 目录，避免 feeds 方式解析失败
#   - 预发布到 GitHub Releases（prerelease=true，不覆盖正式版）
# ============================================================================
name: 编译 PonWrt HG5585F 电信版固件 (mihomo + sing-box + IPTV + omcproxy + GPON)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'patches/**'
      - 'scripts/**'
permissions:
  contents: write
concurrency:
  group: build-hg5585f-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: 编译 HG5585F-CT 集成版固件
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_REF: d01485cc909fac33144dc07fa9dc05ed4455380f
    steps:
      - name: 签出工作流仓库 (Checkout Workflow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 清理磁盘空间 (释放容量)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache
          sudo docker system prune -af || true
          sudo apt-get clean
          sudo swapoff /swapfile || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: 初始化编译环境 (安装依赖软件包)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd \
            libzstd-dev jq dos2unix upx-ucl

      - name: 拉取 PonWrt 指定 commit (Clone PonWrt @ pinned)
        run: |
          git init ponwrt
          git -C ponwrt remote add origin https://github.com/pbs05/ponwrt.git
          git -C ponwrt fetch --depth=1 -- origin "$SOURCE_REF"
          git -C ponwrt checkout --detach FETCH_HEAD
          echo ">>> PonWrt pinned: $SOURCE_REF"

      - name: 加入外挂来源 (nikki + homeproxy + openwrt-iptv)
        working-directory: ./ponwrt
        run: |
          if [ ! -f feeds.conf.default ]; then touch feeds.conf.default; fi
          sed -i '/nikki/d;/homeproxy/d;/openwrt-iptv/d' feeds.conf.default
          [ -n "$(tail -c1 feeds.conf.default 2>/dev/null)" ] && echo "" >> feeds.conf.default
          echo 'src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main' >> feeds.conf.default
          echo 'src-git homeproxy https://github.com/immortalwrt/homeproxy.git;master' >> feeds.conf.default
          echo 'src-git iptv https://github.com/yveming/openwrt-iptv.git' >> feeds.conf.default
          dos2unix feeds.conf.default 2>/dev/null || true
          echo "===== feeds.conf.default ====="
          tail -n 10 feeds.conf.default

      - name: 缓存下载软件包 (Cache dl)
        uses: actions/cache@v4
        with:
          path: ponwrt/dl
          key: ponwrt-dl-an7581-${{ hashFiles('ponwrt/feeds.conf.default', 'ponwrt/configs/*.config') }}
          restore-keys: |
            ponwrt-dl-an7581-
            ponwrt-dl-

      - name: 缓存 toolchain + host 工具
        uses: actions/cache@v4
        with:
          path: |
            ponwrt/staging_dir/toolchain-*
            ponwrt/staging_dir/host
          key: hg5585f-toolchain-${{ hashFiles('ponwrt/configs/an7581.config', 'ponwrt/configs/release.config') }}
          restore-keys: |
            hg5585f-toolchain-

      - name: 缓存包安装产物 (staging target)
        uses: actions/cache@v4
        with:
          path: ponwrt/staging_dir/target-aarch64_cortex-a53_musl
          key: hg5585f-stage-${{ hashFiles('ponwrt/configs/an7581.config', 'ponwrt/configs/release.config') }}
          restore-keys: |
            hg5585f-stage-

      - name: 缓存慢包构建目录
        uses: actions/cache@v4
        with:
          path: |
            ponwrt/build_dir/hostpkg/golang-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/python3-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/golang-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/sing-box-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/libcronet-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/openssl-*
          key: hg5585f-slow-${{ hashFiles('ponwrt/configs/an7581.config', 'ponwrt/configs/release.config', 'ponwrt/feeds.conf.default') }}
          restore-keys: |
            hg5585f-slow-

      - name: 更新并安装外挂来源 (Feeds)
        working-directory: ./ponwrt
        run: |
          ./scripts/feeds update -a
          if [ -d feeds/nikki ]; then
            echo ">>> 剔除 nikki 的 +yq 依赖"
            find feeds/nikki -name Makefile -exec sed -i -E 's/[[:space:]]*\+yq\b//g' {} + || true
          fi
          ./scripts/feeds install -a
          if [ -f feeds/luci/collections/luci/Makefile ]; then
            sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile || true
          fi

      - name: 将 luci-app-airoha-npu 克隆到 package 目录
        working-directory: ./ponwrt
        run: |
          rm -rf package/luci-app-airoha-npu
          git clone --depth=1 https://github.com/rchen14b/luci-app-airoha-npu.git package/luci-app-airoha-npu
          echo ">>> luci-app-airoha-npu 已克隆到 package/ 目录"
          echo ">>> 当前 Makefile 中的 PKG_NAME:"
          grep -m1 'PKG_NAME' package/luci-app-airoha-npu/Makefile || echo "::warning::未找到 PKG_NAME"

      - name: 修正 luci-app-iptv 打包定义（独立包且不覆盖 kmod-iptv）
        working-directory: ./ponwrt
        run: |
          set -e
          MK="feeds/pon_userspace/luci-app-iptv/Makefile"
          if [ ! -f "$MK" ]; then
            echo "::error::找不到 $MK"
            exit 1
          fi
          cp -f "$MK" "$MK.orig"
          sed -i 's/+kmod-iptv/kmod-iptv/g' "$MK"
          sed -i '/\/etc\/config\/iptv/d' "$MK"
          sed -i '/\/etc\/init\.d\/iptv/d' "$MK"
          if grep -qE '/etc/config/iptv|/etc/init\.d/iptv' "$MK"; then
            echo "::error::luci-app-iptv Makefile 仍包含冲突文件安装路径"
            exit 1
          fi
          echo ">>> luci-app-iptv Makefile 修改完成"

      - name: 应用 GPON feed 补丁
        env:
          PONWRT_DIR: ponwrt
          FEED_PATCHES_STRICT: '1'
        run: bash scripts/apply-feed-patches.sh

      - name: 校验 GPON 补丁已生效
        working-directory: ./ponwrt
        run: |
          set -e
          test -f feeds/pon_drivers/airoha-xpon/src/airoha-xpon-gpon.c
          grep -q 'AIROHA_PON_FRONTEND_MODE_GPON' \
            feeds/pon_drivers/airoha-pon-frontends/src/airoha-paged-bosa-ux3363.c
          grep -q "o.value('gpon'" \
            feeds/pon_userspace/luci-app-pon/htdocs/luci-static/resources/view/pon/config.js
          echo "OK: GPON patches are present."

      - name: 注入 libffi 包
        working-directory: ./ponwrt
        run: |
          mkdir -p package/libs/libffi
          curl -fsSL -o package/libs/libffi/Makefile \
            https://raw.githubusercontent.com/openwrt/openwrt/master/package/libs/libffi/Makefile
          grep -q 'PKG_NAME:=libffi' package/libs/libffi/Makefile && echo ">>> libffi 注入成功" || exit 1

      - name: 生成并锁定 HG5585F-CT 配置
        working-directory: ./ponwrt
        run: |
          rm -rf tmp
          perl ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config
          sed -i '/CONFIG_TARGET_ALL_PROFILES/d' .config
          sed -i '/CONFIG_TARGET_MULTI_PROFILE/d' .config
          sed -i '/CONFIG_TARGET_airoha_an7581_DEVICE_/d' .config
          sed -i '/CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
          cat >> .config << 'EOF'
          # CONFIG_TARGET_ALL_PROFILES is not set
          # CONFIG_TARGET_MULTI_PROFILE is not set
          CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y
          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y
          CONFIG_PACKAGE_luci-theme-argon=y
          # CONFIG_PACKAGE_luci-theme-bootstrap is not set
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          # CONFIG_SING_BOX_BUILD_NAIVE_OUTBOUND is not set
          EOF
          make defconfig
          sp=$(grep -cE '^CONFIG_TARGET_airoha_an7581_DEVICE_.*=y$' .config || true)
          if [ "$sp" -ne 1 ] || ! grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y$' .config; then
            echo "::error::HG5585F-CT 单一机型锁定校验失败！"; exit 1
          fi
          cat >> .config << 'EOF'
          # --- PON 修复 ---
          CONFIG_PACKAGE_kmod-airoha-paged-bosa=y
          CONFIG_PACKAGE_kmod-airoha-pon-frontend=y
          CONFIG_PACKAGE_kmod-airoha-xpon=y
          CONFIG_PACKAGE_airoha-ponctl=y
          CONFIG_PACKAGE_airoha-pond=y
          # --- 透明代理内核模块 ---
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-dummy=y
          # --- mihomo ---
          CONFIG_PACKAGE_mihomo-meta=y
          CONFIG_PACKAGE_nikki=y
          CONFIG_PACKAGE_luci-app-nikki=y
          CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y
          # --- sing-box ---
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_sing-box=y
          # CONFIG_SING_BOX_BUILD_NAIVE_OUTBOUND is not set
          # --- curl / libcurl ---
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_libcurl=y
          CONFIG_PACKAGE_libidn2=y
          CONFIG_PACKAGE_libnghttp2=y
          CONFIG_PACKAGE_libpsl=y
          CONFIG_PACKAGE_libgnutls=y
          CONFIG_PACKAGE_libtasn1=y
          CONFIG_PACKAGE_libunistring=y
          CONFIG_PACKAGE_nettle=y
          CONFIG_PACKAGE_gmp=y
          # --- 工具 ---
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_yq=y
          CONFIG_PACKAGE_libffi=y
          CONFIG_PACKAGE_libcronet=y
          # --- IPTV 核心驱动 ---
          CONFIG_PACKAGE_kmod-iptv=y
          # --- omcproxy ---
          CONFIG_PACKAGE_omcproxy=y
          CONFIG_PACKAGE_luci-app-omcproxy=y
          # --- 独立包不参与固件 ---
          # CONFIG_PACKAGE_luci-app-iptv is not set
          # CONFIG_PACKAGE_luci-app-airoha-npu is not set
          # CONFIG_PACKAGE_luci-app-airoha-soc is not set
          EOF
          echo ">>> 固件配置完成"

      - name: 下载源码软件包 (容错)
        working-directory: ./ponwrt
        run: |
          export GOPROXY=https://goproxy.cn,https://goproxy.io,direct
          export GO111MODULE=on
          make download -j"$(nproc)" || true
          find dl -type f -size -1024c ! -path 'dl/go-mod-cache/*' -delete
          make download -j1 V=s || { echo "::warning::仍有下载失败"; }
          find dl -type f -size -1024c ! -path 'dl/go-mod-cache/*' -delete

      - name: 执行固件编译 (Compile Firmware)
        working-directory: ./ponwrt
        run: |
          export GOPROXY=https://goproxy.cn,https://goproxy.io,direct
          export GOSUMDB=sum.golang.org
          export GO111MODULE=on
          export GOENV=off
          export GOTOOLCHAIN=local
          mkdir -p logs
          rm -rf staging_dir/target-aarch64_cortex-a53_musl/stamp
          make package/libs/libffi/compile -j"$(nproc)" V=s || true
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee logs/build.log || \
            (echo ">>> 并行编译失败，回退单线程" && make -j1 V=s 2>&1 | tee -a logs/build.log)

      - name: 整理产物 (Collect Firmware)
        run: |
          mkdir -p ./firmware_out
          find ponwrt/bin/targets/airoha/an7581/ -type f \( \
            -iname '*hg5585f-ct*.bin' -o -iname '*hg5585f-ct*.ubi' -o \
            -iname '*hg5585f-ct*.itb' -o -name '*.buildinfo' -o -name 'profiles.json' \
          \) -exec cp -f {} ./firmware_out/ \;
          (
            cd ./firmware_out
            shopt -s nullglob nocaseglob
            files=( *hg5585f-ct*.bin *hg5585f-ct*.ubi *hg5585f-ct*.itb )
            if [ "${#files[@]}" -eq 0 ]; then echo "::error::无固件映像"; exit 1; fi
            sha256sum "${files[@]}" > sha256sums
            ls -lh
          )

      - name: 尝试编译独立软件包（失败不影响固件）
        working-directory: ./ponwrt
        run: |
          set +e
          echo ">>> 固件编译完成，开始尝试独立包"
          echo ">>> 任何失败均不影响固件"

          # 配置独立包为 =m
          sed -i 's|^# CONFIG_PACKAGE_luci-app-iptv is not set$|CONFIG_PACKAGE_luci-app-iptv=m|' .config
          sed -i 's|^# CONFIG_PACKAGE_luci-app-airoha-npu is not set$|CONFIG_PACKAGE_luci-app-airoha-npu=m|' .config
          sed -i 's|^# CONFIG_PACKAGE_luci-app-airoha-soc is not set$|CONFIG_PACKAGE_luci-app-airoha-soc=m|' .config
          make defconfig >/dev/null 2>&1

          # --- luci-app-iptv ---
          echo ">>> 下载 luci-app-iptv"
          make package/luci-app-iptv/download V=s 2>&1 | tail -3 || echo "::warning::iptv 下载失败"
          echo ">>> 编译 luci-app-iptv"
          make package/luci-app-iptv/compile -j"$(nproc)" V=s 2>&1 | tee logs/iptv-pkg.log | tail -20
          [ ${PIPESTATUS[0]} -ne 0 ] && echo "::warning::luci-app-iptv 编译失败（不影响固件）" || echo ">>> luci-app-iptv 成功"

          # --- airoha NPU/SOC 状态页（自动探测包名）---
          NPU_PKG=""
          if ./scripts/feeds list -n 2>/dev/null | grep -q '^luci-app-airoha-npu$'; then
            NPU_PKG="luci-app-airoha-npu"
          elif ./scripts/feeds list -n 2>/dev/null | grep -q '^luci-app-airoha-soc$'; then
            NPU_PKG="luci-app-airoha-soc"
            echo "::warning::npu 包名已变更为 soc，将使用 soc 编译"
          elif [ -d "package/luci-app-airoha-npu" ]; then
            NPU_PKG="luci-app-airoha-npu"
            echo ">>> 通过 package/ 目录检测到 luci-app-airoha-npu"
          fi

          if [ -n "$NPU_PKG" ]; then
            echo ">>> 编译 $NPU_PKG"
            make package/$NPU_PKG/download V=s 2>&1 | tail -3 || echo "::warning::$NPU_PKG 下载失败"
            make package/$NPU_PKG/compile -j"$(nproc)" V=s 2>&1 | tee logs/npu-pkg.log | tail -20
            [ ${PIPESTATUS[0]} -ne 0 ] && echo "::warning::$NPU_PKG 编译失败（不影响固件）" || echo ">>> $NPU_PKG 成功"
          else
            echo "::warning::未检测到 airoha-npu/soc 包，跳过"
          fi

          echo ">>> 独立包编译尝试结束"
          exit 0

      - name: 打包全部软件包
        if: always()
        working-directory: ./ponwrt
        run: |
          mkdir -p ../ipk_out
          for d in bin/packages bin/targets/airoha/an7581/packages; do
            if [ -d "$d" ] && [ -n "$(find "$d" \( -name '*.apk' -o -name '*.ipk' \) | head -1)" ]; then
              tar --zstd -cf ../ipk_out/$(basename "$d").tar.zst "$d" || true
            fi
          done
          ls -la ../ipk_out || true

      - name: 收集独立软件包（如成功）
        if: always()
        working-directory: ./ponwrt
        run: |
          mkdir -p ../ipk_out
          for pkg in luci-app-iptv luci-app-airoha-npu luci-app-airoha-soc; do
            found=0
            while IFS= read -r -d '' f; do cp -f "$f" ../ipk_out/; found=1; done < <(find bin -name "${pkg}*.apk" -print0)
            [ "$found" -eq 1 ] && echo ">>> 已收集 $pkg" || echo "::notice::$pkg 未生成，跳过"
          done
          ls -lh ../ipk_out/luci-app-*.apk 2>/dev/null || true

      - name: 上传固件 Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-HG5585F-CT-integrated
          path: ./firmware_out/
          if-no-files-found: error
          retention-days: 14

      - name: 上传全部软件包 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-hg5585f-ipk-packages
          path: |
            ./ipk_out/*.tar.zst
            ./ipk_out/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: 准备预发布文件
        if: success()
        run: |
          rm -rf release_out
          mkdir -p release_out
          cp -f firmware_out/* release_out/ 2>/dev/null || true
          cp -f ipk_out/*.tar.zst release_out/ 2>/dev/null || true
          cp -f ipk_out/*.apk release_out/ 2>/dev/null || true
          cd release_out
          shopt -s nullglob
          files=( *)
          [ "${#files[@]}" -eq 0 ] && { echo "::error::无可发布文件"; exit 1; }
          sha256sum "${files[@]}" > SHA256SUMS
          ls -lh

      - name: 创建 GitHub 预发布
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hg5585f-ct-${{ github.run_number }}-${{ github.run_attempt }}
          name: PonWrt HG5585F-CT 集成版预发布 #${{ github.run_number }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            PonWrt HG5585F-CT 集成版自动预发布。
            包含固件镜像、软件包压缩包、独立 luci-app-iptv / airoha-npu（如编译成功）及 SHA256SUMS。
            注意：这是预发布，仅用于测试验证。
          files: release_out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 失败时保存缓存
        if: failure()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ponwrt/staging_dir/toolchain-*
            ponwrt/staging_dir/host
            ponwrt/staging_dir/target-aarch64_cortex-a53_musl
          key: hg5585f-cache-${{ hashFiles('ponwrt/configs/an7581.config', 'ponwrt/configs/release.config') }}

      - name: 上传编译配置与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG5585F-CT-diagnostics
          path: |
            ponwrt/.config
            ponwrt/feeds.conf.default
            ponwrt/logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3
