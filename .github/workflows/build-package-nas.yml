# ==============================================================================
# PonWrt HG5585F-CT 独立包：NAS 应用套件
# ------------------------------------------------------------------------------
# 【定位】只出 apk，不进固件镜像，装哪个选哪个。
#
# 【为什么按"包目录"编译，而不是按 CONFIG_PACKAGE_xxx=y】
#   1) 这套树里 samba4 / ksmbd-tools / tgt 等目录会产出多个子包
#      （samba4-libs / samba4-server / ksmbd-server ...），
#      写 CONFIG 符号时名字容易写错，写错的表现是"静默丢弃"。
#   2) 直接 `make package/feeds/packages/<目录>/compile` 会让 make 自己解析
#      该目录下所有包及其依赖，符号名不必猜；依赖包也会自动编。
#   3) 每个目录单独编 + 单独日志，某个重型包（qbittorrent）挂掉
#      不会影响其它包产出。
#
# 【文件系统这一层不在本文件里】
#   btrfs / xfs / exfat / ntfs3 / f2fs / md / dm / loop / nbd / usb-storage
#   已由固件内置（=y），本文件只出用户态工具（progs 类）。
#
# 【与固件的一致性】
#   - SOURCE_REF 与固件、其它独立包工作流完全一致
#   - 关键内核对齐符号（DRIVER_KCONFIGS）与固件同源，保证若顺带重编
#     某个 kmod，其 vermagic 也一致
#
# 【已知不在本 feed 的包】
#   mdadm（软 RAID 管理工具）在 immortalwrt/packages 里不存在，
#   本文件不写它，避免"包不存在 → 整条流程第一步失败"。
#   软 RAID 内核能力（md-raid0/1/10/456、dm-raid）固件里已有。
# ==============================================================================
name: 【独立包编译】PonWrt HG5585F-CT NAS 套件（SMB/NFS/DLNA/下载/磁盘工具）
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: ipk-nas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_nas:
    name: 编译NAS相关独立包
    runs-on: ubuntu-24.04
    timeout-minutes: 380
    env:
      SOURCE_REF: d01485cc909fac33144dc07fa9dc05ed4455380f
      TAR_NAME: HG5585F-CT-nas-ipk.tar.zst
      SHA_NAME: SHA256SUMS
      DRIVER_KCONFIGS: >-
        CONFIG_USB_STORAGE CONFIG_USB_UAS CONFIG_USB_XHCI_HCD CONFIG_SCSI CONFIG_BLK_DEV_SD
        CONFIG_EXT4_FS CONFIG_VFAT_FS CONFIG_EXFAT_FS CONFIG_NTFS3_FS CONFIG_BTRFS_FS
        CONFIG_XFS_FS CONFIG_F2FS_FS CONFIG_MD CONFIG_BLK_DEV_DM CONFIG_BLK_DEV_LOOP
        CONFIG_BLK_DEV_NBD CONFIG_CIFS CONFIG_NFS_FS CONFIG_NFSD CONFIG_EXPORTFS
        CONFIG_NETFILTER CONFIG_NF_CONNTRACK CONFIG_INET_DIAG CONFIG_TUN
    steps:
      - name: 签出工作流仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install fixed apk signing key
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${APK_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::未配置 APK_SIGNING_PRIVATE_KEY，本次用 run 内临时密钥（跨 run 不可互信）"
            exit 0
          fi
          # rules.mk: BUILD_KEY_APK_SEC=$(TOPDIR)/private-key.pem / BUILD_KEY_APK_PUB=$(TOPDIR)/public-key.pem
          # 全仓库固定同一把密钥，设备只需装一次 /etc/apk/keys/public-key.pem
          printf '%s\n' "$APK_SIGNING_PRIVATE_KEY" > private-key.pem
          chmod 600 private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem
          sha256sum public-key.pem

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache
          sudo docker system prune -af || true
          sudo apt-get clean
          sudo swapoff /swapfile || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd \
            libzstd-dev jq dos2unix upx-ucl intltool

      - name: 拉取 PonWrt 指定 commit
        run: |
          git init ponwrt
          git -C ponwrt remote add origin https://github.com/pbs05/ponwrt.git
          git -C ponwrt fetch --depth=1 -- origin "$SOURCE_REF"
          git -C ponwrt checkout --detach FETCH_HEAD
          echo ">>> PonWrt pinned: $SOURCE_REF"

      - name: 配置 feeds
        working-directory: ./ponwrt
        run: |
          if [ ! -f feeds.conf.default ]; then touch feeds.conf.default; fi
          dos2unix feeds.conf.default 2>/dev/null || true
          cat feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo ">>> feeds 全量更新安装完成"

      - name: 生成基础配置，锁定HG5585F-CT机型
        working-directory: ./ponwrt
        run: |
          rm -rf tmp
          perl ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config
          make WARN_RECURSIVE_DEP=1 defconfig

          sed -i '/CONFIG_TARGET_ALL_PROFILES/d' .config
          sed -i '/CONFIG_TARGET_MULTI_PROFILE/d' .config
          sed -i '/CONFIG_TARGET_airoha_an7581_DEVICE_/d' .config
          sed -i '/CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config

          printf '# CONFIG_TARGET_ALL_PROFILES is not set\n' >> .config
          printf '# CONFIG_TARGET_MULTI_PROFILE is not set\n' >> .config
          printf 'CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y\n' >> .config
          printf 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y\n' >> .config
          printf 'CONFIG_BUILD_PATENTED=y\n' >> .config

          mkdir -p logs
          set +e
          make -j1 V=sc WARN_RECURSIVE_DEP=1 defconfig > logs/defconfig.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::error::defconfig 失败（rc=$rc），真实日志末尾："
            tail -n 40 logs/defconfig.log
            exit $rc
          fi

          sp=$(grep -cE '^CONFIG_TARGET_airoha_an7581_DEVICE_.*=y$' .config || true)
          if [ "$sp" -ne 1 ] || ! grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5585f-ct=y$' .config; then
            echo "::error::HG5585F-CT 机型锁定校验失败！"; exit 1
          fi
          echo ">>> 机型锁定 OK：fiberhome_hg5585f-ct"

      - name: 预编译 host 工具与工具链（独立包工作流必需）
        working-directory: ./ponwrt
        run: |
          # 为什么必须单独做这一步：
          # `make package/feeds/<feed>/<包名>/compile` 只编这个包，**不会**顺带把
          # tools/ 下的 host 工具编出来。于是解包/签名阶段就会报：
          #   bash: .../staging_dir/host/bin/libdeflate-gzip: No such file or directory
          #   bash: .../staging_dir/host/bin/openssl: No such file or directory
          # （实测分别卡住 NAS 的 host lua 和 libcronet 的 private-key.pem 生成）
          # 另外 target 包还需要工具链，否则 staging_dir/toolchain-* 不存在。
          # 这里先按 tools/Makefile 的清单逐个编 host 工具，再编工具链。
          mkdir -p logs
          TOOL_LIST="libdeflate libressl autoconf-archive sed coreutils patch tar zstd xz zlib expat m4 pkgconf \
                     autoconf automake libtool flex bison gnulib missing-macros \
                     util-linux findutils dosfstools mtools e2fsprogs squashfs4 \
                     mkimage sstrip patchelf cpio lzma ninja meson gengetopt \
                     mtd-utils padjffs2 patch-image mklibs fakeroot elfutils zip quilt"
          for t in $TOOL_LIST; do
            if [ -d "tools/$t" ]; then
              echo "=== tools/$t ==="
              set +e
              make -j1 V=s "tools/$t/compile" > "logs/host-tool-$t.log" 2>&1
              rc=$?
              set -e
              if [ $rc -ne 0 ]; then
                echo "::warning::tools/$t 编译失败(rc=$rc)，末尾 15 行："
                tail -n 15 "logs/host-tool-$t.log"
              fi
            else
              echo "=== 跳过 tools/$t（该工具不在本树里）==="
            fi
          done

          # 关键 host 可执行：缺一个后面必然崩，直接在这里明确报错
          for b in libdeflate-gzip openssl patch tar zstd; do
            if [ ! -x "staging_dir/host/bin/$b" ]; then
              echo "::error::host 工具 $b 未生成（staging_dir/host/bin 现状如下）"
              ls -l staging_dir/host/bin | head -n 30
              exit 1
            fi
          done
          echo ">>> host 工具就绪：$(staging_dir/host/bin/openssl version 2>/dev/null)"

          # 工具链：target 包编译的必要前提。
          # 光有 staging_dir/toolchain-* 目录还不够——package/libs/toolchain 打包 libgcc1 时
          # 要 cp staging_dir/toolchain-*/lib/libgcc_s.so.*，缺了就直接
          # 'cp: cannot stat .../libgcc_s.so.*' 并让**所有**包都失败（实测 36/36 全 FAIL）。
          # 所以这里既要编，也要验 libgcc_s 真的落地，缺则补跑 gcc final。
          if ! ls -d staging_dir/toolchain-* >/dev/null 2>&1; then
            echo "=== 工具链编译 ==="
            make -j$(nproc) V=s toolchain/compile > logs/toolchain.log 2>&1 || true
          fi
          if ! ls staging_dir/toolchain-*/lib/libgcc_s.so* >/dev/null 2>&1; then
            echo "=== libgcc_s 未落地，补跑 toolchain/gcc/final ==="
            make -j$(nproc) V=s toolchain/gcc/final/compile >> logs/toolchain.log 2>&1 || true
          fi
          if ! ls staging_dir/toolchain-*/lib/libgcc_s.so* >/dev/null 2>&1; then
            echo "::error::工具链不完整：libgcc_s.so 未生成（日志末尾 30 行 + find 结果如下）"
            tail -n 30 logs/toolchain.log || true
            find staging_dir/toolchain-* -name 'libgcc_s*' 2>/dev/null | head -n 20 || true
            ls -l staging_dir/toolchain-*/lib 2>/dev/null | head -n 20 || true
            exit 1
          fi
          echo ">>> 工具链就绪：$(ls -d staging_dir/toolchain-* | head -n 1)，libgcc_s=$(ls staging_dir/toolchain-*/lib/libgcc_s.so* | head -n 1)"

      - name: 编译 NAS 用户态包（逐个目录编译，单个失败不影响其它）
        working-directory: ./ponwrt
        run: |
          mkdir -p logs
          : > logs/nas-build-summary.txt

          # 目标写法说明：feeds install 后包被放到 package/feeds/<feed>/<包名>
          #（分类子目录 net/utils/multimedia 会被去掉），所以编译目标必须是
          # package/feeds/packages/samba4 这种形式；写成 feeds/packages/net/samba4
          # 会得到 "No rule to make target"。
          PKG_DIRS=(
            packages/samba4
            packages/ksmbd-tools
            packages/nfs-kernel-server
            packages/wsdd2
            packages/cifs-utils
            packages/minidlna
            packages/transmission
            packages/aria2
            packages/qbittorrent
            packages/tgt
            packages/rsync
            packages/filebrowser
            packages/syncthing
            packages/dufs
            packages/smartmontools
            packages/hdparm
            packages/hd-idle
            packages/parted
            packages/cryptsetup
            packages/btrfs-progs
            packages/xfsprogs
            packages/exfatprogs
            packages/dosfstools
            packages/lm-sensors
            luci/luci-app-samba4
            luci/luci-app-ksmbd
            luci/luci-app-nfs
            luci/luci-app-minidlna
            luci/luci-app-transmission
            luci/luci-app-aria2
            luci/luci-app-filebrowser
            luci/luci-app-filebrowser-go
            luci/luci-app-hd-idle
            luci/luci-app-diskman
            luci/luci-app-qbittorrent
            luci/luci-app-syncthing
          )

          # 【内核树预置】三类硬伤都在这里根治：
          #  1) 固件：CI 无 TTY，kbuild 遇到 Kconfig 新增符号会停在 "(NEW) [N/y/?]"，syncconfig 直接失败；
          #     而且 OpenWrt 每次构建都用 target 的 config-6.18 重新合成 .config，olddefconfig 的结果会被覆盖，
          #     所以补齐的符号必须回写进 config-6.18 才能持久生效；
          #  2) 独立包：kmod 型包依赖 build_dir 里的内核 .config，没有就先报 "No rule to make target '.../.config'"；
          #  3) kmod 编译还要内核 generated/ 头文件（如 generated/rq-offsets.h），必须用交叉工具链跑 modules_prepare。
          LOGDIR="$PWD/logs"
          mkdir -p "$LOGDIR"
          TC_BIN=$(ls -d "$PWD"/staging_dir/toolchain-*/bin 2>/dev/null | head -1)
          CROSS="aarch64-openwrt-linux-musl-"
          [ -n "$TC_BIN" ] && export PATH="$TC_BIN:$PWD/staging_dir/host/bin:$PATH"
          echo ">>> 交叉工具链：${TC_BIN:-未找到}"
          make -j"$(nproc)" V=s toolchain/compile > "$LOGDIR/toolchain-prep.log" 2>&1 \
            || { echo "::warning::toolchain/compile 有告警，尾部："; tail -n 20 "$LOGDIR/toolchain-prep.log"; }
          if make -j1 V=s target/linux/prepare > "$LOGDIR/kernel-prepare.log" 2>&1; then
            KD=$(ls -d build_dir/target-*/linux-*/linux-* 2>/dev/null | head -1)
            if [ -n "$KD" ]; then
              ( cd "$KD" && make ARCH=arm64 CROSS_COMPILE="$CROSS" olddefconfig </dev/null > "$LOGDIR/kernel-olddefconfig.log" 2>&1 ) \
                && echo ">>> 内核 olddefconfig 完成：$KD/.config（$(grep -c '^CONFIG_' "$KD/.config") 个显式符号）" \
                || { echo "::warning::olddefconfig 失败，尾部："; tail -n 30 "$LOGDIR/kernel-olddefconfig.log"; }
              ( cd "$KD" && make ARCH=arm64 CROSS_COMPILE="$CROSS" modules_prepare </dev/null > "$LOGDIR/kernel-modules-prepare.log" 2>&1 ) \
                && echo ">>> 内核 modules_prepare 完成（generated 头文件已就绪）" \
                || { echo "::warning::modules_prepare 失败，kmod 会缺 generated 头文件，尾部："; tail -n 20 "$LOGDIR/kernel-modules-prepare.log"; }
              CFG=target/linux/airoha/an7581/config-6.18
              if [ -f "$CFG" ]; then
                cp -f "$CFG" "$LOGDIR/config-6.18.orig"
                grep -E '^(# )?CONFIG_[A-Za-z0-9_]+' "$CFG" | sed -E 's/^(# )?(CONFIG_[A-Za-z0-9_]+).*/\2/' | sort -u > "$LOGDIR/cfg-syms.txt"
                added=0
                while IFS= read -r line; do
                  case "$line" in
                    CONFIG_*=*|"# CONFIG_"*" is not set")
                      sym=${line%%=*}; sym=${sym#\# }; sym=${sym%% *}
                      if ! grep -qxF "$sym" "$LOGDIR/cfg-syms.txt"; then
                        printf '%s\n' "$line" >> "$CFG"
                        echo "$sym" >> "$LOGDIR/cfg-syms.txt"
                        added=$((added+1))
                      fi
                      ;;
                  esac
                done < "$KD/.config"
                echo ">>> 内核配置固化：向 $CFG 追加 $added 个符号（原文件备份 $LOGDIR/config-6.18.orig）"
                # 真实构建的 .config = merge(generic, target) 再叠加 package-metadata 生成的 .config.override；
                # override 会把包依赖的内核符号抬成 =y/=m，从而让一批原本不可见的符号变可见（如 SPI_MTK_NOR=m → SPI_MTK_SNFI 变可见）。
                # 这里按同样顺序先合入 override 的 =y/=m 项，再用真实 syncconfig 反复校验，仍报 (NEW) 的显式关掉后重来。
                # 预生成 .config.override：真实构建时它由 package-metadata.pl 依包依赖生成。
                # 预置阶段若不存在，下面的循环就是拿"没有 override"的配置自检——首轮必然"通过"，
                # 真实构建却仍撞 (NEW)（实测 run 43636459314 / 43630997001 都是这种假通过）。
                # 【kmod 打包要核对 .ko 文件是否存在】package/kernel/linux 会逐个检查被选中 kmod 声明的模块文件，
                # 缺一个就 Error 1（实测 run 43653685076 第 24 步：bridge.ko / btqca.ko / pwrseq-core.ko / snd-mixer-oss.ko 缺失）。
                # bridge 系：ponwrt 的 package/kernel/linux/modules 里【没有】KernelPackage/bridge（也就没有 kmod-bridge 包），
                # 所以桥接模块只能 built-in，不可能由某个包提供 bridge.ko；br_netfilter 等也必须 =y 才能落到「built-in → NOTICE 跳过」的合规分支。
                # 蓝牙/声卡系：这些确有 kmod 包，必须 =m 才能产出 .ko。
                # ovpn-backports 7.3.0 的 drivers/net/ovpn/main.c:371 用 MODULE_VERSION(OVPN_MODULE_VERSION)，
                # 该宏由上游顶层构建注入；OpenWrt 只编 M=drivers/net/ovpn 子目录，宏是空的 →
                # 报 "expected ',' or ';' before 'OVPN_MODULE_VERSION'"（run 43676216521 第 24 步）。这里补上定义。
                # ovpn-backports 7.3.0 的 drivers/net/ovpn/main.c:371 用 MODULE_VERSION(OVPN_MODULE_VERSION)，
                # 该宏由上游顶层构建注入；OpenWrt 只编 M=drivers/net/ovpn 子目录，宏是空的。
                # 关键：feeds 的 Makefile 里 MAKE_OPTS:= ... NOSTDINC_FLAGS="$(NOSTDINC_FLAGS)" 用的是 := 立即展开，
                # 往文件末尾追加等于追加在展开之后，进不了实际编译命令（run 43685528299 第 24 步实证）。
                # 所以必须把定义插在 MAKE_OPTS:= 那一行之前。
                # 引号穿层：值要穿过多层 shell（Build/Compile 的 NOSTDINC_FLAGS="..." → 子 make → 编译命令 → …），
                # 写成 -DOVPN_MODULE_VERSION=\"7.3.0\" 被剥成 7.3.0（run 43700756531）；改成 '"7.3.0"' 仍被剥（run 43714642112 第 24 步）。
                # 结论：-D 这条路走不通。改为在 Build/Prepare 里直接改源码 main.c:371，把
                # MODULE_VERSION(OVPN_MODULE_VERSION) 换成 MODULE_VERSION("7.3.0")，源码里的字面量不经过任何 shell。
                OVN=feeds/packages/kernel/ovpn-dco/Makefile
                if [ -f "$OVN" ] && ! grep -q 'OVPN_MODULE_VERSION' "$OVN"; then
                  awk 'BEGIN{d=0} { if (!d && $0 ~ /^MAKE_OPTS:=/) { print "define Build/Prepare"; print "\t$(call Build/Prepare/Default)"; print "\tsed -i \047s,MODULE_VERSION(OVPN_MODULE_VERSION),MODULE_VERSION(\"7.3.0\"),\047 $(PKG_BUILD_DIR)/drivers/net/ovpn/main.c"; print "\tgrep -q \047MODULE_VERSION(\"7.3.0\")\047 $(PKG_BUILD_DIR)/drivers/net/ovpn/main.c || { echo \"::error::ovpn main.c 版本宏替换失败\"; exit 1; }"; print "endef"; d=1 } print }' "$OVN" > "$OVN.tmp"
                  mv "$OVN.tmp" "$OVN"
                  grep -n 'OVPN_MODULE_VERSION' "$OVN"
                  echo ">>> ovpn-backports：已在 MAKE_OPTS 之前补入 OVPN_MODULE_VERSION 宏定义"
                fi
                # 同时修 kmod-mppe 缺依赖（run 43714670926 第 12 步原始行）：
                #   Package kmod-mppe is missing dependencies for the following libraries:
                #   libarc4.ko
                # 根因：ponwrt 的 modules/netsupport.mk 里 KernelPackage/mppe 只写了 DEPENDS:=kmod-ppp +kmod-crypto-sha1，
                # 没声明 libarc4.ko 的提供者；内核 6.18 的 ppp_mppe 直接用 libarc4 符号，modinfo depends=libarc4。
                # 而编包时 gen-dependencies 要求本包 provides 里含 libarc4.ko，provides 只从 DEPENDS 继承（include/package-pack.mk
                # 里 $(PKG_INFO_DIR)/$(1).provides 会合并 $(IDEPEND_$(1)) 的 provides），所以缺 DPDENDS 就会失败。
                # 修法是补上真正的提供者 kmod-crypto-arc4（它打包 lib/crypto/libarc4.ko），不是删校验。
                NS=package/kernel/linux/modules/netsupport.mk
                if [ -f "$NS" ] && ! grep -q 'kmod-crypto-arc4' "$NS"; then
                  sed -i 's/^  DEPENDS:=kmod-ppp +kmod-crypto-sha1$/  DEPENDS:=kmod-ppp +kmod-crypto-sha1 +kmod-crypto-arc4/' "$NS"
                  grep -q 'kmod-crypto-sha1 +kmod-crypto-arc4' "$NS" || { echo "::error::netsupport.mk 里 KernelPackage/mppe 的 DEPENDS 未补上 kmod-crypto-arc4"; exit 1; }
                  grep -n 'kmod-crypto-arc4' "$NS"
                  echo ">>> kmod-mppe：DEPENDS 已补 +kmod-crypto-arc4（libarc4.ko 由它提供）"
                fi

                # libarc4.ko 只有 kmod-crypto-arc4 提供（crypto.mk: FILES crypto/arc4.ko + lib/crypto/libarc4.ko），
                # 而 kmod-mppe 的 KernelPackage 没声明 DEPENDS。上一版把它编成内置是错方向：
                # 内置后 lib/crypto/libarc4.ko 根本不会生成，ppp_mppe.ko 的 modinfo 依赖照样要求有包提供它，
                # 于是 run 43688657277 第 12 步仍报 Package kmod-mppe is missing dependencies … libarc4.ko。
                # 正解：选中提供者包 kmod-crypto-arc4=m，让 libarc4.ko 真被编出并随 kmod-crypto-arc4 打包；
                # 同时删掉内置行，避免与包的 KCONFIG(CONFIG_CRYPTO_ARC4) 冲突。
                sed -i '/^CONFIG_CRYPTO_ARC4=/d;/^CONFIG_KERNEL_CRYPTO_ARC4=/d;/^CONFIG_PACKAGE_kmod-crypto-arc4=/d' .config
                printf '%s\n' 'CONFIG_PACKAGE_kmod-crypto-arc4=m' >> .config
                grep -q '^CONFIG_PACKAGE_kmod-crypto-arc4=m' .config || { echo "::error::CONFIG_PACKAGE_kmod-crypto-arc4 未写入 .config"; exit 1; }
                echo ">>> libarc4 提供者已选中（CONFIG_PACKAGE_kmod-crypto-arc4=m）"
                for kv in "CONFIG_BRIDGE=y" "CONFIG_BRIDGE_NETFILTER=y" "CONFIG_NF_CONNTRACK_BRIDGE=y" \
                          "CONFIG_NFT_BRIDGE_META=y" "CONFIG_NFT_BRIDGE_REJECT=y" \
                          "CONFIG_BT_HCIUART_QCA=m" "CONFIG_PWRSEQ_CORE=m" \
                          "CONFIG_SND_OSSEMUL=y" "CONFIG_SND_MIXER_OSS=m"; do
                  k=${kv%%=*}; v=${kv#*=}
                  sed -i -E "/^(# )?${k}[= ]/d" "$CFG" || true
                  printf '%s=%s\n' "$k" "$v" >> "$CFG"
                  if [ -f "$KD/.config" ]; then
                    sed -i -E "/^(# )?${k}[= ]/d" "$KD/.config" || true
                    printf '%s=%s\n' "$k" "$v" >> "$KD/.config"
                  fi
                done
                rm -f "$KD/.configured" "$KD/.configured-check"
                echo ">>> kmod 依赖内核符号已补：$(grep -cE '^CONFIG_(BRIDGE|BRIDGE_NETFILTER|BT_HCIUART_QCA|SND_MIXER_OSS)=' "$CFG" || true) 个"
                # samba4 4.24.5 的 QUIC 封装链接 libgnutls 时缺 gnutls_alpn_set_protocols / gnutls_alpn_get_selected_protocol，
                # 根因同 gensio：libgnutls 没被选中时 GNUTLS_ALPN 不生效，staging 里的 gnutls 是没 ALPN 的。
                # aria2 1.37 报 'setClientTLSContext' is not a member of SocketCore，是同一条：没开 --with-gnutls 就没 ENABLE_SSL。
                for kv in "CONFIG_PACKAGE_libgnutls=m" "CONFIG_GNUTLS_ALPN=y" \
                          "CONFIG_PACKAGE_aria2=m" "CONFIG_ARIA2_GNUTLS=y"; do
                  k=${kv%%=*}; v=${kv#*=}
                  grep -qE "^${k}=" .config || printf '%s=%s\n' "$k" "$v" >> .config
                done
                # 运行库/打包依赖也要真选中，否则 CheckDependencies 报 libaio.so.1 / libstdc++.so.6 / liburcu.so.8
                # libcap 提供 libcap.so.2（samba4-libs 的 CheckDependencies 缺它，run 43685536291 pkg-samba4.log），
                # musl-fts 提供 libfts.so.0（exfat-mkfs 缺它，同一 run 的 pkg-exfatprogs.log）。
                # 两者都在 ponwrt 的 package/libs 里，选中即可真编出来，不改任何校验。
                for p in libaio liburcu libstdcpp libcap musl-fts; do
                  grep -qE "^CONFIG_PACKAGE_${p}=" .config || printf 'CONFIG_PACKAGE_%s=m\n' "$p" >> .config
                done
                grep -qE '^CONFIG_PACKAGE_kmod-bridge=' .config || printf 'CONFIG_PACKAGE_kmod-bridge=m\n' >> .config
                if [ ! -s "$KD/.config.override" ]; then
                  if [ ! -f tmp/.packageinfo ]; then
                    make -j1 V=s prepare-tmpinfo > "$LOGDIR/packageinfo.log" 2>&1 || true
                  fi
                  if [ -f tmp/.packageinfo ]; then
                    perl scripts/package-metadata.pl kconfig tmp/.packageinfo .config 6.18 > "$KD/.config.override" 2> "$LOGDIR/package-metadata.log" || true
                  fi
                fi
                echo ">>> .config.override：$(wc -l < "$KD/.config.override" 2>/dev/null || echo 0) 行"
                if [ ! -s "$KD/.config.override" ]; then
                  echo "::warning::.config.override 生成失败，显式关掉已知无默认值且会 (NEW) 的符号（SPI_MTK_SNFI）兜底"
                  printf '# CONFIG_SPI_MTK_SNFI is not set\n' >> "$CFG"
                  grep -qE '^(# )?CONFIG_SPI_MTK_SNFI[= ]' "$KD/.config" || printf '# CONFIG_SPI_MTK_SNFI is not set\n' >> "$KD/.config"
                fi
                # 【用真实目标做校验】target/linux/compile 会走 Kernel/Configure（真正的 .config.target
                # + .config.override 合并）再跑 kbuild 的 syncconfig；这里手工拿 $KD/.config 跑 syncconfig
                # 会"假通过"——实测 run 43642078063（5382A）/43642089234（全部包）：预置 通过，
                # 真实构建仍撞 SPI_MTK_SNFI / DEVMEM (NEW)，然后在无 TTY 下直接 Error 2。
                # 拿到 (NEW) 无默认值符号后，按 Kconfig 提示的首选项（Y→=y / M→=m / N→not set）写进
                # target 内核配置 config-6.18，让真实构建的 .config 里始终有确定值。这不是放宽校验：
                # 每轮仍然是真实编译，编不过就继续补符号，6 轮还不过就硬失败并打原始日志。
                rc=1
                for pass in $(seq 1 12); do
                  if make -j"$(nproc)" V=s target/linux/compile > "$LOGDIR/kernel-compile-$pass.log" 2>&1; then
                    echo ">>> target/linux/compile 通过（第 $pass 轮，Kernel/Configure + syncconfig 均真实执行）"
                    rc=0
                    break
                  fi
                  syms=$(sed -nE 's/.*\(([A-Za-z0-9_]+)\) \[([^]]*)\] \(NEW\).*/\1 \2/p' "$LOGDIR/kernel-compile-$pass.log" | sort -u)
                  # 注意：不要换成 BRE 的 "\((\w*)\))" 写法——实测（run 43647582865）它在
                  # "MediaTek SPI NAND Flash Interface (SPI_MTK_SNFI) [N/m/y/?] (NEW) make[7]: ***"
                  # 这种"提示符与报错同一行"的日志里输出为空，于是第 1 轮就被误判成非配置问题而退出。
                  if [ -z "$syms" ]; then
                    echo "::error::target/linux/compile 第 $pass 轮失败但日志里没有 (NEW) 符号，属于真实编译错误，末尾 80 行："
                    tail -n 80 "$LOGDIR/kernel-compile-$pass.log"
                    break
                  fi
                  echo "$syms" | while read -r s choices; do
                    case "${choices%%/*}" in
                      Y) val="CONFIG_${s}=y" ;;
                      M) val="CONFIG_${s}=m" ;;
                      *) val="# CONFIG_${s} is not set" ;;
                    esac
                    sed -i -E "/^(# )?CONFIG_${s}[= ]/d" "$CFG" || true
                    printf '%s\n' "$val" >> "$CFG"
                    # 同时写进 build_dir 的 .config：kbuild 的 syncconfig 直接读这份文件，
                    # 只改 target 配置而 Configure 不重跑时，符号等于没补（run 43653774580 连撞 6 轮 DEVMEM）。
                    if [ -f "$KD/.config" ]; then
                      sed -i -E "/^(# )?CONFIG_${s}[= ]/d" "$KD/.config" || true
                      printf '%s\n' "$val" >> "$KD/.config"
                    fi
                    # 目标配置已变更，删掉 configure 戳，保证下一轮 Kernel/Configure 真的重跑并重建 .config。
                    # 这不是放宽校验：下一轮仍然是真实编译，符号没生效就还会再报 (NEW)。
                    rm -f "$KD/.configured" "$KD/.configured-check"
                    echo ">>> (NEW) 无默认值符号 → 显式定值：$val"
                    echo ">>> diag: $CFG=$(grep -c "^CONFIG_${s}=" 2>/dev/null "$CFG" || true) .config="\
                      "$(grep -c "^CONFIG_${s}=" 2>/dev/null "$KD/.config" || true)"
                  done
                done
                if [ $rc -ne 0 ]; then
                  echo "::error::内核 6 轮内仍未通过真实构建校验（已补入 (NEW) 符号定值），最后一份日志：$LOGDIR/kernel-compile-$pass.log"
                  exit 1
                fi
                echo ">>> 内核已编出：Module.symvers 行数 $(wc -l < "$KD/Module.symvers" 2>/dev/null || echo 0)"
              else
                echo "::warning::未找到 $CFG，跳过内核配置固化"
              fi
            else
              echo "::warning::未找到内核源码目录，跳过 olddefconfig"
            fi
          else
            echo "::warning::target/linux/prepare 失败，尾部："
            tail -n 30 "$LOGDIR/kernel-prepare.log"
          fi
          # 【内核必须真编一次】kmod 与"内核模块源码包"（airoha-pon-frontends、gpio-button-hotplug 等）
          # 在 modpost 阶段要读 $KD/Module.symvers 解析 mutex_lock / skb_put 这类内核符号；
          # 只跑 modules_prepare 不会生成该文件，实测就是 "Module.symvers is missing" + 一片 undefined!
          # （run 43630997001 / 43630999285 / 43631001506 同一个根因）。
          # 所以这里先真正编一次内核（vmlinux + Module.symvers 一起产出）；失败就明确报错停手，
          # 绝不用 KBUILD_MODPOST_WARN 把 undefined! 降级成警告来"骗绿"。
          if ! make -j"$(nproc)" V=s target/linux/compile > "$LOGDIR/kernel-compile.log" 2>&1; then
            echo "::error::target/linux/compile 失败，kmod 无法在缺 Module.symvers 的内核树上编译，尾部："
            tail -n 60 "$LOGDIR/kernel-compile.log"
            exit 1
          fi
          echo ">>> 内核编译完成，Module.symvers 行数：$(wc -l < "$KD/Module.symvers" 2>/dev/null || echo 0)"
          ok=0
          bad=0
          for e in "${PKG_DIRS[@]}"; do
            d="package/feeds/$e"
            if [ ! -d "$d" ]; then
              echo "SKIP $d （未安装到 package/feeds，可能该包不在任何 feed）" | tee -a logs/nas-build-summary.txt
              continue
            fi
            name=$(basename "$e")
            # 【先把包真正选中】.config 里没有 CONFIG_PACKAGE_<name>=m 时，make <dir>/compile 会
            # 0.0x 秒空返回 rc=0、一个 apk 都不出。旧跑 43631004023 就是这样：日志里
            # "time: package/feeds/packages/samba4/compile#0.20"，18 个 OK 包的 apk 全部缺失。
            # 这里从 Makefile 的 BuildPackage 声明解析包名，逐个写进 .config（=m）。
            names=$(grep -hoE 'BuildPackage[,(][ ]*[A-Za-z0-9_.+-]+' "$d/Makefile" 2>/dev/null | sed -E 's/BuildPackage[,(][ ]*//' | sort -u || true)
            # luci 包的 Makefile 常写成 BuildPackage,$(PKG_NAME)，上面的正则抓不到 → names 为空 →
            # 没写 CONFIG_PACKAGE_xxx，make 0.0x 秒空返回（run 43653777261 的 4 个 NOAPK 正是此因）。目录名即包名，回退用它。
            if [ -z "$names" ]; then names="$name"; fi
            for n in $names; do
              grep -qE "^CONFIG_PACKAGE_${n}=" .config || printf 'CONFIG_PACKAGE_%s=m\n' "$n" >> .config
            done
            echo ">>> $name 选中包：$(echo $names)"
            set +e
            make -j1 V=s "$d/compile" > "logs/pkg-$name.log" 2>&1
            rc=$?
            set -e
            # 【产物硬校验】rc=0 不等于有 apk：必须在该目录声明的包里找到至少一个 .apk，
            # 找不到就是静默丢弃（编译被 .config 跳过 / 产物路径不对），按失败计入并落进 summary。
            found=0
            for n in $names; do
              if ls bin/packages/*/*/"$n"-*.apk >/dev/null 2>&1 || ls bin/packages/*/*/"$n"*.apk >/dev/null 2>&1; then found=1; fi
            done
            if [ $rc -eq 0 ] && [ $found -eq 1 ]; then
              echo "OK   $name" | tee -a logs/nas-build-summary.txt
              ok=$((ok+1))
            elif [ $rc -eq 0 ]; then
              echo "NOAPK $name（make rc=0 但没有任何 apk 产出＝静默丢弃，按失败计）" | tee -a logs/nas-build-summary.txt
              tail -n 20 "logs/pkg-$name.log" | sed 's/^/     /' || true
              bad=$((bad+1))
            else
              echo "FAIL $name（日志 logs/pkg-$name.log 末尾 20 行见下）" | tee -a logs/nas-build-summary.txt
              tail -n 20 "logs/pkg-$name.log" | sed 's/^/     /' || true
              bad=$((bad+1))
            fi
          done

          echo ">>> 成功 $ok 个目录，失败 $bad 个目录"
          if [ $ok -eq 0 ]; then
            echo "::error::没有任何 NAS 包编译成功"; exit 1
          fi
          echo ">>> 失败清单（若不为空，属于相应包上游问题，已记录日志）"
          grep -E '^(FAIL|NOAPK)' logs/nas-build-summary.txt || true

      - name: 收集产物
        working-directory: ./ponwrt
        run: |
          rm -rf ../ipk_out
          mkdir -p ../ipk_out
          shopt -s nullglob
          # 旧写法只认 bin/packages/<arch>/<feed>/<file> 三层，apk 布局一变就整批漏收；
          # 改成递归收集（run 43631004023 里 18 个 OK 包的 apk 一个都没进产物）。
          find bin/packages -type f \( -name '*.apk' -o -name '*.ipk' \) -exec cp -f {} ../ipk_out/ \; 2>/dev/null || true
          echo ">>> 收集到 $(ls -1 ../ipk_out 2>/dev/null | wc -l) 个包"
          ls -lh ../ipk_out | head -80
          [ -n "$(ls -A ../ipk_out)" ] || { echo "::error::没有任何产物"; exit 1; }

      - name: 打包制品 & 生成校验和
        run: |
          mkdir -p release_out
          cp -f ipk_out/* release_out/ 2>/dev/null || true
          cd release_out
          shopt -s nullglob
          files=( *)
          [ "${#files[@]}" -eq 0 ] && { echo "::error::无产物，终止发布"; exit 1; }
          tar --zstd -cf ../${{ env.TAR_NAME }} "${files[@]}"
          sha256sum ../${{ env.TAR_NAME }} > ../${{ env.SHA_NAME }}
          ls -lh ../

      - name: 上传产物 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-HG5585F-CT-nas-ipk
          path: |
            ./ipk_out/
            ./${{ env.TAR_NAME }}
            ./${{ env.SHA_NAME }}
          if-no-files-found: warn
          retention-days: 14

      - name: 上传编译日志与逐包结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nas-build-diagnostics
          path: |
            ponwrt/logs/
            ponwrt/.config
          if-no-files-found: ignore
          retention-days: 7

      - name: 预发布 Release（仅成功时）
        if: success()
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: nas-${{ github.run_number }}-${{ github.run_attempt }}
          name: PonWrt HG5585F-CT NAS 套件 ${{ github.run_number }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            【可选包｜HG5585F-CT NAS 套件】
            基准源码 commit: `${{ env.SOURCE_REF }}`
            编译方式：按包目录逐个 `make <dir>/compile`，单个包失败不阻断其它包。

            包含（按能力分组，装哪个选哪个）：
            - 文件共享：samba4 + luci-app-samba4 / ksmbd-tools + luci-app-ksmbd（二者运行时二选一）
            - 网络文件：nfs-kernel-server + luci-app-nfs、cifs-utils、wsdd2（Windows 局域网发现）
            - 媒体：minidlna + luci-app-minidlna
            - 下载：transmission（含 web 控制）、aria2（含 luci-app-aria2）、qbittorrent（重型，按需）
            - 同步/网盘：syncthing + luci-app-syncthing、filebrowser / filebrowser-go + LuCI 前端
            - 磁盘工具：parted、dosfstools、exfatprogs、btrfs-progs、xfsprogs、hdparm、hd-idle、smartmontools、lm-sensors、cryptsetup
            - iSCSI target：tgt

            注意：
            1. 文件系统与 USB 存储的内核支持已内置在固件（=y），本包只是用户态工具。
            2. mdadm 在该 feed 中不存在，故未编；md-raid0/1/10/456 内核能力固件里已有。
            3. 逐包成功/失败清单见 artifact `nas-build-diagnostics` 内的 logs/nas-build-summary.txt。
          files: |
            ${{ env.TAR_NAME }}
            ${{ env.SHA_NAME }}
            ponwrt/.config
            public-key.pem
