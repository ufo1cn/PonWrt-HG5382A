# ============================================================================
# 编译 PonWrt HG5382A 集成版固件（mihomo 软件包 + sing-box 共存 + PON 修复 + GPON 补丁）
# ----------------------------------------------------------------------------
# 基于 ix1911/PonWrt-HG5382A 修改（保留其全部软件/修复逻辑，不与其冲突）：
#   - 单版本集成（不再分 with-nikki / no-nikki），mihomo 与 sing-box 同一镜像共存
#   - mihomo 改为「可卸载软件包」：nikki feed 的 mihomo-meta + nikki + luci-app-nikki
#   - 新增 sing-box：immortalwrt/homeproxy feed 的 luci-app-homeproxy（自动依赖 sing-box）
#   - PON 修复：显式钉住 kmod-airoha-paged-bosa / pon-frontend / xpon + ponctl / pond
#   - 固定 ponwrt 到已知可用 commit，避免上游漂移再踩「optical frontend provider 缺失」
#   - libffi 注入 + CONFIG_PACKAGE_libffi=y（python3 ffi.h 编译修复）
#   - 三卷增量缓存（toolchain+host / staging target / 慢包 build_dir），失败修完 yml
#     重跑时复用已编产物，避免全量重建
# 本 fork 新增（在下方标注 GPON 补丁 的步骤）：
#   - feeds 更新后应用 pon_drivers / pon_userspace 的 GPON 补丁（UX3363 千兆 GPON 支持）
#   - 补丁落位校验，未生效直接失败，避免白编数小时
#   - 编译产物额外保留 bin/packages 与 bin/targets 下全部 .ipk（含选 m 的模块）
# ============================================================================
name: 编译 PonWrt HG5382A 集成版固件 (mihomo + sing-box + GPON)
on:
  workflow_dispatch:
  # GPON 补丁 / 工作流 / 脚本有变动时自动重编
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'patches/**'
      - 'scripts/**'
permissions:
  contents: write
concurrency:
  group: build-hg5382a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: 编译集成版固件
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # 固定到已验证支持 fiberhome_hg5382a 光前端(paged-bosa) 的上游 commit；
      # 如需跟踪最新上游，把 SOURCE_REF 改成 master
      SOURCE_REF: d01485cc909fac33144dc07fa9dc05ed4455380f
    steps:
      - name: 签出工作流仓库 (Checkout Workflow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 清理磁盘空间 (释放容量)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache
          sudo docker system prune -af || true
          sudo apt-get clean
          sudo swapoff /swapfile || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h
      - name: 初始化编译环境 (安装依赖软件包)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd \
            libzstd-dev jq dos2unix upx-ucl
      - name: 拉取 PonWrt 指定 commit (Clone PonWrt @ pinned)
        run: |
          git init ponwrt
          git -C ponwrt remote add origin https://github.com/pbs05/ponwrt.git
          git -C ponwrt fetch --depth=1 -- origin "$SOURCE_REF"
          git -C ponwrt checkout --detach FETCH_HEAD
          echo ">>> PonWrt pinned: $SOURCE_REF"
      - name: 加入外挂来源 (注入 nikki + homeproxy)
        working-directory: ./ponwrt
        run: |
          if [ ! -f feeds.conf.default ]; then touch feeds.conf.default; fi
          sed -i '/nikki/d;/homeproxy/d' feeds.conf.default
          [ -n "$(tail -c1 feeds.conf.default 2>/dev/null)" ] && echo "" >> feeds.conf.default
          echo 'src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main' >> feeds.conf.default
          echo 'src-git homeproxy https://github.com/immortalwrt/homeproxy.git;master' >> feeds.conf.default
          dos2unix feeds.conf.default 2>/dev/null || true
          echo "===== feeds.conf.default ====="
          tail -n 8 feeds.conf.default
      - name: 缓存下载软件包 (Cache dl)
        uses: actions/cache@v4
        with:
          path: ponwrt/dl
          key: ponwrt-dl-an7581-${{ hashFiles('ponwrt/feeds.conf.default', 'ponwrt/configs/*.config') }}
          restore-keys: |
            ponwrt-dl-an7581-
            ponwrt-dl-
      # ===== 增量编译缓存（断点续传）：失败修完 yml 重跑时复用已编产物，避免 2 小时全量重建 =====
      # 分三卷：toolchain+host / 包安装产物(staging) / 慢包构建目录。配置变化时 key 失效，
      # restore-keys 仍可回退到旧缓存，OpenWrt 的 stamp 机制自动只重编受影响的包。
      - name: 缓存 toolchain + host 工具
        uses: actions/cache@v4
        with:
          path: |
            ponwrt/staging_dir/toolchain-*
            ponwrt/staging_dir/host
          key: hg5382a-toolchain-${{ hashFiles('ponwrt/configs/an7581.config', 'ponwrt/configs/release.config') }}
          restore-keys: |
            hg5382a-toolchain-
      - name: 缓存包安装产物 (staging target)
        uses: actions/cache@v4
        with:
          path: ponwrt/staging_dir/target-aarch64_cortex-a53_musl
          key: hg5382a-stage-${{ hashFiles('ponwrt/configs/an7581.config', 'ponwrt/configs/release.config') }}
          restore-keys: |
            hg5382a-stage-
      - name: 缓存慢包构建目录 (python3/golang/sing-box/openssl)
        uses: actions/cache@v4
        with:
          path: |
            ponwrt/build_dir/hostpkg/golang-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/python3-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/golang-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/sing-box-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/libcronet-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/openssl-*
          key: hg5382a-slow-${{ hashFiles('ponwrt/configs/an7581.config', 'ponwrt/configs/release.config', 'ponwrt/feeds.conf.default') }}
          restore-keys: |
            hg5382a-slow-
      - name: 更新并安装外挂来源 (Feeds)
        working-directory: ./ponwrt
        run: |
          ./scripts/feeds update -a
          if [ -d feeds/nikki ]; then
            echo ">>> 剔除 nikki 的 +yq 依赖（改由 CONFIG_PACKAGE_yq=y 显式提供）"
            find feeds/nikki -name Makefile -exec sed -i -E 's/[[:space:]]*\+yq\b//g' {} + || true
          fi
          ./scripts/feeds install -a
          # 默认主题改 Argon
          if [ -f feeds/luci/collections/luci/Makefile ]; then
            sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile || true
          fi
      # ===== GPON 补丁（本 fork 新增）：PON 驱动来自 git feed（pon_drivers / pon_userspace），
      # 必须等 feeds 更新检出到 ponwrt/feeds/ 之后才能打；脚本幂等，可重复执行 =====
      - name: 应用 GPON feed 补丁 (Apply GPON feed patches)
        env:
          PONWRT_DIR: ponwrt
          FEED_PATCHES_STRICT: '1'
        run: bash scripts/apply-feed-patches.sh
      # 补丁没真正落进 feed 直接失败，避免白编几小时
      - name: 校验 GPON 补丁已生效 (Verify GPON patches)
        working-directory: ./ponwrt
        run: |
          set -e
          test -f feeds/pon_drivers/airoha-xpon/src/airoha-xpon-gpon.c
          grep -q 'AIROHA_PON_FRONTEND_MODE_GPON' \
            feeds/pon_drivers/airoha-pon-frontends/src/airoha-paged-bosa-ux3363.c
          grep -q "o.value('gpon'" \
            feeds/pon_userspace/luci-app-pon/htdocs/luci-static/resources/view/pon/config.js
          echo "OK: GPON patches are present in the feed checkouts."
      - name: 注入 libffi 包 (上游 immortalwrt 树缺失 libffi，python3-ctypes 依赖 +libffi，缺它则 ffi.h 报错)
        working-directory: ./ponwrt
        run: |
          mkdir -p package/libs/libffi
          curl -fsSL -o package/libs/libffi/Makefile \
            https://raw.githubusercontent.com/openwrt/openwrt/master/package/libs/libffi/Makefile
          if grep -q 'PKG_NAME:=libffi' package/libs/libffi/Makefile; then
            echo ">>> libffi 包注入成功 (package/libs/libffi)"
          else
            echo "::error::libffi 包注入失败"
            exit 1
          fi
      - name: 生成并锁定 HG5382A 配置 (PON 修复 + mihomo + sing-box)
        working-directory: ./ponwrt
        run: |
          rm -rf tmp
          perl ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config
          sed -i '/CONFIG_TARGET_ALL_PROFILES/d' .config
          sed -i '/CONFIG_TARGET_MULTI_PROFILE/d' .config
          sed -i '/CONFIG_TARGET_airoha_an7581_DEVICE_/d' .config
          sed -i '/CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
          cat >> .config << 'EOF'
          # CONFIG_TARGET_ALL_PROFILES is not set
          # CONFIG_TARGET_MULTI_PROFILE is not set
          CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5382a=y
          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5382a=y
          # === 公共核心 ===
          CONFIG_PACKAGE_luci-theme-argon=y
          # CONFIG_PACKAGE_luci-theme-bootstrap is not set
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          # 关闭 sing-box 的 naive outbound（免拉 libcronet/boringssl 长链；vless/trojan/ss 不受影响）。
          # 必须放在 defconfig 之前：defconfig 之后的追加行会触发 out-of-sync 警告，conf 不采纳
          # CONFIG_SING_BOX_BUILD_NAIVE_OUTBOUND is not set
          EOF
          make defconfig
          # 单一机型校验
          sp=$(grep -cE '^CONFIG_TARGET_airoha_an7581_DEVICE_.*=y$' .config || true)
          if [ "$sp" -ne 1 ] || ! grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5382a=y$' .config; then
            echo "::error::HG5382A 单一机型锁定校验失败！"
            exit 1
          fi
          # ==== defconfig 之后显式钉住关键包（防上游漂移 / 被 defconfig 洗掉）====
          cat >> .config << 'EOF'
          # --- PON 修复：HG5382A 光前端 provider 必须内建（paged-bosa 提供 fiberhome,hg5x-bosa）---
          CONFIG_PACKAGE_kmod-airoha-paged-bosa=y
          CONFIG_PACKAGE_kmod-airoha-pon-frontend=y
          CONFIG_PACKAGE_kmod-airoha-xpon=y
          CONFIG_PACKAGE_airoha-ponctl=y
          CONFIG_PACKAGE_airoha-pond=y
          # --- 透明代理内核模块（mihomo/sing-box 共用底座）---
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-dummy=y
          # --- mihomo（可卸载软件包；nikki feed；mihomo-meta=稳定通道，要最新可改 mihomo-alpha）---
          CONFIG_PACKAGE_mihomo-meta=y
          CONFIG_PACKAGE_nikki=y
          CONFIG_PACKAGE_luci-app-nikki=y
          CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y
          # --- sing-box（immortalwrt/homeproxy，界面自动依赖 sing-box + firewall4 + kmod-nft-tproxy）---
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_sing-box=y
          # 关闭 naive outbound，免拉 libcronet/boringssl 编译链（vless/trojan/ss 等不受影响）
          # CONFIG_SING_BOX_BUILD_NAIVE_OUTBOUND is not set
          # --- curl / libcurl 依赖链（an7581.config 显式关闭，nikki 依赖 curl，OpenWrt 依赖不会自动拉起显式关闭的包）---
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_libcurl=y
          CONFIG_PACKAGE_libidn2=y
          CONFIG_PACKAGE_libnghttp2=y
          CONFIG_PACKAGE_libpsl=y
          CONFIG_PACKAGE_libgnutls=y
          CONFIG_PACKAGE_libtasn1=y
          CONFIG_PACKAGE_libunistring=y
          CONFIG_PACKAGE_nettle=y
          CONFIG_PACKAGE_gmp=y
          # --- 工具 ---
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_yq=y
          # --- python3 编译修复：_ctypes 需要 ffi.h，上游 an7581.config 未选 libffi，导致
          #     Python-3.14.7 编译在 profile-opt 阶段 fatal error: ffi.h（主固件上次失败根因）---
          CONFIG_PACKAGE_libffi=y
          # --- sing-box full 编译修复：immortalwrt 的 sing-box 在 aarch64 上
          #     SING_BOX_BUILD_NAIVE_OUTBOUND 默认 y，二进制链接 libcronet.so；
          #     显式选中 libcronet，强制编出该库（否则打包报 missing libcronet.so）---
          CONFIG_PACKAGE_libcronet=y
          EOF
          # 校验关键包是否进入 .config
          for pkg in kmod-airoha-paged-bosa kmod-airoha-pon-frontend kmod-airoha-xpon \
                     mihomo-meta nikki luci-app-nikki luci-app-homeproxy \
                     sing-box curl libcurl libgnutls; do
            if ! grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config; then
              echo "::warning::${pkg} 未在 .config 中 =y（可能被依赖折叠），继续构建"
            else
              echo ">>> 已锁定 ${pkg}"
            fi
          done
      - name: 下载源码软件包 (容错)
        working-directory: ./ponwrt
        run: |
          export GOPROXY=https://goproxy.cn,https://goproxy.io,direct
          export GO111MODULE=on
          make download -j"$(nproc)" || true
          find dl -type f -size -1024c ! -path 'dl/go-mod-cache/*' -delete
          make download -j1 V=s || { echo "::warning::仍有软件包下载失败，编译阶段会再尝试"; }
          find dl -type f -size -1024c ! -path 'dl/go-mod-cache/*' -delete
      - name: 执行固件编译 (Compile Firmware)
        working-directory: ./ponwrt
        run: |
          export GOPROXY=https://goproxy.cn,https://goproxy.io,direct
          export GOSUMDB=sum.golang.org
          export GO111MODULE=on
          export GOENV=off
          export GOTOOLCHAIN=local
          mkdir -p logs
          # 增量续编：缓存恢复的 staging 总 stamp 若存在，会让 make 误判"全部包已编译"而跳过，
          # 必须清掉，让 make 按各包 build_dir 的 .built stamp 决定是否重编
          rm -rf staging_dir/target-aarch64_cortex-a53_musl/stamp
          # 先显式编译 libffi（python3 的 ffi.h 依赖；包已在前面注入 package/libs/libffi）
          make package/libs/libffi/compile -j"$(nproc)" V=s || true
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee logs/build.log || \
            (echo ">>> 并行编译失败，回退单线程重编" && make -j1 V=s 2>&1 | tee -a logs/build.log)
      - name: 整理产物 (Collect Firmware)
        run: |
          mkdir -p ./firmware_out
          find ponwrt/bin/targets/airoha/an7581/ -type f \( \
            -iname '*hg5382a*.bin' -o \
            -iname '*hg5382a*.ubi' -o \
            -iname '*hg5382a*.itb' -o \
            -name '*.buildinfo' -o \
            -name 'profiles.json' \
          \) -exec cp -f {} ./firmware_out/ \;
          (
            cd ./firmware_out
            shopt -s nullglob nocaseglob
            files=( *hg5382a*.bin *hg5382a*.ubi *hg5382a*.itb )
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::firmware_out 内没有 HG5382A 固件映像"
              exit 1
            fi
            sha256sum "${files[@]}" > sha256sums
            echo "===== 最终产物 ====="
            ls -lh
          )
      # ===== GPON 补丁（本 fork 新增）：保留所有软件包（.apk 与 .ipk，含选 m 的模块）=====
      # ponwrt 使用 APK 包格式（bin/packages/*/packages/*.apk），也兼容旧 .ipk。
      # 成功失败都执行：编译失败时也能拿到已产出的软件包与日志
      - name: 打包全部软件包 (Pack all packages, incl. m modules)
        if: always()
        working-directory: ./ponwrt
        run: |
          mkdir -p ../ipk_out
          if [ -d bin/packages ] && [ -n "$(find bin/packages \( -name '*.apk' -o -name '*.ipk' \) | head -1)" ]; then
            tar --zstd -cf ../ipk_out/ipk-packages.tar.zst bin/packages || true
          fi
          if [ -d bin/targets/airoha/an7581/packages ] && [ -n "$(find bin/targets/airoha/an7581/packages \( -name '*.apk' -o -name '*.ipk' \) | head -1)" ]; then
            tar --zstd -cf ../ipk_out/ipk-target.tar.zst bin/targets/airoha/an7581/packages || true
          fi
          echo "===== ipk_out 内容 ====="
          ls -la ../ipk_out || true
      - name: 上传固件 (Upload Artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-HG5382A-integrated
          path: ./firmware_out/
          if-no-files-found: error
          retention-days: 14
      # ===== GPON 补丁（本 fork 新增）：m 模块软件包单独上传，保留 14 天 =====
      - name: 上传全部软件包 (Upload packages artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-ipk-packages
          path: |
            ./ipk_out/*.tar.zst
          if-no-files-found: warn
          retention-days: 14
      # ===== GPON 补丁（本 fork 新增）：编译失败时显式保存三卷增量缓存 =====
      # 实测：job 主步骤失败时 actions/cache 的 Post 步骤不会保存缓存（中间产物白丢）；
      # 这里在 failure() 时用 actions/cache/save@v4 显式保存，重跑可直接断点续编。
      - name: 失败时保存 toolchain+host 缓存
        if: failure()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ponwrt/staging_dir/toolchain-*
            ponwrt/staging_dir/host
          key: hg5382a-toolchain-${{ hashFiles('ponwrt/configs/an7581.config', 'ponwrt/configs/release.config') }}
      - name: 失败时保存 staging target 缓存
        if: failure()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ponwrt/staging_dir/target-aarch64_cortex-a53_musl
          key: hg5382a-stage-${{ hashFiles('ponwrt/configs/an7581.config', 'ponwrt/configs/release.config') }}
      - name: 失败时保存慢包 build_dir 缓存
        if: failure()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ponwrt/build_dir/hostpkg/golang-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/python3-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/golang-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/sing-box-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/libcronet-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/openssl-*
          key: hg5382a-slow-${{ hashFiles('ponwrt/configs/an7581.config', 'ponwrt/configs/release.config', 'ponwrt/feeds.conf.default') }}
      - name: 上传编译配置与日志 (诊断用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG5382A-diagnostics
          path: |
            ponwrt/.config
            ponwrt/feeds.conf.default
            ponwrt/target/linux/airoha/dts/
            ponwrt/logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3
