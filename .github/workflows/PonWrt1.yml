# ============================================================================
# 編譯 PonWrt HG5382A 韌體 (雙版本 + Nikki Alpha-Smart 預置 + 集客 AC)
# ----------------------------------------------------------------------------
# 功能概览:
#   - 雙 flavor 並行編譯: with-nikki(含 NIKKI 代理 + rtp2httpd) / no-nikki(純淨版)
#   - 鎖定單一機型 fiberhome_hg5382a (AN7581)
#   - with-nikki 預置 mihomo Alpha-Smart 核心 (UPX -9 壓縮)
#   - 集成集客 AC 控制器 (luci-app-gecoosac)，兩個 flavor 均包含
#   - 編譯後打印 PON 相關配置與 DTS 節點 (便於診斷 PON 驅動問題)
#   - 上傳診斷 artifact (.config / feeds / dts / logs)，便於事後排查
#   - 產物統一重命名並發布至 GitHub Releases
# ============================================================================
name: 編譯 PonWrt HG5382A 韌體 (雙版本 + Nikki Alpha-Smart 預置 + 集客AC)

on:
  # 僅手動觸發，避免上游變動導致自動編譯失敗
  workflow_dispatch:

# 需要寫入權限，用於創建 GitHub Release
permissions:
  contents: write

# 同一分支只允許一個編譯任務，避免並發衝突
concurrency:
  group: build-hg5382a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Job: build - 編譯韌體 (矩陣: with-nikki / no-nikki)
  # ==========================================================================
  build:
    name: 編譯韌體 (${{ matrix.flavor }})
    runs-on: ubuntu-24.04
    # 編譯 OpenWrt 通常需要 2-4 小時，設 6 小時上限
    timeout-minutes: 360
    strategy:
      # 其中一個 flavor 失敗不影響另一個繼續
      fail-fast: false
      matrix:
        flavor: [with-nikki, no-nikki]

    steps:
      # ----------------------------------------------------------------------
      # 1. 簽出工作流倉庫 (獲取本 YML 及可能的本地 files/)
      # ----------------------------------------------------------------------
      - name: 簽出工作流倉庫 (Checkout Workflow)
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 確保能讀到完整 git 歷史 (用於獲取上游日期)
          fetch-depth: 0

      # ----------------------------------------------------------------------
      # 2. 清理磁碟空間 - OpenWrt 編譯需要約 30-40GB，GitHub runner 預設不夠
      # ----------------------------------------------------------------------
      - name: 清理磁碟空間 (釋放容量)
        run: |
          # 刪除 runner 上預裝但編譯用不到的大型工具鏈
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache
          sudo docker system prune -af || true
          sudo apt-get clean
          # 建立 8GB swap，防止編譯時 OOM
          sudo swapoff /swapfile || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          # 輸出當前記憶體和磁碟狀態，便於確認
          free -h
          df -h

      # ----------------------------------------------------------------------
      # 3. 安裝編譯依賴 - 對齊 OpenWrt/ImmortalWrt 官方推薦的套件列表
      # ----------------------------------------------------------------------
      - name: 初始化編譯環境 (安裝相依套件)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd \
            libzstd-dev jq dos2unix upx-ucl
          # 說明:
          #   - device-tree-compiler: DTS/DTB 處理
          #   - upx-ucl: 壓縮 mihomo 二進位
          #   - jq: 解析 GitHub API 回應
          #   - libyaml-dev: dtc 相關依賴

      # ----------------------------------------------------------------------
      # 4. 拉取 PonWrt 官方源碼
      # ----------------------------------------------------------------------
      - name: 拉取 PonWrt 官方源碼 (Clone PonWrt)
        run: |
          # 只克隆最新一次提交，節省時間和空間
          git clone --depth 1 https://github.com/pbs05/ponwrt.git ponwrt
          echo ">>> PonWrt 源碼已克隆到 ./ponwrt"
          ls -la ponwrt | head -n 20

      # ----------------------------------------------------------------------
      # 5. 集成集客 AC 控制器 (luci-app-gecoosac)
      # ----------------------------------------------------------------------
      # 說明:
      #   - 集客 AC 有兩個主要分支:
      #       * main (2.x): 支持集客 AP 7.6 及以上固件
      #       * v1.0:       支持舊版集客 AP
      #   - 請根據你的 AP 固件版本選擇分支:
      #       * AP 7.6+:  git clone -b main ...
      #       * 舊版 AP:  git clone -b v1.0 ...
      #   - 源碼放入 package/ 目錄後，編譯系統會自動識別
      #   - 注意: 集客 AC 二進位體積較大，閃存 < 64MB 的設備不建議集成
      # ----------------------------------------------------------------------
      - name: 集成集客 AC 控制器插件 (gecoosac)
        working-directory: ./ponwrt
        run: |
          echo ">>> 正在克隆集客 AC 控制器源碼..."
          # 默認使用 main 分支 (AP 7.6+)。如果你的 AP 是舊版，改成 -b v1.0
          git clone --depth 1 https://github.com/lyin888/openwrt-gecoosac package/openwrt-gecoosac
          echo ">>> 集客 AC 源碼已克隆到 package/openwrt-gecoosac"
          echo ">>> 目錄結構:"
          ls -la package/openwrt-gecoosac/
          echo ">>> 檢查 Makefile 是否聲明依賴:"
          grep -E "DEPENDS|PKG_NAME" package/openwrt-gecoosac/*/Makefile 2>/dev/null || \
            echo "(未找到 Makefile，可能路徑結構不同)"

      # ----------------------------------------------------------------------
      # 6. 注入外部軟體源 (僅 with-nikki 需要: NIKKI + rtp2httpd)
      # ----------------------------------------------------------------------
      - name: 加入外掛來源 (依條件注入 NIKKI + rtp2httpd)
        working-directory: ./ponwrt
        run: |
          # 防護：feeds.conf.default 不存在時自動建立
          if [ ! -f feeds.conf.default ]; then
            echo ">>> feeds.conf.default 不存在，正在建立空檔..."
            touch feeds.conf.default
          fi

          # 先清除可能殘留的 nikki 源 (避免重複)
          sed -i '/nikki/d' feeds.conf.default

          if [ "${{ matrix.flavor }}" = "with-nikki" ]; then
            echo ">>> [with-nikki] 正在加入 NIKKI 外掛軟體源..."
            # 若最後一行沒有換行，補一個，避免拼接錯亂
            [ -n "$(tail -c1 feeds.conf.default 2>/dev/null)" ] && echo "" >> feeds.conf.default
            echo 'src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main' >> feeds.conf.default
            # Windows 換行符可能導致 feeds 解析失敗，強制轉為 LF
            dos2unix feeds.conf.default 2>/dev/null || true

            # 引入 rtp2httpd 完整安裝支援
            echo ">>> 正在引入 rtp2httpd 完整組件..."
            git clone --depth 1 https://github.com/stackia/rtp2httpd /tmp/rtp2httpd
            mkdir -p package
            cp -r /tmp/rtp2httpd/openwrt-support/luci-app-rtp2httpd package/luci-app-rtp2httpd
            cp -r /tmp/rtp2httpd/openwrt-support/rtp2httpd package/rtp2httpd
            # 上游用 .versioned 後綴避免版本衝突，這裡改名為標準 Makefile
            mv package/rtp2httpd/Makefile.versioned package/rtp2httpd/Makefile
            mv package/luci-app-rtp2httpd/Makefile.versioned package/luci-app-rtp2httpd/Makefile
          else
            echo ">>> [no-nikki] 純淨版本，略過 NIKKI 與 rtp2httpd 注入"
          fi

          echo "===== feeds.conf.default 末尾內容 ====="
          tail -n 5 feeds.conf.default || true

      # ----------------------------------------------------------------------
      # 7. 緩存下載的套件 (dl/) - 避免每次重複下載源碼包
      # ----------------------------------------------------------------------
      - name: 快取下載套件 (Cache dl)
        uses: actions/cache@v4
        with:
          path: ponwrt/dl
          # key 包含 feeds 和 config 的哈希，兩者變動時自動失效
          key: ponwrt-dl-an7581-${{ matrix.flavor }}-${{ hashFiles('ponwrt/feeds.conf.default', 'ponwrt/configs/*.config') }}
          # 精確 key 未命中時，回退到同 flavor 的舊緩存
          restore-keys: |
            ponwrt-dl-an7581-${{ matrix.flavor }}-
            ponwrt-dl-an7581-

      # ----------------------------------------------------------------------
      # 8. 更新並安裝 feeds (拉取所有軟體源)
      # ----------------------------------------------------------------------
      - name: 更新並安裝外掛來源 (Feeds)
        working-directory: ./ponwrt
        run: |
          # 拉取 feeds.conf.default 中所有源
          ./scripts/feeds update -a

          if [ "${{ matrix.flavor }}" = "with-nikki" ]; then
            if [ -d feeds/nikki ]; then
              echo ">>> 正在從 feeds/nikki 中剔除 +yq 相依性..."
              # NIKKI 上游某些 Makefile 對 +yq 的依賴與其他包衝突，手動剔除
              find feeds/nikki -name Makefile -exec sed -i -E 's/[[:space:]]*\+yq\b//g' {} +
            fi
          fi

          # 安裝所有可用軟體包到 package/feeds/
          ./scripts/feeds install -a

          # 預設主題改為純淨 Argon
          if [ -f feeds/luci/collections/luci/Makefile ]; then
            sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile || true
          fi

      # ----------------------------------------------------------------------
      # 9. 預置 NIKKI Alpha-Smart 核心 (僅 with-nikki)
      # ----------------------------------------------------------------------
      - name: 預置 Nikki Alpha-Smart 核心並進行 UPX 壓縮 (僅 with-nikki)
        if: matrix.flavor == 'with-nikki'
        working-directory: ./ponwrt
        env:
          # 用 GitHub Token 提高 API 速率限制，避免 403
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo ">>> 正在下載 vernesong/mihomo 最新 Alpha-Smart 核心並 UPX -9 壓縮..."
          mkdir -p files/usr/libexec

          # 透過 GitHub API 查詢 Prerelease-Alpha 的資產列表，匹配 arm64 smart 版本
          SMART_URL=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/vernesong/mihomo/releases/tags/Prerelease-Alpha \
            | jq -r '.assets[] | select(.name | test("^mihomo-linux-arm64-alpha-smart-.*\\.gz$")) | .browser_download_url' | head -n 1)

          # API 匹配失敗時，改從 Release 頁面 HTML 抓取
          if [ -z "$SMART_URL" ] || [ "$SMART_URL" = "null" ]; then
            echo "API 匹配失敗，嘗試從 Release 頁面提取..."
            SMART_URL=$(curl -sL https://github.com/vernesong/mihomo/releases/expanded_assets/Prerelease-Alpha \
              | grep -oE '/vernesong/mihomo/releases/download/Prerelease-Alpha/mihomo-linux-arm64-alpha-smart-[a-zA-Z0-9]+\.gz' \
              | head -n 1)
            [ -n "$SMART_URL" ] && SMART_URL="https://github.com${SMART_URL}"
          fi

          if [ -z "$SMART_URL" ] || [ "$SMART_URL" = "null" ]; then
            echo "::error::未找到符合的 alpha-smart arm64 核心下載地址！"
            exit 1
          fi

          echo "下載位址: $SMART_URL"
          curl -fsSL -o /tmp/mihomo-smart.gz "$SMART_URL"
          gzip -d -f /tmp/mihomo-smart.gz
          chmod +x /tmp/mihomo-smart

          # UPX 極限壓縮，減小固件體積
          echo "執行 UPX -9 極限壓縮..."
          upx -9 /tmp/mihomo-smart || echo "UPX 警告：若已加殼或不支援則略過，直接使用原二進位"

          # 放入 files/ 覆蓋目錄，編譯時會自動複製到固件根文件系統
          mv /tmp/mihomo-smart files/usr/libexec/mihomo
          chmod +x files/usr/libexec/mihomo
          echo ">>> Nikki Alpha-Smart 核心已部署至 files/usr/libexec/mihomo"

      # ----------------------------------------------------------------------
      # 10. 產生 .config 並鎖定 HG5382A 機型
      # ----------------------------------------------------------------------
      - name: 產生並調整韌體設定檔 (鎖定 HG5382A + 核心插件 + 集客AC)
        working-directory: ./ponwrt
        run: |
          # 基於 an7581.config 和 release.config 生成基礎 .config
          perl ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config

          # 移除所有 target/profile 相關行，稍後統一由我們指定
          sed -i '/CONFIG_TARGET_ALL_PROFILES/d' .config
          sed -i '/CONFIG_TARGET_MULTI_PROFILE/d' .config
          sed -i '/CONFIG_TARGET_airoha_an7581_DEVICE_/d' .config
          sed -i '/CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config

          # ---- 公共核心組件 (兩個 flavor 都有) ----
          cat >> .config << 'EOF'
          # 鎖定單一機型: fiberhome_hg5382a
          # CONFIG_TARGET_ALL_PROFILES is not set
          # CONFIG_TARGET_MULTI_PROFILE is not set
          CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5382a=y
          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5382a=y

          # === 主題 Argon（僅核心） ===
          CONFIG_PACKAGE_luci-theme-argon=y
          # CONFIG_PACKAGE_luci-theme-bootstrap is not set

          # === 公共插件 1: TTYD（網頁終端） ===
          CONFIG_PACKAGE_luci-app-ttyd=y

          # === 公共插件 2: DDNS（動態網域） ===
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts=y

          # === 公共插件 3: OpenSSH SFTP（檔案傳輸） ===
          CONFIG_PACKAGE_openssh-sftp-server=y

          # === 集客 AC 控制器（兩個 flavor 均包含） ===
          # 說明: 依賴 luci-compat，編譯系統會自動解析
          #       若編譯報錯找不到套件，請確認源碼已正確放入 package/
          CONFIG_PACKAGE_luci-app-gecoosac=y
          EOF

          # ---- flavor 差異: with-nikki 額外組件 ----
          if [ "${{ matrix.flavor }}" = "with-nikki" ]; then
            echo ">>> [with-nikki] 注入 NIKKI 核心 + rtp2httpd 完整組件 + files/ 覆蓋"
            cat >> .config << 'EOF'
          # 啟用 files/ 目錄覆蓋 (用於預置 mihomo 二進位)
          CONFIG_TARGET_ROOTFS_INCLUDE_FILES=y

          # Nikki 核心（預置二進位 + LuCI）
          CONFIG_PACKAGE_luci-app-nikki=y
          CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-dummy=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_yq=y

          # rtp2httpd 完整組件
          CONFIG_PACKAGE_rtp2httpd=y
          CONFIG_PACKAGE_luci-app-rtp2httpd=y
          CONFIG_PACKAGE_luci-i18n-rtp2httpd-zh-cn=y
          EOF
          else
            echo ">>> [no-nikki] 顯式關閉 NIKKI 與 rtp2httpd"
            echo "# CONFIG_PACKAGE_luci-app-nikki is not set" >> .config
            echo "# CONFIG_PACKAGE_rtp2httpd is not set" >> .config
            echo "# CONFIG_PACKAGE_luci-app-rtp2httpd is not set" >> .config
          fi

          # 讓 kconfig 解析所有依賴，補全缺失項
          make defconfig

          # ---- 校驗: 必須且只能有一個 target device = fiberhome_hg5382a ----
          sp=$(grep -cE '^CONFIG_TARGET_airoha_an7581_DEVICE_.*=y$' .config || true)
          if [ "$sp" -ne 1 ] || ! grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5382a=y$' .config; then
            echo "::error::HG5382A 單一機型鎖定校驗失敗！請檢查 target 設定。"
            exit 1
          fi

          # ---- 校驗: 集客 AC 是否被成功選中 ----
          if ! grep -q '^CONFIG_PACKAGE_luci-app-gecoosac=y$' .config; then
            echo "::warning::集客 AC (luci-app-gecoosac) 未被選中，可能是源碼缺失或依賴未滿足"
          else
            echo ">>> 集客 AC (luci-app-gecoosac) 已成功選中"
          fi

      # ----------------------------------------------------------------------
      # 11. 打印 PON 相關配置 (運行中即可在 Actions 日誌查看)
      # ----------------------------------------------------------------------
      - name: 打印 PON 相关配置 (诊断)
        working-directory: ./ponwrt
        run: |
          echo "===== PON / XPON / GPON / EPON / AIROHA 相关 .config ====="
          grep -iE "PON|XPON|GPON|EPON|AIROHA" .config || echo "(无匹配)"
          echo ""
          echo "===== 重点内核包是否被选中 ====="
          grep -iE "kmod-airoha|airoha-en7581|airoha-npu" .config || echo "(无匹配)"
          echo ""
          echo "===== HG5382A DTS 中的 PON 节点 ====="
          DTS=$(find target/linux/airoha -iname '*hg5382a*.dts' | head -n 1)
          if [ -n "$DTS" ]; then
            echo "DTS 文件: $DTS"
            grep -n -iE "pon|pcs|optical|sfp|xpon|serdes" "$DTS" || echo "(DTS 中无匹配)"
          else
            echo "未找到 HG5382A DTS，列出所有 airoha DTS 供参考："
            find target/linux/airoha -iname '*.dts*' | head -n 30
          fi
          echo ""
          echo "===== PON 相关 feed 是否安装 ====="
          ls -d feeds/* 2>/dev/null | grep -iE "pon|airoha" || echo "(feeds 中无 PON 相关目录)"
          echo ""
          echo "===== 集客 AC 相关配置 ====="
          grep -iE "gecoosac|gecoo" .config || echo "(无匹配)"

      # ----------------------------------------------------------------------
      # 12. 下載所有源碼包 (dl/)
      # ----------------------------------------------------------------------
      - name: 下載原始碼套件 (Download Packages)
        working-directory: ./ponwrt
        run: |
          # GOPROXY 加速 Go 模組下載
          export GOPROXY=https://proxy.golang.org,direct
          export GO111MODULE=on
          make download -j"$(nproc)"
          # 刪除小於 1KB 的殘缺檔案 (下載失敗的垃圾)
          find dl -type f -size -1024c ! -path 'dl/go-mod-cache/*' -delete

      # ----------------------------------------------------------------------
      # 13. 正式編譯固件 (帶日誌落盤)
      # ----------------------------------------------------------------------
      - name: 執行韌體編譯 (Compile Firmware)
        working-directory: ./ponwrt
        run: |
          export GOPROXY=https://proxy.golang.org,direct
          export GOSUMDB=sum.golang.org
          export GO111MODULE=on
          export GOENV=off
          export GOTOOLCHAIN=local

          # 建 logs 目錄，把完整編譯日誌落盤
          mkdir -p logs
          # pipefail: 確保 tee 也能反映 make 的退出碼
          set -o pipefail
          # 多線程失敗時，降級為單線程 V=s 重新編譯，便於看清報錯
          make -j"$(nproc)" 2>&1 | tee logs/build.log || \
            (make -j1 V=s 2>&1 | tee -a logs/build.log)

      # ----------------------------------------------------------------------
      # 14. 整理產物並統一重命名
      # ----------------------------------------------------------------------
      - name: 整理產物與重新命名 (僅保留光貓固件 + 統一規則)
        run: |
          mkdir -p ./firmware_out

          # 只複製 HG5382A 相關的固件和元數據
          find ponwrt/bin/targets/airoha/an7581/ -type f \( \
            -iname '*hg5382a*.bin' -o \
            -iname '*hg5382a*.ubi' -o \
            -iname '*hg5382a*.itb' -o \
            -name '*.buildinfo' -o \
            -name 'profiles.json' \
          \) -exec cp -f {} ./firmware_out/ \;

          # 從上游 git log 獲取日期用於命名
          UPSTREAM_DATE=$(cd ponwrt && git log -1 --format='%cd' --date=format:'%Y%m%d' 2>/dev/null || true)
          [ -z "$UPSTREAM_DATE" ] && UPSTREAM_DATE=$(date +%Y%m%d)
          IMWT_VER="25.2"
          FLAVOR="${{ matrix.flavor }}"
          echo ">>> 上游日期=$UPSTREAM_DATE 版本=$IMWT_VER 標籤=$FLAVOR"

          # 統一重命名: fiberhome_hg5382a-<版本>-<日期>-<flavor>-<类型>.<后缀>
          shopt -s nullglob
          for file in ./firmware_out/*; do
            [ -f "$file" ] || continue
            base=$(basename "$file")
            lower=$(echo "$base" | tr '[:upper:]' '[:lower:]')

            # 跳過非固件
            if [[ ! "$lower" =~ hg5382a ]] || [[ ! "$lower" =~ \.(bin|ubi|itb)$ ]]; then
              continue
            fi

            # 判斷類型
            if [[ "$lower" =~ initramfs ]]; then
              FW_TYPE="initramfs"
            elif [[ "$lower" =~ sysupgrade ]]; then
              FW_TYPE="sysupgrade"
            elif [[ "$lower" =~ factory ]]; then
              FW_TYPE="factory"
            else
              FW_TYPE="firmware"
            fi

            NEW_NAME="fiberhome_hg5382a-${IMWT_VER}-${UPSTREAM_DATE}-${FLAVOR}-${FW_TYPE}.${base##*.}"
            echo "重新命名: $base -> $NEW_NAME"
            mv -f "$file" "./firmware_out/$NEW_NAME"
          done

          # buildinfo / profiles 必須帶 flavor，防止 merge-multiple 覆蓋
          for bf in ./firmware_out/*.buildinfo; do
            [ -f "$bf" ] || continue
            mv -f "$bf" "${bf%.buildinfo}-${FLAVOR}.buildinfo"
          done
          if [ -f ./firmware_out/profiles.json ]; then
            mv -f ./firmware_out/profiles.json "./firmware_out/profiles-${FLAVOR}.json"
          fi

          # 生成 sha256 校驗和
          (
            cd ./firmware_out
            shopt -s nullglob nocaseglob
            target_files=( *hg5382a*.bin *hg5382a*.ubi *hg5382a*.itb )
            if [ "${#target_files[@]}" -eq 0 ]; then
              echo "::error::firmware_out 內沒有 HG5382A 光貓韌體映像"
              exit 1
            fi
            sha256sum "${target_files[@]}" > "sha256sums-${FLAVOR}"
            echo "===== ${FLAVOR} 最終產物 ====="
            ls -lh
          )

      # ----------------------------------------------------------------------
      # 15. 上傳診斷配置與日誌 (即使編譯失敗也上傳)
      # ----------------------------------------------------------------------
      - name: 上傳編譯配置與日誌 (診斷用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG5382A-diagnostics-${{ matrix.flavor }}
          path: |
            ponwrt/.config
            ponwrt/feeds.conf.default
            ponwrt/target/linux/airoha/dts/
            ponwrt/logs/
          if-no-files-found: ignore
          # 3 天後自動過期，避免舊 artifact 堆積
          retention-days: 3

      # ----------------------------------------------------------------------
      # 16. 上傳固件產物 (供 release job 下載)
      # ----------------------------------------------------------------------
      - name: 上傳臨時建置產物 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-HG5382A-${{ matrix.flavor }}
          path: ./firmware_out/
          if-no-files-found: error
          retention-days: 1

  # ==========================================================================
  # Job: release - 統一發布至 GitHub Releases
  # ==========================================================================
  release:
    name: 統一發布至 GitHub Releases
    needs: build
    # 即使 build 部分失敗，只要不是完全取消，仍嘗試發布已有產物
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 下載所有建置產物
        uses: actions/download-artifact@v4
        with:
          pattern: PonWrt-HG5382A-*
          path: ./all_firmwares
          merge-multiple: true

      - name: 列出待發布檔案清單
        run: |
          echo "===== 準備發布的全部光貓韌體清單 ====="
          find ./all_firmwares -type f -printf '%s\t%p\n' | sort -k2
          if ! find ./all_firmwares -type f -iname '*hg5382a*' \( -name '*.bin' -o -name '*.ubi' -o -name '*.itb' \) | grep -q .; then
            echo "::error::沒有可發布的光貓韌體映像"
            exit 1
          fi

      - name: 產生發布標籤與日期
        id: tag
        run: |
          export TZ="Asia/Shanghai"
          {
            echo "release_tag=HG5382A-$(date +'%Y.%m.%d-%H%M%S')-r${{ github.run_number }}"
            echo "release_date=$(date +'%Y-%m-%d %H:%M')"
          } >> "$GITHUB_OUTPUT"

      - name: 正式發布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: PonWrt HG5382A 雙版本純淨光貓固件 (${{ steps.tag.outputs.release_date }})
          fail_on_unmatched_files: true
          body: |
            ### 韌體版本說明
            本韌體**僅適用於烽火 HG5382A（處理器：AN7581）光貓**。  
            檔名統一格式：`fiberhome_hg5382a-<版本>-<上游日期>-<with-nikki|no-nikki>-<類型>.bin`

            ---

            #### 公共核心組件（兩個版本均包含）
            | 類型 | 套件 | 說明 |
            |------|------|------|
            | 主題 | `luci-theme-argon` | 純淨 Argon 主題（僅核心） |
            | 終端 | `luci-app-ttyd` | 網頁終端機（僅核心） |
            | DDNS | `luci-app-ddns` + `ddns-scripts` | 動態網域（僅核心） |
            | 檔案 | `openssh-sftp-server` | SFTP 伺服器（僅核心） |
            | AC控制器 | `luci-app-gecoosac` | 集客 AC 控制器（適用 AP 7.6+） |

            #### 包含 NIKKI + rtp2httpd 進階版（檔名含 `with-nikki`）
            | 類型 | 套件 | 說明 |
            |------|------|------|
            | 代理核心 | **預置 Alpha-Smart + UPX -9** | 放置於 `/usr/libexec/mihomo` |
            | 代理插件 | `luci-app-nikki` + 簡中 | 透明代理管理界面 |
            | 核心模組 | `kmod-nft-tproxy` `kmod-tun` `kmod-inet-diag` `kmod-nft-socket` `kmod-dummy` | TProxy / TUN |
            | 工具 | `ip-full` `yq` | 完整 ip 命令與配置處理 |
            | IPTV | `rtp2httpd` + `luci-app-rtp2httpd` + 簡中 | 完整 IPTV 串流轉換服務（完整組件） |

            #### 純淨輕量版（檔名含 `no-nikki`）
            僅包含上方「公共核心組件」，**完全不含** nikki / mihomo / rtp2httpd / yq / TProxy / TUN 相關組件。

            ---

            #### ⚠️ 集客 AC 版本說明
            - 本固件集成的集客 AC 為 **main 分支（適用集客 AP 7.6 及以上固件）**
            - 若你的集客 AP 固件低於 7.6，請在 YML 中改用 `-b v1.0` 重新編譯
            - 集客 AC 二進位較大，若刷機後空間不足，可考慮使用 no-nikki 版本

            ---

            - 編譯完成時間：${{ steps.tag.outputs.release_date }}（UTC+8）
            - 另附 `sha256sums-*`、`*.buildinfo`、`profiles-*.json`
          files: ./all_firmwares/*
