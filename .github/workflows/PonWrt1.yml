name: 编译 PonWrt HG5382A 集成版固件 (mihomo + sing-box + IPTV + omcproxy + GPON)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-hg5382a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译HG5382A电信版集成版固件
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_REF: d01485cc909fac33144dc07fa9dc05ed4455380f
    steps:
      - name: 签出工作流仓库 (Checkout Workflow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 清理磁盘空间 (释放容量)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache
          sudo docker system prune -af || true
          sudo apt-get clean
          sudo swapoff /swapfile || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: 初始化编译环境 (安装依赖软件包)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd \
            libzstd-dev jq dos2unix upx-ucl

      - name: 拉取 PonWrt 指定 commit (Clone PonWrt @ pinned)
        run: |
          git init ponwrt
          git -C ponwrt remote add origin https://github.com/pbs05/ponwrt.git
          git -C ponwrt fetch --depth=1 -- origin "$SOURCE_REF"
          git -C ponwrt checkout --detach FETCH_HEAD
          echo ">>> PonWrt pinned: $SOURCE_REF"

      - name: 加入外挂来源 (nikki + homeproxy + openwrt-iptv)
        working-directory: ./ponwrt
        run: |
          if [ ! -f feeds.conf.default ]; then touch feeds.conf.default; fi
          sed -i '/nikki/d;/homeproxy/d;/openwrt-iptv/d;/airoha-npu/d' feeds.conf.default
          [ -n "$(tail -c1 feeds.conf.default 2>/dev/null)" ] && echo "" >> feeds.conf.default
          echo 'src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main' >> feeds.conf.default
          echo 'src-git homeproxy https://github.com/immortalwrt/homeproxy.git;master' >> feeds.conf.default
          echo 'src-git iptv https://github.com/yveming/openwrt-iptv.git' >> feeds.conf.default
          dos2unix feeds.conf.default 2>/dev/null || true
          tail -n 10 feeds.conf.default

      - name: 注入 luci-app-airoha-npu 到 package 目录（修复原 feed 嵌套目录报错）
        working-directory: ./ponwrt
        run: |
          git clone --depth 1 https://github.com/rchen14b/luci-app-airoha-npu.git package/luci-app-airoha-npu
          rm -rf package/luci-app-airoha-npu/.git package/luci-app-airoha-npu/.github package/luci-app-airoha-npu/screenshots
          rm -rf package/luci-app-airoha-npu/luci-app-airoha-npu
          echo ">>> luci-app-airoha-npu 注入完成，已删除嵌套旧目录"

      - name: 缓存下载软件包 (Cache dl)
        uses: actions/cache@v4
        with:
          path: ponwrt/dl
          key: ponwrt-dl-an7581-${{ hashFiles('ponwrt/feeds.conf.default', 'ponwrt/configs/*.config') }}
          restore-keys: |
            ponwrt-dl-an7581-
            ponwrt-dl-

      - name: 缓存 toolchain + host 工具
        uses: actions/cache@v4
        with:
          path: |
            ponwrt/staging_dir/toolchain-*
            ponwrt/staging_dir/host
          key: hg5382a-toolchain-${{ hashFiles('ponwrt/configs/an7581.config', 'ponwrt/configs/release.config') }}
          restore-keys: |
            hg5382a-toolchain-

      - name: 缓存包安装产物 (staging target)
        uses: actions/cache@v4
        with:
          path: ponwrt/staging_dir/target-aarch64_cortex-a53_musl
          key: hg5382a-stage-${{ hashFiles('ponwrt/configs/an7581.config', 'ponwrt/configs/release.config') }}
          restore-keys: |
            hg5382a-stage-

      - name: 缓存慢包构建目录
        uses: actions/cache@v4
        with:
          path: |
            ponwrt/build_dir/hostpkg/golang-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/python3-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/golang-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/sing-box-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/libcronet-*
            ponwrt/build_dir/target-aarch64_cortex-a53_musl/openssl-*
          key: hg5382a-slow-${{ hashFiles('ponwrt/configs/an7581.config', 'ponwrt/configs/release.config', 'ponwrt/feeds.conf.default') }}
          restore-keys: |
            hg5382a-slow-

      - name: 更新并安装外挂来源 (Feeds)
        working-directory: ./ponwrt
        run: |
          ./scripts/feeds update -a
          if [ -d feeds/nikki ]; then
            echo ">>> 剔除 nikki 的 +yq 依赖"
            find feeds/nikki -name Makefile -exec sed -i -E 's/[[:space:]]*\+yq\b//g' {} + || true
          fi
          ./scripts/feeds install -a
          if [ -f feeds/luci/collections/luci/Makefile ]; then
            sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile || true
          fi

      - name: 修正 luci-app-iptv 打包定义（移除冲突文件安装）
        working-directory: ./ponwrt
        run: |
          set -e
          MK="feeds/pon_userspace/luci-app-iptv/Makefile"
          if [ ! -f "$MK" ]; then
            echo "::error::找不到 $MK"
            exit 1
          fi
          cp -f "$MK" "$MK.orig"
          sed -i 's/+kmod-iptv/kmod-iptv/g' "$MK"
          sed -i '/\/etc\/config\/iptv/d' "$MK"
          sed -i '/\/etc\/init\.d\/iptv/d' "$MK"
          if grep -qE '/etc/config/iptv|/etc/init\.d/iptv' "$MK"; then
            echo "::error::luci-app-iptv Makefile 仍包含冲突文件安装路径"
            exit 1
          fi
          echo ">>> luci-app-iptv Makefile 修改完成（独立编译时不再覆盖 kmod-iptv）"

      - name: 应用 GPON feed 补丁 (Apply GPON feed patches)
        env:
          PONWRT_DIR: ponwrt
          FEED_PATCHES_STRICT: '1'
        run: bash scripts/apply-feed-patches.sh

      - name: 校验 GPON 补丁已生效 (Verify GPON patches)
        working-directory: ./ponwrt
        run: |
          set -e
          test -f feeds/pon_drivers/airoha-xpon/src/airoha-xpon-gpon.c
          grep -q 'AIROHA_PON_FRONTEND_MODE_GPON' \
            feeds/pon_drivers/airoha-pon-frontends/src/airoha-paged-bosa-ux3363.c
          grep -q "o.value('gpon'" \
            feeds/pon_userspace/luci-app-pon/htdocs/luci-static/resources/view/pon/config.js
          echo "OK: GPON patches are present."

      - name: 注入 libffi 包
        working-directory: ./ponwrt
        run: |
          mkdir -p package/libs/libffi
          curl -fsSL -o package/libs/libffi/Makefile \
            https://raw.githubusercontent.com/openwrt/openwrt/master/package/libs/libffi/Makefile
          if grep -q 'PKG_NAME:=libffi' package/libs/libffi/Makefile; then
            echo ">>> libffi 包注入成功"
          else
            echo "::error::libffi 包注入失败"
            exit 1
          fi

      - name: 生成并锁定 HG5382A 固件配置（独立包不参与固件）
        working-directory: ./ponwrt
        run: |
          rm -rf tmp
          perl ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config
          sed -i '/CONFIG_TARGET_ALL_PROFILES/d' .config
          sed -i '/CONFIG_TARGET_MULTI_PROFILE/d' .config
          sed -i '/CONFIG_TARGET_airoha_an7581_DEVICE_/d' .config
          sed -i '/CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
          cat >> .config << 'EOF'
          # CONFIG_TARGET_ALL_PROFILES is not set
          # CONFIG_TARGET_MULTI_PROFILE is not set
          CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5382a=y
          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5382a=y
          CONFIG_PACKAGE_luci-theme-argon=y
          # CONFIG_PACKAGE_luci-theme-bootstrap is not set
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          # CONFIG_SING_BOX_BUILD_NAIVE_OUTBOUND is not set
          EOF
          make defconfig
          sp=$(grep -cE '^CONFIG_TARGET_airoha_an7581_DEVICE_.*=y$' .config || true)
          if [ "$sp" -ne 1 ] || ! grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5382a=y$' .config; then
            echo "::error::HG5382A 单一机型锁定校验失败！"
            exit 1
          fi
          cat >> .config << 'EOF'
          # --- PON 修复 ---
          CONFIG_PACKAGE_kmod-airoha-paged-bosa=y
          CONFIG_PACKAGE_kmod-airoha-pon-frontend=y
          CONFIG_PACKAGE_kmod-airoha-xpon=y
          CONFIG_PACKAGE_airoha-ponctl=y
          CONFIG_PACKAGE_airoha-pond=y
          # --- 透明代理内核模块 ---
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-dummy=y
          # --- mihomo ---
          CONFIG_PACKAGE_mihomo-meta=y
          CONFIG_PACKAGE_nikki=y
          CONFIG_PACKAGE_luci-app-nikki=y
          CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y
          # --- sing-box ---
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_sing-box=y
          # CONFIG_SING_BOX_BUILD_NAIVE_OUTBOUND is not set
          # --- curl / libcurl ---
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_libcurl=y
          CONFIG_PACKAGE_libidn2=y
          CONFIG_PACKAGE_libnghttp2=y
          CONFIG_PACKAGE_libpsl=y
          CONFIG_PACKAGE_libgnutls=y
          CONFIG_PACKAGE_libtasn1=y
          CONFIG_PACKAGE_libunistring=y
          CONFIG_PACKAGE_nettle=y
          CONFIG_PACKAGE_gmp=y
          # --- 工具 ---
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_yq=y
          # --- python3 修复 ---
          CONFIG_PACKAGE_libffi=y
          # --- sing-box full 修复 ---
          CONFIG_PACKAGE_libcronet=y
          # --- IPTV 驱动（核心）---
          CONFIG_PACKAGE_kmod-iptv=y
          # --- omcproxy ---
          CONFIG_PACKAGE_omcproxy=y
          CONFIG_PACKAGE_luci-app-omcproxy=y
          # --- 独立软件包，不参与固件编译 ---
          # CONFIG_PACKAGE_luci-app-iptv is not set
          # CONFIG_PACKAGE_luci-app-airoha-npu is not set
          EOF
          echo ">>> 固件配置完成（luci-app-iptv 与 luci-app-airoha-npu 均不参与固件编译）"

      - name: 下载源码软件包 (容错)
        working-directory: ./ponwrt
        run: |
          export GOPROXY=https://goproxy.cn,https://goproxy.io,direct
          export GO111MODULE=on
          make download -j"$(nproc)" || true
          find dl -type f -size -1024c ! -path 'dl/go-mod-cache/*' -delete
          make download -j1 V=s || { echo "::warning::仍有软件包下载失败，编译阶段会再尝试"; }
          find dl -type f -size -1024c ! -path 'dl/go-mod-cache/*' -delete

      - name: 执行固件编译 (Compile Firmware)
        working-directory: ./ponwrt
        run: |
          export GOPROXY=https://goproxy.cn,https://goproxy.io,direct
          export GOSUMDB=sum.golang.org
          export GO111MODULE=on
          export GOENV=off
          export GOTOOLCHAIN=local
          mkdir -p logs
          rm -rf staging_dir/target-aarch64_cortex-a53_musl/stamp
          make package/libs/libffi/compile -j"$(nproc)" V=s || true
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee logs/build.log || \
            (echo ">>> 并行编译失败，回退单线程重编" && make -j1 V=s 2>&1 | tee -a logs/build.log)

      - name: 整理固件产物 (Collect Firmware)
        run: |
          mkdir -p ./firmware_out
          find ponwrt/bin/targets/airoha/an7581/ -type f \( \
            -iname '*hg5382a*.bin' -o -iname '*hg5382a*.ubi' -o -iname '*hg5382a*.itb' -o \
            -name '*.buildinfo' -o -name 'profiles.json' \
          \) -exec cp -f {} ./firmware_out/ \;
          (
            cd ./firmware_out
            shopt -s nullglob nocaseglob
            files=( *hg5382a*.bin *hg5382a*.ubi *hg5382a*.itb )
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::firmware_out 内没有 HG5382A 固件映像"
              exit 1
            fi
            sha256sum "${files[@]}" > sha256sums
            echo "===== 固件产物 ====="
            ls -lh
          )

      - name: 尝试编译独立软件包（失败不影响固件）
        working-directory: ./ponwrt
        run: |
          set +e
          echo "=============================================="
          echo ">>> 固件已编译完成，开始尝试编译独立软件包"
          echo ">>> 注意：以下任何失败都不会影响固件发布"
          echo "=============================================="

          # 关键修复：iptv 之前没执行 feeds install，补充生成软链接
          ./scripts/feeds install luci-app-iptv

          # 修改配置，将两个独立包设为 =m
          sed -i 's|^# CONFIG_PACKAGE_luci-app-iptv is not set$|CONFIG_PACKAGE_luci-app-iptv=m|' .config
          sed -i 's|^# CONFIG_PACKAGE_luci-app-airoha-npu is not set$|CONFIG_PACKAGE_luci-app-airoha-npu=m|' .config

          # 修复：olddefconfig，保留已设置的=m，只补依赖，不要defconfig
          make olddefconfig >/dev/null 2>&1

          echo ">>> 当前config独立包状态"
          grep -E 'CONFIG_PACKAGE_luci-app-iptv|CONFIG_PACKAGE_luci-app-airoha-npu' .config

          # 单独下载源码（失败不中断）
          echo ">>> 下载 luci-app-iptv 源码"
          make package/luci-app-iptv/download V=s 2>&1 | tail -5 || echo "::warning::luci-app-iptv 源码下载失败（不影响固件）"

          echo ">>> 下载 luci-app-airoha-npu 源码"
          make package/luci-app-airoha-npu/download V=s 2>&1 | tail -5 || echo "::warning::luci-app-airoha-npu 源码下载失败（不影响固件）"

          # 单独编译 luci-app-iptv
          echo ">>> 尝试编译 luci-app-iptv"
          make package/luci-app-iptv/compile -j"$(nproc)" V=s 2>&1 | tee logs/iptv-pkg.log | tail -20
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::warning::luci-app-iptv 编译失败（不影响固件）"
          else
            echo ">>> luci-app-iptv 编译成功"
          fi

          # 单独编译 luci-app-airoha-npu
          echo ">>> 尝试编译 luci-app-airoha-npu"
          make package/luci-app-airoha-npu/compile -j1 V=s 2>&1 | tee logs/npu-pkg.log | tail -20
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::warning::luci-app-airoha-npu 编译失败（不影响固件）"
          else
            echo ">>> luci-app-airoha-npu 编译成功"
          fi

          echo ">>> 【调试】打印bin目录结构，查看apk实际输出位置"
          ls -la bin/
          ls -la bin/packages/*/ 2>/dev/null || true
          ls -la bin/targets/*/*/packages/ 2>/dev/null || true

          echo ">>> 独立软件包编译尝试结束（无论成败，固件不受影响）"
          exit 0

      - name: 打包全部软件包 (Pack all packages)
        if: always()
        working-directory: ./ponwrt
        run: |
          mkdir -p ../ipk_out
          if [ -d bin/packages ] && [ -n "$(find bin/packages \( -name '*.apk' -o -name '*.ipk' \) | head -1)" ]; then
            tar --zstd -cf ../ipk_out/ipk-packages.tar.zst bin/packages || true
          fi
          if [ -d bin/targets/airoha/an7581/packages ] && [ -n "$(find bin/targets/airoha/an7581/packages \( -name '*.apk' -o -name '*.ipk' \) | head -1)" ]; then
            tar --zstd -cf ../ipk_out/ipk-target.tar.zst bin/targets/airoha/an7581/packages || true
          fi

      - name: 收集独立软件包（如编译成功）【修复noarch包搜索范围】
        if: always()
        working-directory: ./ponwrt
        run: |
          mkdir -p ../ipk_out
          for pkg in luci-app-iptv luci-app-airoha-npu; do
            found=0
            # 修复：同时扫描 bin/packages/* (noarch包在这里) + bin/targets/*/packages
            while IFS= read -r -d '' f; do
              cp -f "$f" ../ipk_out/
              found=1
            done < <(find bin -type f \( -name "${pkg}*.apk" -o -name "${pkg}*.ipk" \) -print0 )
            if [ "$found" -eq 1 ]; then
              echo ">>> 已收集 ${pkg} 独立包"
            else
              echo "::notice::${pkg} 独立包未生成（可能编译失败），跳过"
            fi
          done
          ls -lh ../ipk_out/luci-app-*.apk ../ipk_out/luci-app-*.ipk 2>/dev/null || true

      - name: 上传固件 (Upload Artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-HG5382A-integrated
          path: ./firmware_out/
          if-no-files-found: error
          retention-days: 14

      - name: 上传全部软件包 (Upload packages artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-ipk-packages
          path: |
            ./ipk_out/*.tar.zst
            ./ipk_out/*.apk
            ./ipk_out/*.ipk
          if-no-files-found: warn
          retention-days: 14

      - name: 准备预发布文件 (Prepare pre-release assets)
        if: success()
        run: |
          rm -rf release_out
          mkdir -p release_out
          cp -f firmware_out/* release_out/ 2>/dev/null || true
          cp -f ipk_out/*.tar.zst release_out/ 2>/dev/null || true
          cp -f ipk_out/*.apk release_out/ 2>/dev/null || true
          cp -f ipk_out/*.ipk release_out/ 2>/dev/null || true
          cd release_out
          shopt -s nullglob
          files=( *)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::release_out 内没有可预发布文件"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          ls -lh

      - name: 创建 GitHub 预发布 (Create GitHub pre-release)
        if: success()
        uses: softprops/action-gh-release@v2.0.8
        with:
          tag_name: ponwrt-hg5382a-${{ github.run_number }}-${{ github.run_attempt }}
          name: PonWrt HG5382A 集成版预发布 #${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          body: |
            本 Release 为 PonWrt HG5382A 集成版自动预发布。

            包含：
            - HG5382A 固件镜像（bin/ubi/itb 等）
            - 全部软件包压缩包（ipk-packages.tar.zst / ipk-target.tar.zst）
            - 独立 luci-app-iptv 软件包（如编译成功）
            - 独立 luci-app-airoha-npu 软件包（如编译成功）
            - SHA256SUMS 校验和

            注意：独立软件包为附加产物，编译失败不会影响固件。这是预发布，仅用于测试。
          files: |
            release_out/*

      - name: 失败时保存缓存
        if: failure()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ponwrt/staging_dir/toolchain-*
            ponwrt/staging_dir/host
            ponwrt/staging_dir/target-aarch64_cortex-a53_musl
          key: hg5382a-cache-${{ hashFiles('ponwrt/configs/an7581.config', 'ponwrt/configs/release.config') }}

      - name: 上传编译配置与日志 (诊断用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG5382A-diagnostics
          path: |
            ponwrt/.config
            ponwrt/feeds.conf.default
            ponwrt/logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3
