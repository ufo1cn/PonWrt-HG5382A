# ============================================================================
# 编译 PonWrt HG5382A 固件 (双版本 + Nikki 编译模块 + 集客 AC)
# ----------------------------------------------------------------------------
# 功能概览:
#   - 双 flavor 并行编译: with-nikki(含 NIKKI 代理 + rtp2httpd + 集客AC) / no-nikki(纯净版)
#   - 锁定单一机型 fiberhome_hg5382a (AN7581)
#   - with-nikki 以 OpenWrt 包方式编译 mihomo-meta（不再预置二进制）
#   - 集成版保证选中 libffi（解决 python3 的 ffi.h 编译失败）
#   - 集客 AC 控制器仅集成版包含
#   - 编译后打印 PON 相关配置与 DTS 节点 (便于诊断 PON 驱动问题)
#   - 上传诊断 artifact (.config / feeds / dts / logs)，便于事后排查
#   - 产物统一重命名并发布至 GitHub Releases
# ============================================================================
name: 编译 PonWrt HG5382A 固件 (双版本 + Nikki 编译模块 + 集客AC)

on:
  # 仅手动触发，避免上游变动导致自动编译失败
  workflow_dispatch:

# 需要写入权限，用于创建 GitHub Release
permissions:
  contents: write

# 同一分支只允许一个编译任务，避免并发冲突
concurrency:
  group: build-hg5382a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Job: build - 编译固件 (矩阵: with-nikki / no-nikki)
  # ==========================================================================
  build:
    name: 编译固件 (${{ matrix.flavor }})
    runs-on: ubuntu-24.04
    # 编译 OpenWrt 通常需要 2-4 小时，设 6 小时上限
    timeout-minutes: 360
    strategy:
      # 其中一个 flavor 失败不影响另一个继续
      fail-fast: false
      matrix:
        flavor: [with-nikki, no-nikki]

    steps:
      # ----------------------------------------------------------------------
      # 1. 签出工作流仓库 (获取本 YML 及可能的本地 files/)
      # ----------------------------------------------------------------------
      - name: 签出工作流仓库 (Checkout Workflow)
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 确保能读到完整 git 历史 (用于获取上游日期)
          fetch-depth: 0

      # ----------------------------------------------------------------------
      # 2. 清理磁盘空间 - OpenWrt 编译需要约 30-40GB，GitHub runner 默认不够
      # ----------------------------------------------------------------------
      - name: 清理磁盘空间 (释放容量)
        run: |
          # 删除 runner 上预装但编译用不到的大型工具链
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache
          sudo docker system prune -af || true
          sudo apt-get clean
          # 建立 8GB swap，防止编译时 OOM
          sudo swapoff /swapfile || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          # 输出当前内存和磁盘状态，便于确认
          free -h
          df -h

      # ----------------------------------------------------------------------
      # 3. 安装编译依赖
      # ----------------------------------------------------------------------
      - name: 初始化编译环境 (安装依赖软件包)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd \
            libzstd-dev jq dos2unix upx-ucl \
            libffi-dev

      # ----------------------------------------------------------------------
      # 4. 拉取 PonWrt 官方源码
      # ----------------------------------------------------------------------
      - name: 拉取 PonWrt 官方源码 (Clone PonWrt)
        run: |
          git clone --depth 1 https://github.com/pbs05/ponwrt.git ponwrt
          echo ">>> PonWrt 源码已克隆到 ./ponwrt"
          ls -la ponwrt | head -n 20

      # ----------------------------------------------------------------------
      # 5. 集成集客 AC 控制器 (luci-app-gecoosac) — 仅 with-nikki
      # ----------------------------------------------------------------------
      - name: 集成集客 AC 控制器插件 (gecoosac，仅 with-nikki)
        if: matrix.flavor == 'with-nikki'
        working-directory: ./ponwrt
        run: |
          echo ">>> 正在克隆集客 AC 控制器源码..."
          git clone --depth 1 https://github.com/lyin888/openwrt-gecoosac package/openwrt-gecoosac
          echo ">>> 集客 AC 源码已克隆到 package/openwrt-gecoosac"
          ls -la package/openwrt-gecoosac/
          grep -E "DEPENDS|PKG_NAME" package/openwrt-gecoosac/*/Makefile 2>/dev/null || \
            echo "(未找到 Makefile，可能路径结构不同)"

      # ----------------------------------------------------------------------
      # 6. 注入外部软件源 (仅 with-nikki 需要: NIKKI + rtp2httpd)
      # ----------------------------------------------------------------------
      - name: 加入外挂来源 (依条件注入 NIKKI + rtp2httpd)
        working-directory: ./ponwrt
        run: |
          if [ ! -f feeds.conf.default ]; then
            echo ">>> feeds.conf.default 不存在，正在建立空文件..."
            touch feeds.conf.default
          fi

          sed -i '/nikki/d' feeds.conf.default

          if [ "${{ matrix.flavor }}" = "with-nikki" ]; then
            echo ">>> [with-nikki] 正在加入 NIKKI 外挂软件源..."
            [ -n "$(tail -c1 feeds.conf.default 2>/dev/null)" ] && echo "" >> feeds.conf.default
            echo 'src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main' >> feeds.conf.default
            dos2unix feeds.conf.default 2>/dev/null || true

            echo ">>> 正在引入 rtp2httpd 完整组件..."
            git clone --depth 1 https://github.com/stackia/rtp2httpd /tmp/rtp2httpd
            mkdir -p package
            cp -r /tmp/rtp2httpd/openwrt-support/luci-app-rtp2httpd package/luci-app-rtp2httpd
            cp -r /tmp/rtp2httpd/openwrt-support/rtp2httpd package/rtp2httpd
            mv package/rtp2httpd/Makefile.versioned package/rtp2httpd/Makefile
            mv package/luci-app-rtp2httpd/Makefile.versioned package/luci-app-rtp2httpd/Makefile
          else
            echo ">>> [no-nikki] 纯净版本，略过 NIKKI 与 rtp2httpd 注入"
          fi

          echo "===== feeds.conf.default 末尾内容 ====="
          tail -n 5 feeds.conf.default || true

      # ----------------------------------------------------------------------
      # 7. 缓存下载的软件包 (dl/)
      # ----------------------------------------------------------------------
      - name: 缓存下载软件包 (Cache dl)
        uses: actions/cache@v4
        with:
          path: ponwrt/dl
          key: ponwrt-dl-an7581-${{ matrix.flavor }}-${{ hashFiles('ponwrt/feeds.conf.default', 'ponwrt/configs/*.config') }}
          restore-keys: |
            ponwrt-dl-an7581-${{ matrix.flavor }}-
            ponwrt-dl-an7581-

      # ----------------------------------------------------------------------
      # 8. 更新并安装 feeds
      # ----------------------------------------------------------------------
      - name: 更新并安装外挂来源 (Feeds)
        working-directory: ./ponwrt
        run: |
          ./scripts/feeds update -a

          if [ "${{ matrix.flavor }}" = "with-nikki" ]; then
            if [ -d feeds/nikki ]; then
              echo ">>> 正在从 feeds/nikki 中剔除 +yq 依赖..."
              find feeds/nikki -name Makefile -exec sed -i -E 's/[[:space:]]*\+yq\b//g' {} +
            fi
          fi

          ./scripts/feeds install -a

          if [ -f feeds/luci/collections/luci/Makefile ]; then
            sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile || true
          fi

      # ----------------------------------------------------------------------
      # 9. （原“预置 Alpha-Smart 二进制”步骤已删除，mihomo 改为编译模块）
      # ----------------------------------------------------------------------

      # ----------------------------------------------------------------------
      # 10. 生成 .config 并锁定 HG5382A 机型
      # ----------------------------------------------------------------------
      - name: 生成并调整固件设置文件 (锁定 HG5382A + 核心插件 + 集客AC)
        working-directory: ./ponwrt
        run: |
          perl ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config

          sed -i '/CONFIG_TARGET_ALL_PROFILES/d' .config
          sed -i '/CONFIG_TARGET_MULTI_PROFILE/d' .config
          sed -i '/CONFIG_TARGET_airoha_an7581_DEVICE_/d' .config
          sed -i '/CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config

          # ---- 公共核心组件 (两个 flavor 都有) ----
          cat >> .config << 'EOF'
          # 锁定单一机型: fiberhome_hg5382a
          # CONFIG_TARGET_ALL_PROFILES is not set
          # CONFIG_TARGET_MULTI_PROFILE is not set
          CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5382a=y
          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5382a=y

          # === 主题 Argon（仅核心） ===
          CONFIG_PACKAGE_luci-theme-argon=y
          # CONFIG_PACKAGE_luci-theme-bootstrap is not set

          # === 公共插件 1: TTYD（网页终端） ===
          CONFIG_PACKAGE_luci-app-ttyd=y

          # === 公共插件 2: DDNS（动态域名） ===
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts=y

          # === 公共插件 3: OpenSSH SFTP（文件传输） ===
          CONFIG_PACKAGE_openssh-sftp-server=y
          EOF

          # ---- flavor 差异: with-nikki 额外组件 ----
          if [ "${{ matrix.flavor }}" = "with-nikki" ]; then
            echo ">>> [with-nikki] 注入 NIKKI 核心（编译为模块）+ rtp2httpd + 集客AC + libffi"
            cat >> .config << 'EOF'
          # === 确保 libffi 被选中（python3 的 ffi.h 依赖） ===
          CONFIG_PACKAGE_libffi=y

          # === NIKKI 核心（由 nikki feed 编译为 OpenWrt 包，取代预置二进制） ===
          CONFIG_PACKAGE_mihomo-meta=y
          CONFIG_PACKAGE_luci-app-nikki=y
          CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-dummy=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_yq=y

          # === rtp2httpd 完整组件 ===
          CONFIG_PACKAGE_rtp2httpd=y
          CONFIG_PACKAGE_luci-app-rtp2httpd=y
          CONFIG_PACKAGE_luci-i18n-rtp2httpd-zh-cn=y

          # === 集客 AC 控制器（仅集成版） ===
          CONFIG_PACKAGE_luci-app-gecoosac=y
          EOF
          else
            echo ">>> [no-nikki] 显式关闭 NIKKI / rtp2httpd / 集客AC / libffi 相关选项"
            cat >> .config << 'EOF'
          # CONFIG_PACKAGE_luci-app-nikki is not set
          # CONFIG_PACKAGE_mihomo-meta is not set
          # CONFIG_PACKAGE_rtp2httpd is not set
          # CONFIG_PACKAGE_luci-app-rtp2httpd is not set
          # CONFIG_PACKAGE_luci-app-gecoosac is not set
          # CONFIG_PACKAGE_libffi is not set
          EOF
          fi

          make defconfig

          # ---- 校验: 必须且只能有一个 target device = fiberhome_hg5382a ----
          sp=$(grep -cE '^CONFIG_TARGET_airoha_an7581_DEVICE_.*=y$' .config || true)
          if [ "$sp" -ne 1 ] || ! grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5382a=y$' .config; then
            echo "::error::HG5382A 单一机型锁定校验失败！请检查 target 设置。"
            exit 1
          fi

          # ---- 校验（仅 with-nikki）: 集客 AC、mihomo-meta、libffi 是否被成功选中 ----
          if [ "${{ matrix.flavor }}" = "with-nikki" ]; then
            for pkg in luci-app-gecoosac mihomo-meta libffi; do
              if ! grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config; then
                echo "::error::with-nikki 未选中 ${pkg}，请检查依赖或源码。"
                exit 1
              else
                echo ">>> 已选中 ${pkg}"
              fi
            done
          else
            if grep -q '^CONFIG_PACKAGE_luci-app-gecoosac=y$' .config; then
              echo "::error::no-nikki 不应包含集客 AC！"
              exit 1
            fi
          fi

      # ----------------------------------------------------------------------
      # 11. 打印 PON 相关配置 (诊断)
      # ----------------------------------------------------------------------
      - name: 打印 PON 相关配置 (诊断)
        working-directory: ./ponwrt
        run: |
          echo "===== PON / XPON / GPON / EPON / AIROHA 相关 .config ====="
          grep -iE "PON|XPON|GPON|EPON|AIROHA" .config || echo "(无匹配)"
          echo ""
          echo "===== 重点内核包是否被选中 ====="
          grep -iE "kmod-airoha|airoha-en7581|airoha-npu" .config || echo "(无匹配)"
          echo ""
          echo "===== HG5382A DTS 中的 PON 节点 ====="
          DTS=$(find target/linux/airoha -iname '*hg5382a*.dts' | head -n 1)
          if [ -n "$DTS" ]; then
            echo "DTS 文件: $DTS"
            grep -n -iE "pon|pcs|optical|sfp|xpon|serdes" "$DTS" || echo "(DTS 中无匹配)"
          else
            echo "未找到 HG5382A DTS，列出所有 airoha DTS 供参考："
            find target/linux/airoha -iname '*.dts*' | head -n 30
          fi
          echo ""
          echo "===== PON 相关 feed 是否安装 ====="
          ls -d feeds/* 2>/dev/null | grep -iE "pon|airoha" || echo "(feeds 中无 PON 相关目录)"
          echo ""
          echo "===== 集客 AC / mihomo / libffi 相关配置 ====="
          grep -iE "gecoosac|gecoo|mihomo|libffi" .config || echo "(无匹配)"

      # ----------------------------------------------------------------------
      # 12. 下载所有源码包 (dl/)
      # ----------------------------------------------------------------------
      - name: 下载源码软件包 (Download Packages)
        working-directory: ./ponwrt
        run: |
          export GOPROXY=https://proxy.golang.org,direct
          export GO111MODULE=on
          make download -j"$(nproc)"
          find dl -type f -size -1024c ! -path 'dl/go-mod-cache/*' -delete

      # ----------------------------------------------------------------------
      # 13. 正式编译固件 (带日志落盘)
      # ----------------------------------------------------------------------
      - name: 执行固件编译 (Compile Firmware)
        working-directory: ./ponwrt
        run: |
          export GOPROXY=https://proxy.golang.org,direct
          export GOSUMDB=sum.golang.org
          export GO111MODULE=on
          export GOENV=off
          export GOTOOLCHAIN=local

          mkdir -p logs
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee logs/build.log || \
            (make -j1 V=s 2>&1 | tee -a logs/build.log)

      # ----------------------------------------------------------------------
      # 14. 整理产物并统一重命名
      # ----------------------------------------------------------------------
      - name: 整理产物与重新命名 (仅保留光猫固件 + 统一规则)
        run: |
          mkdir -p ./firmware_out

          find ponwrt/bin/targets/airoha/an7581/ -type f \( \
            -iname '*hg5382a*.bin' -o \
            -iname '*hg5382a*.ubi' -o \
            -iname '*hg5382a*.itb' -o \
            -name '*.buildinfo' -o \
            -name 'profiles.json' \
          \) -exec cp -f {} ./firmware_out/ \;

          UPSTREAM_DATE=$(cd ponwrt && git log -1 --format='%cd' --date=format:'%Y%m%d' 2>/dev/null || true)
          [ -z "$UPSTREAM_DATE" ] && UPSTREAM_DATE=$(date +%Y%m%d)
          IMWT_VER="25.2"
          FLAVOR="${{ matrix.flavor }}"
          echo ">>> 上游日期=$UPSTREAM_DATE 版本=$IMWT_VER 标签=$FLAVOR"

          shopt -s nullglob
          for file in ./firmware_out/*; do
            [ -f "$file" ] || continue
            base=$(basename "$file")
            lower=$(echo "$base" | tr '[:upper:]' '[:lower:]')

            if [[ ! "$lower" =~ hg5382a ]] || [[ ! "$lower" =~ \.(bin|ubi|itb)$ ]]; then
              continue
            fi

            if [[ "$lower" =~ initramfs ]]; then
              FW_TYPE="initramfs"
            elif [[ "$lower" =~ sysupgrade ]]; then
              FW_TYPE="sysupgrade"
            elif [[ "$lower" =~ factory ]]; then
              FW_TYPE="factory"
            else
              FW_TYPE="firmware"
            fi

            NEW_NAME="fiberhome_hg5382a-${IMWT_VER}-${UPSTREAM_DATE}-${FLAVOR}-${FW_TYPE}.${base##*.}"
            echo "重新命名: $base -> $NEW_NAME"
            mv -f "$file" "./firmware_out/$NEW_NAME"
          done

          for bf in ./firmware_out/*.buildinfo; do
            [ -f "$bf" ] || continue
            mv -f "$bf" "${bf%.buildinfo}-${FLAVOR}.buildinfo"
          done
          if [ -f ./firmware_out/profiles.json ]; then
            mv -f ./firmware_out/profiles.json "./firmware_out/profiles-${FLAVOR}.json"
          fi

          (
            cd ./firmware_out
            shopt -s nullglob nocaseglob
            target_files=( *hg5382a*.bin *hg5382a*.ubi *hg5382a*.itb )
            if [ "${#target_files[@]}" -eq 0 ]; then
              echo "::error::firmware_out 内没有 HG5382A 光猫固件映像"
              exit 1
            fi
            sha256sum "${target_files[@]}" > "sha256sums-${FLAVOR}"
            echo "===== ${FLAVOR} 最终产物 ====="
            ls -lh
          )

      # ----------------------------------------------------------------------
      # 15. 上传诊断配置与日志 (即使编译失败也上传)
      # ----------------------------------------------------------------------
      - name: 上传编译配置与日志 (诊断用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG5382A-diagnostics-${{ matrix.flavor }}
          path: |
            ponwrt/.config
            ponwrt/feeds.conf.default
            ponwrt/target/linux/airoha/dts/
            ponwrt/logs/
          if-no-files-found: ignore
          retention-days: 3

      # ----------------------------------------------------------------------
      # 16. 上传固件产物 (供 release job 下载)
      # ----------------------------------------------------------------------
      - name: 上传临时构建产物 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-HG5382A-${{ matrix.flavor }}
          path: ./firmware_out/
          if-no-files-found: error
          retention-days: 1

  # ==========================================================================
  # Job: release - 统一发布至 GitHub Releases
  # ==========================================================================
  release:
    name: 统一发布至 GitHub Releases
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: PonWrt-HG5382A-*
          path: ./all_firmwares
          merge-multiple: true

      - name: 列出待发布文件清单
        run: |
          echo "===== 准备发布的全部光猫固件清单 ====="
          find ./all_firmwares -type f -printf '%s\t%p\n' | sort -k2
          if ! find ./all_firmwares -type f -iname '*hg5382a*' \( -name '*.bin' -o -name '*.ubi' -o -name '*.itb' \) | grep -q .; then
            echo "::error::没有可发布的光猫固件映像"
            exit 1
          fi

      - name: 生成发布标签与日期
        id: tag
        run: |
          export TZ="Asia/Shanghai"
          {
            echo "release_tag=HG5382A-$(date +'%Y.%m.%d-%H%M%S')-r${{ github.run_number }}"
            echo "release_date=$(date +'%Y-%m-%d %H:%M')"
          } >> "$GITHUB_OUTPUT"

      - name: 正式发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: PonWrt HG5382A 双版本纯净光猫固件 (${{ steps.tag.outputs.release_date }})
          fail_on_unmatched_files: true
          body: |
            ### 固件版本说明
            本固件**仅适用于烽火 HG5382A（处理器：AN7581）光猫**。  
            文件名统一格式：`fiberhome_hg5382a-<版本>-<上游日期>-<with-nikki|no-nikki>-<类型>.bin`

            ---

            #### 公共核心组件（两个版本均包含）
            | 类型 | 软件包 | 说明 |
            |------|--------|------|
            | 主题 | `luci-theme-argon` | 纯净 Argon 主题（仅核心） |
            | 终端 | `luci-app-ttyd` | 网页终端（仅核心） |
            | DDNS | `luci-app-ddns` + `ddns-scripts` | 动态域名（仅核心） |
            | 文件 | `openssh-sftp-server` | SFTP 服务器（仅核心） |

            #### 集成版（文件名含 `with-nikki`）
            | 类型 | 软件包 | 说明 |
            |------|--------|------|
            | 代理核心 | `mihomo-meta` | **以 OpenWrt 包方式编译安装**（不再预置二进制） |
            | 代理插件 | `luci-app-nikki` + 简中 | 透明代理管理界面 |
            | 核心模块 | `kmod-nft-tproxy` `kmod-tun` `kmod-inet-diag` `kmod-nft-socket` `kmod-dummy` | TProxy / TUN |
            | 工具 | `ip-full` `yq` | 完整 ip 命令与配置处理 |
            | IPTV | `rtp2httpd` + `luci-app-rtp2httpd` + 简中 | 完整 IPTV 串流转换服务 |
            | 依赖 | `libffi` | 保证 python3 相关编译通过 |
            | AC控制器 | `luci-app-gecoosac` | 集客 AC 控制器（适用 AP 7.6+，**仅集成版包含**） |

            #### 纯净轻量版（文件名含 `no-nikki`）
