# ============================================================================
# 编译 PonWrt HG5382A 集成版固件（mihomo 软件包 + sing-box 共存 + PON 修复）
# ----------------------------------------------------------------------------
# 基于 ix1911/PonWrt-HG5382A 修改：
#   - 单版本集成（不再分 with-nikki / no-nikki），mihomo 与 sing-box 同一镜像共存
#   - mihomo 改为「可卸载软件包」：nikki feed 的 mihomo-meta + nikki + luci-app-nikki
#     （不再把 alpha-smart 二进制硬塞进 files/usr/libexec）
#   - 新增 sing-box：immortalwrt/homeproxy feed 的 luci-app-homeproxy（自动依赖 sing-box）
#   - PON 修复：显式钉住 kmod-airoha-paged-bosa / pon-frontend / xpon + ponctl / pond
#     （HG5382A 光前端 provider 由 paged-bosa 提供；历史失败即因该包没进镜像）
#   - 固定 ponwrt 到已知可用 commit，避免上游漂移再踩「optical frontend provider 缺失」
# ============================================================================
name: 编译 PonWrt HG5382A 集成版固件 (mihomo + sing-box)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-hg5382a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: 编译集成版固件
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # 固定到已验证支持 fiberhome_hg5382a 光前端(paged-bosa) 的上游 commit；
      # 如需跟踪最新上游，把 SOURCE_REF 改成 master
      SOURCE_REF: d01485cc909fac33144dc07fa9dc05ed4455380f
    steps:
      - name: 签出工作流仓库 (Checkout Workflow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 清理磁盘空间 (释放容量)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache
          sudo docker system prune -af || true
          sudo apt-get clean
          sudo swapoff /swapfile || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h
      - name: 初始化编译环境 (安装依赖软件包)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev zstd \
            libzstd-dev jq dos2unix upx-ucl
      - name: 拉取 PonWrt 指定 commit (Clone PonWrt @ pinned)
        run: |
          git init ponwrt
          git -C ponwrt remote add origin https://github.com/pbs05/ponwrt.git
          git -C ponwrt fetch --depth=1 -- origin "$SOURCE_REF"
          git -C ponwrt checkout --detach FETCH_HEAD
          echo ">>> PonWrt pinned: $SOURCE_REF"
      - name: 加入外挂来源 (注入 nikki + homeproxy)
        working-directory: ./ponwrt
        run: |
          if [ ! -f feeds.conf.default ]; then touch feeds.conf.default; fi
          sed -i '/nikki/d;/homeproxy/d' feeds.conf.default
          [ -n "$(tail -c1 feeds.conf.default 2>/dev/null)" ] && echo "" >> feeds.conf.default
          echo 'src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main' >> feeds.conf.default
          echo 'src-git homeproxy https://github.com/immortalwrt/homeproxy.git;master' >> feeds.conf.default
          dos2unix feeds.conf.default 2>/dev/null || true
          echo "===== feeds.conf.default ====="
          tail -n 8 feeds.conf.default
      - name: 缓存下载软件包 (Cache dl)
        uses: actions/cache@v4
        with:
          path: ponwrt/dl
          key: ponwrt-dl-an7581-${{ hashFiles('ponwrt/feeds.conf.default', 'ponwrt/configs/*.config') }}
          restore-keys: |
            ponwrt-dl-an7581-
            ponwrt-dl-
      - name: 更新并安装外挂来源 (Feeds)
        working-directory: ./ponwrt
        run: |
          ./scripts/feeds update -a
          if [ -d feeds/nikki ]; then
            echo ">>> 剔除 nikki 的 +yq 依赖（改由 CONFIG_PACKAGE_yq=y 显式提供）"
            find feeds/nikki -name Makefile -exec sed -i -E 's/[[:space:]]*\+yq\b//g' {} + || true
          fi
          ./scripts/feeds install -a
          # 默认主题改 Argon
          if [ -f feeds/luci/collections/luci/Makefile ]; then
            sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile || true
          fi
      - name: 生成并锁定 HG5382A 配置 (PON 修复 + mihomo + sing-box)
        working-directory: ./ponwrt
        run: |
          rm -rf tmp
          perl ./scripts/kconfig.pl + configs/an7581.config configs/release.config > .config
          sed -i '/CONFIG_TARGET_ALL_PROFILES/d' .config
          sed -i '/CONFIG_TARGET_MULTI_PROFILE/d' .config
          sed -i '/CONFIG_TARGET_airoha_an7581_DEVICE_/d' .config
          sed -i '/CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_/d' .config
          cat >> .config << 'EOF'
          # CONFIG_TARGET_ALL_PROFILES is not set
          # CONFIG_TARGET_MULTI_PROFILE is not set
          CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5382a=y
          CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_fiberhome_hg5382a=y
          # === 公共核心 ===
          CONFIG_PACKAGE_luci-theme-argon=y
          # CONFIG_PACKAGE_luci-theme-bootstrap is not set
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          EOF
          make defconfig
          # 单一机型校验
          sp=$(grep -cE '^CONFIG_TARGET_airoha_an7581_DEVICE_.*=y$' .config || true)
          if [ "$sp" -ne 1 ] || ! grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_fiberhome_hg5382a=y$' .config; then
            echo "::error::HG5382A 单一机型锁定校验失败！"
            exit 1
          fi
          # ==== defconfig 之后显式钉住关键包（防上游漂移 / 被 defconfig 洗掉）====
          cat >> .config << 'EOF'
          # --- PON 修复：HG5382A 光前端 provider 必须内建（paged-bosa 提供 fiberhome,hg5x-bosa）---
          CONFIG_PACKAGE_kmod-airoha-paged-bosa=y
          CONFIG_PACKAGE_kmod-airoha-pon-frontend=y
          CONFIG_PACKAGE_kmod-airoha-xpon=y
          CONFIG_PACKAGE_airoha-ponctl=y
          CONFIG_PACKAGE_airoha-pond=y
          # --- 透明代理内核模块（mihomo/sing-box 共用底座）---
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-dummy=y
          # --- mihomo（可卸载软件包；nikki feed；mihomo-meta=稳定通道，要最新可改 mihomo-alpha）---
          CONFIG_PACKAGE_mihomo-meta=y
          CONFIG_PACKAGE_nikki=y
          CONFIG_PACKAGE_luci-app-nikki=y
          CONFIG_PACKAGE_luci-i18n-nikki-zh-cn=y
          # --- sing-box（immortalwrt/homeproxy，界面自动依赖 sing-box + firewall4 + kmod-nft-tproxy）---
          CONFIG_PACKAGE_luci-app-homeproxy=y
          # --- 工具 ---
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_yq=y
          # --- python3 编译修复：_ctypes 需要 ffi.h，上游 an7581.config 未选 libffi，导致
          #     Python-3.14.7 编译在 profile-opt 阶段 fatal error: ffi.h（主固件上次失败根因）---
          CONFIG_PACKAGE_libffi=y
          EOF
          # 校验关键包是否进入 .config
          for pkg in kmod-airoha-paged-bosa kmod-airoha-pon-frontend kmod-airoha-xpon \
                     mihomo-meta nikki luci-app-nikki luci-app-homeproxy; do
            if ! grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config; then
              echo "::warning::${pkg} 未在 .config 中 =y（可能被依赖折叠），继续构建"
            else
              echo ">>> 已锁定 ${pkg}"
            fi
          done
      - name: 下载源码软件包 (容错)
        working-directory: ./ponwrt
        run: |
          export GOPROXY=https://goproxy.cn,https://goproxy.io,direct
          export GO111MODULE=on
          make download -j"$(nproc)" || true
          find dl -type f -size -1024c ! -path 'dl/go-mod-cache/*' -delete
          make download -j1 V=s || { echo "::warning::仍有软件包下载失败，编译阶段会再尝试"; }
          find dl -type f -size -1024c ! -path 'dl/go-mod-cache/*' -delete
      - name: 执行固件编译 (Compile Firmware)
        working-directory: ./ponwrt
        run: |
          export GOPROXY=https://goproxy.cn,https://goproxy.io,direct
          export GOSUMDB=sum.golang.org
          export GO111MODULE=on
          export GOENV=off
          export GOTOOLCHAIN=local
          mkdir -p logs
          # 先显式编译 libffi（python3 的 ffi.h 依赖；路径按 feeds install 后的目录，双路径兜底）
          make package/feeds/packages/libffi/compile -j"$(nproc)" V=s \
            || make package/libs/libffi/compile -j"$(nproc)" V=s || true
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee logs/build.log || \
            (echo ">>> 并行编译失败，回退单线程重编" && make -j1 V=s 2>&1 | tee -a logs/build.log)
      - name: 整理产物 (Collect Firmware)
        run: |
          mkdir -p ./firmware_out
          find ponwrt/bin/targets/airoha/an7581/ -type f \( \
            -iname '*hg5382a*.bin' -o \
            -iname '*hg5382a*.ubi' -o \
            -iname '*hg5382a*.itb' -o \
            -name '*.buildinfo' -o \
            -name 'profiles.json' \
          \) -exec cp -f {} ./firmware_out/ \;
          (
            cd ./firmware_out
            shopt -s nullglob nocaseglob
            files=( *hg5382a*.bin *hg5382a*.ubi *hg5382a*.itb )
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::firmware_out 内没有 HG5382A 固件映像"
              exit 1
            fi
            sha256sum "${files[@]}" > sha256sums
            echo "===== 最终产物 ====="
            ls -lh
          )
      - name: 上传固件 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PonWrt-HG5382A-integrated
          path: ./firmware_out/
          if-no-files-found: error
          retention-days: 14
      - name: 上传编译配置与日志 (诊断用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HG5382A-diagnostics
          path: |
            ponwrt/.config
            ponwrt/feeds.conf.default
            ponwrt/target/linux/airoha/dts/
            ponwrt/logs/
          if-no-files-found: ignore
          retention-days: 3
